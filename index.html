<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1976D2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فروش ورق">
<title>اپ فروش ورق کامپوزیت</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --md-primary:#1976D2;--md-primary-light:#42A5F5;--md-primary-dark:#1565C0;
  --md-on-primary:#FFFFFF;--md-primary-container:#D1E4FF;--md-on-primary-container:#001D36;
  --md-secondary:#546E7A;--md-secondary-container:#CFE5F2;
  --md-tertiary:#6D5E00;--md-tertiary-container:#FBE366;
  --md-surface:#FAFCFF;--md-surface-variant:#DDE4EC;--md-surface-1:#F2F6FC;--md-surface-2:#EDF1F8;--md-surface-3:#E8ECF4;
  --md-on-surface:#1A1C1E;--md-on-surface-variant:#44474E;--md-outline:#74777F;--md-outline-variant:#C4C6D0;
  --md-error:#BA1A1A;--md-error-container:#FFDAD6;--md-on-error:#FFFFFF;
  --md-success:#1B6D3A;--md-success-container:#A8F5B8;
  --md-warning:#7D5700;--md-warning-container:#FFDEA1;
  --md-elevation-1:0 1px 2px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.08);
  --md-elevation-2:0 2px 4px rgba(0,0,0,.1),0 4px 8px rgba(0,0,0,.06);
  --md-elevation-3:0 4px 8px rgba(0,0,0,.1),0 8px 16px rgba(0,0,0,.06);
  --md-shape-xs:4px;--md-shape-sm:8px;--md-shape-md:12px;--md-shape-lg:16px;--md-shape-xl:28px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;scroll-behavior:smooth}
body{font-family:"Vazirmatn","Noto Sans Arabic",-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--md-on-surface);background:var(--md-surface);font-size:15px;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--md-primary);text-decoration:none}
.num{font-variant-numeric:tabular-nums}
#app{height:100%}
.shell{display:flex;height:100vh}
.sidebar{width:240px;background:var(--md-surface);border-left:1px solid var(--md-outline-variant);display:flex;flex-direction:column;flex-shrink:0}
.side-brand{padding:20px 16px 12px;display:flex;align-items:center;gap:10px}
.side-brand .logo{width:38px;height:38px;border-radius:var(--md-shape-md);background:linear-gradient(135deg,var(--md-primary),var(--md-primary-light));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;box-shadow:0 4px 12px rgba(25,118,210,.3)}
.side-brand b{font-size:15px;display:block;line-height:1.3}
.side-brand span{font-size:12px;color:var(--md-on-surface-variant)}
.side-nav{padding:8px;flex:1;overflow-y:auto}
.side-nav button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;background:transparent;border-radius:var(--md-shape-md);cursor:pointer;font-size:14.5px;color:var(--md-on-surface);text-align:right;min-height:46px;transition:all .15s ease}
.side-nav button:hover{background:var(--md-surface-1)}
.side-nav button.active{background:var(--md-primary-container);color:var(--md-on-primary-container);font-weight:600}
.side-nav .ic{width:22px;display:flex;align-items:center;justify-content:center}
.side-user{border-top:1px solid var(--md-outline-variant);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-user .who b{display:block;font-size:13.5px}
.side-user .who span{font-size:12px;color:var(--md-on-surface-variant)}
.linkbtn{border:0;background:none;color:var(--md-error);cursor:pointer;font-size:13px;padding:6px}
.install-btn{display:none;width:100%;margin:8px 0;padding:10px;border:1px solid var(--md-primary-container);background:var(--md-primary-container);color:var(--md-primary);border-radius:var(--md-shape-md);cursor:pointer;font-size:13px;font-weight:600;text-align:center;gap:6px}
.install-btn:hover{background:var(--md-primary);color:#fff}
.main{flex:1;overflow:auto;padding:24px 28px 96px;background:var(--md-surface)}
.container{max-width:1100px;margin:0 auto}
.h1{font-size:24px;font-weight:800;margin-bottom:4px;let ter-spacing:-.3px}
.sub{color:var(--md-on-surface-variant);font-size:13.5px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.card{background:var(--md-surface);border:1px solid var(--md-outline-variant);border-radius:var(--md-shape-lg);padding:20px;box-shadow:var(--md-elevation-1)}
.card+.card{margin-top:16px}
.card h3{font-size:16px;font-weight:700;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--md-outline-variant);background:var(--md-surface);border-radius:var(--md-shape-md);padding:10px 18px;cursor:pointer;font-size:14px;min-height:44px;transition:all .18s ease;position:relative;overflow:hidden}
.btn:hover{background:var(--md-surface-1);box-shadow:var(--md-elevation-1)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--md-primary);border-color:var(--md-primary);color:var(--md-on-primary);font-weight:600;box-shadow:0 2px 10px rgba(25,118,210,.28)}
.btn.primary:hover{background:var(--md-primary-dark);box-shadow:0 4px 14px rgba(25,118,210,.35)}
.btn.green{background:var(--md-success);border-color:var(--md-success);color:#fff;font-weight:600}
.btn.danger{background:var(--md-error-container);border-color:var(--md-error-container);color:var(--md-error);font-weight:600}
.btn.ghost{border-color:transparent;background:transparent;color:var(--md-primary)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:13px;border-radius:var(--md-shape-sm)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--md-on-surface-variant);margin-bottom:6px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border:1.5px solid var(--md-outline-variant);border-radius:var(--md-shape-md);background:var(--md-surface);min-height:44px;transition:border-color .15s ease}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--md-primary);box-shadow:0 0 0 3px rgba(25,118,210,.12)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:0 12px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12.5px;color:var(--md-on-surface-variant);font-weight:600;text-align:right;padding:10px 12px;border-bottom:1.5px solid var(--md-outline-variant);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--md-surface-variant);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer;transition:background .1s}
.tbl tr.click:hover td{background:var(--md-surface-1)}
.badge{display:inline-flex;align-items:center;padding:3px 12px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;gap:4px}
.badge.gray{background:var(--md-surface-variant);color:var(--md-on-surface-variant)}
.badge.green{background:var(--md-success-container);color:var(--md-success)}
.badge.red{background:var(--md-error-container);color:var(--md-error)}
.badge.orange{background:var(--md-warning-container);color:var(--md-warning)}
.badge.blue{background:var(--md-primary-container);color:var(--md-primary)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--md-outline-variant);background:var(--md-surface);border-radius:99px;padding:7px 16px;font-size:13px;cursor:pointer;min-height:38px;transition:all .15s ease;font-weight:500}
.chip:hover{background:var(--md-surface-1);border-color:var(--md-outline)}
.chip.active{background:var(--md-primary);border-color:var(--md-primary);color:var(--md-on-primary);font-weight:600}
.bigtabs{display:flex;gap:0;border:1.5px solid var(--md-outline-variant);border-radius:var(--md-shape-md);overflow:hidden;margin-bottom:16px;width:fit-content}
.bigtabs button{border:0;background:var(--md-surface);padding:11px 28px;cursor:pointer;font-size:14.5px;min-height:48px;transition:all .15s;font-weight:500}
.bigtabs button.active{background:var(--md-primary);color:var(--md-on-primary);font-weight:700}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar input[type=search]{flex:1;min-width:180px;padding:11px 14px;border:1.5px solid var(--md-outline-variant);border-radius:var(--md-shape-md);min-height:44px}
.toolbar select{padding:10px 12px;border:1.5px solid var(--md-outline-variant);border-radius:var(--md-shape-md);min-height:44px;background:var(--md-surface)}
.empty{text-align:center;color:var(--md-on-surface-variant);padding:40px 16px;font-size:14px}
.notice{border-radius:var(--md-shape-md);padding:12px 16px;font-size:13.5px;margin-bottom:14px;font-weight:500}
.notice.red{background:var(--md-error-container);color:#8C1D18}
.notice.green{background:var(--md-success-container);color:#14532D}
.notice.orange{background:var(--md-warning-container);color:#5D4200}
.notice.blue{background:var(--md-primary-container);color:var(--md-on-primary-container)}
.money{font-weight:600}
.pos{color:var(--md-error)} .neg{color:var(--md-success)}
.login{height:100dvh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#D1E4FF 0%,#FAFCFF 100%);overflow:hidden}
.login-card{width:400px;max-width:100%;background:var(--md-surface);border-radius:var(--md-shape-xl);padding:32px 28px;box-shadow:var(--md-elevation-3)}
.login-card .logo{width:56px;height:56px;border-radius:var(--md-shape-lg);background:linear-gradient(135deg,var(--md-primary),var(--md-primary-light));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;margin:0 auto 14px;box-shadow:0 6px 16px rgba(25,118,210,.3)}
.login-card h1{font-size:20px;text-align:center;margin-bottom:2px;font-weight:800}
.login-card .sub{text-align:center;display:block;margin-bottom:22px}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.rolepick button{border:1.5px solid var(--md-outline-variant);background:var(--md-surface);border-radius:var(--md-shape-md);padding:16px 12px;cursor:pointer;text-align:center;transition:all .15s}
.rolepick button:hover{border-color:var(--md-outline);background:var(--md-surface-1)}
.rolepick button.active{border-color:var(--md-primary);background:var(--md-primary-container)}
.rolepick b{display:block;font-size:14.5px}
.rolepick span{font-size:12px;color:var(--md-on-surface-variant)}
.demo-hint{margin-top:14px;font-size:12px;color:var(--md-on-surface-variant);text-align:center}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.quick button{border:1px solid var(--md-outline-variant);background:var(--md-surface);border-radius:var(--md-shape-lg);padding:18px 12px;cursor:pointer;text-align:center;min-height:100px;transition:all .18s;box-shadow:var(--md-elevation-1)}
.quick button:hover{border-color:var(--md-primary);background:var(--md-primary-container);box-shadow:var(--md-elevation-2)}
.quick .qic{width:48px;height:48px;border-radius:var(--md-shape-md);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:0}
.quick .q1 .qic{background:var(--md-primary-container);color:var(--md-primary)}
.quick .q2 .qic{background:var(--md-warning-container);color:var(--md-warning)}
.quick .q3 .qic{background:var(--md-success-container);color:var(--md-success)}
.quick .q4 .qic{background:var(--md-surface-2);color:var(--md-on-surface)}
.quick b{font-size:14px;font-weight:600}
.cust-result{border:1px solid var(--md-outline-variant);border-radius:var(--md-shape-md);margin-top:6px;overflow:hidden;box-shadow:var(--md-elevation-1)}
.cust-result button{display:block;width:100%;text-align:right;padding:11px 14px;border:0;border-bottom:1px solid var(--md-surface-variant);background:var(--md-surface);cursor:pointer;font-size:14px;transition:background .1s}
.cust-result button:hover{background:var(--md-surface-1)}
.cust-result button:last-child{border-bottom:0}
.custchip{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--md-surface-1);border:1px solid var(--md-outline-variant);border-radius:var(--md-shape-md);padding:12px 14px;flex-wrap:wrap}
.itemrow{border:1px solid var(--md-outline-variant);border-radius:var(--md-shape-md);padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;background:var(--md-surface)}
.itemrow .t b{font-size:14.5px}
.itemrow .t span{display:block;font-size:13px;color:var(--md-on-surface-variant)}
.sumline{display:flex;justify-content:space-between;padding:8px 0;font-size:14.5px}
.sumline.total{border-top:1.5px solid var(--md-outline-variant);margin-top:6px;padding-top:12px;font-size:17px;font-weight:800}
.payopts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.payopts button{border:1.5px solid var(--md-outline-variant);border-radius:var(--md-shape-md);padding:12px 8px;background:var(--md-surface);cursor:pointer;font-size:13.5px;min-height:46px;transition:all .15s}
.payopts button.active{border-color:var(--md-primary);background:var(--md-primary-container);font-weight:700}
.stat-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--md-surface);border:1px solid var(--md-outline-variant);border-radius:var(--md-shape-lg);padding:18px;box-shadow:var(--md-elevation-1);transition:box-shadow .15s,transform .15s}
.stat:hover{box-shadow:var(--md-elevation-2);transform:translateY(-1px)}
.stat .k{font-size:12.5px;color:var(--md-on-surface-variant);margin-bottom:6px;font-weight:500}
.stat .v{font-size:18px;font-weight:800}
.stat .icon{width:40px;height:40px;border-radius:var(--md-shape-md);display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:20px}
.stat .icon.blue{background:var(--md-primary-container);color:var(--md-primary)}
.stat .icon.green{background:var(--md-success-container);color:var(--md-success)}
.stat .icon.orange{background:var(--md-warning-container);color:var(--md-warning)}
.stat .icon.red{background:var(--md-error-container);color:var(--md-error)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;min-height:44px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;backdrop-filter:blur(2px)}
.modal{background:var(--md-surface);border-radius:var(--md-shape-xl);width:500px;max-width:100%;max-height:92vh;overflow:auto;padding:28px;box-shadow:var(--md-elevation-3)}
.modal.wide{width:900px}
.modal h3{font-size:18px;margin-bottom:18px;font-weight:700}
.modal .actions{display:flex;gap:10px;justify-content:flex-start;margin-top:8px;flex-wrap:wrap}
.docwrap{background:var(--md-surface-1);border-radius:var(--md-shape-md);padding:14px;max-height:56vh;overflow:auto;margin-bottom:14px}
.bottomnav{display:none}
@media (max-width:820px){
  .sidebar{display:none}
  .main{padding:16px 16px calc(80px + env(safe-area-inset-bottom))}
  .quick{grid-template-columns:1fr 1fr}
  .grid2,.grid3,.grid4,.grid5{grid-template-columns:1fr}
  .stat-cards{grid-template-columns:1fr 1fr}
  .payopts{grid-template-columns:1fr}
  .bottomnav{display:flex;position:fixed;bottom:0;right:0;left:0;background:var(--md-surface);border-top:1px solid var(--md-outline-variant);z-index:40;justify-content:space-around;padding:4px 2px calc(4px + env(safe-area-inset-bottom));height:56px}
  .bottomnav button{border:0;background:none;font-size:11px;color:var(--md-on-surface-variant);display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 6px;cursor:pointer;min-width:50px;min-height:44px}
  .bottomnav button.active{color:var(--md-primary);font-weight:700}
  .bottomnav .nic{font-size:18px}
  .bottomnav .plus{width:46px;height:46px;border-radius:50%;background:var(--md-primary);color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;margin-top:-20px;box-shadow:0 4px 14px rgba(25,118,210,.4)}
}
.tblwrap{overflow-x:auto}
#print-root{display:none}
@media print{body>*{display:none !important}#print-root{display:block !important;background:#fff}}
.svgic{vertical-align:-4px;flex-shrink:0}
.opmenu{position:absolute;left:0;top:calc(100% + 6px);background:var(--md-surface);border:1px solid var(--md-outline-variant);border-radius:var(--md-shape-lg);box-shadow:var(--md-elevation-3);padding:8px;display:none;z-index:50;min-width:240px;max-width:90vw}
.opmenu.open{display:block;animation:menuFadeIn .15s ease}
@keyframes menuFadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.opmenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:none;border:0;padding:11px 14px;border-radius:var(--md-shape-md);cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--md-on-surface);transition:background .12s}
.opmenu button:hover{background:var(--md-surface-1)}
.opmenu button .op-icon{width:32px;height:32px;border-radius:var(--md-shape-sm);background:var(--md-primary-container);color:var(--md-primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opmenu button .op-text{display:flex;flex-direction:column;gap:2px}
.opmenu button .op-text span:last-child{font-size:11px;color:var(--md-on-surface-variant)}
.invsum{display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:var(--md-surface);border:1px solid var(--md-outline-variant);border-radius:var(--md-shape-lg);padding:12px 16px;margin-bottom:14px;font-size:13.5px}
.hero{background:linear-gradient(120deg,#D1E4FF 0%,#F0F7FF 100%);border:1px solid var(--md-outline-variant);border-radius:var(--md-shape-xl);padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}
.hero .h1{margin-bottom:2px}
.hero-art{flex-shrink:0}
@media(max-width:560px){.hero-art{display:none}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pcard{background:var(--md-surface);border:1px solid var(--md-outline-variant);border-radius:var(--md-shape-lg);padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--md-elevation-1);position:relative;transition:box-shadow .2s,transform .2s}
.pcard:hover{box-shadow:var(--md-elevation-2);transform:translateY(-2px)}
.pc-head{display:flex;align-items:center;gap:10px}
.pc-swatch{width:40px;height:40px;border-radius:var(--md-shape-md);border:1px solid rgba(0,0,0,.08);flex-shrink:0}
.pc-title{flex:1;min-width:0}.pc-title b{display:block;font-size:14.5px;line-height:1.4}.pc-title span{font-size:12px;color:var(--md-on-surface-variant)}
.pc-dim{background:var(--md-surface-1);border-radius:var(--md-shape-sm);padding:7px 10px;font-size:12px;color:var(--md-on-surface-variant);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pc-dim b{color:var(--md-on-surface);font-size:14.5px}
.pc-stocks{display:flex;gap:8px}
.pc-stocks div{flex:1;background:var(--md-surface-1);border-radius:var(--md-shape-sm);padding:7px 4px;text-align:center}
.pc-stocks span{display:block;font-size:10.5px;color:var(--md-on-surface-variant)}
.pc-stocks b{font-size:14px}
.pc-stocks .tot{background:var(--md-primary-container)}.pc-stocks .tot b{color:var(--md-primary)}
.pc-info{display:flex;flex-direction:column;gap:4px;padding:8px 10px;background:var(--md-surface-1);border-radius:var(--md-shape-sm);font-size:12px}
.pc-info div{display:flex;justify-content:space-between;align-items:center}
.pc-info span{color:var(--md-on-surface-variant)}
.pc-info b{color:var(--md-on-surface);font-size:13px}
.pc-prices{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;border-top:1px dashed var(--md-outline-variant);padding-top:8px}
.pc-prices div{display:flex;gap:6px;align-items:baseline}
.pc-prices span{color:var(--md-on-surface-variant);font-size:11.5px}
.pc-edit{position:absolute;top:12px;left:12px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(305px,1fr));gap:12px}

.cat6-empty{text-align:center;padding:60px 20px;color:var(--md-on-surface-variant)}
.cat6-empty h3{font-size:18px;font-weight:700;margin-bottom:4px}

.cat6-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s}
.cat6-modal{background:var(--md-surface);border-radius:var(--md-shape-xl);padding:28px;width:90%;max-width:420px;box-shadow:var(--md-elevation-3);animation:slideUp .2s;max-height:80vh;overflow-y:auto}

.dash-widget{background:var(--md-surface);border:1px solid var(--md-outline-variant);border-radius:var(--md-shape-lg);padding:18px;box-shadow:var(--md-elevation-1)}

.dash-widget h4 .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.chart-bar{display:flex;align-items:flex-end;gap:6px;height:80px;padding-top:8px}
.chart-bar .bar{flex:1;border-radius:var(--md-shape-xs) var(--md-shape-xs) 0 0;background:var(--md-primary-container);transition:height .3s;min-height:4px;position:relative}
.chart-bar .bar:hover{background:var(--md-primary)}

.task-check:hover{border-color:var(--md-primary);background:var(--md-primary-container)}
.task-check.done{background:var(--md-success);border-color:var(--md-success);color:#fff}
/* ===== approval center ===== */

.approval-badge.pending{background:var(--md-warning-container);color:var(--md-on-warning-container)}
.approval-badge.approved{background:var(--md-success-container);color:var(--md-on-success-container)}
.approval-badge.rejected{background:var(--md-error-container);color:var(--md-on-error-container)}
.approval-badge.cancelled{background:var(--md-surface-variant);color:var(--md-on-surface-variant)}

/* ===== permission badges ===== */
.perm-badge{display:inline-block;padding:2px 6px;border-radius:8px;font-size:10px;margin:2px}
.perm-badge.granted{background:var(--md-success-container);color:var(--md-on-success-container)}
.perm-badge.denied{background:var(--md-error-container);color:var(--md-on-error-container)}
/* ===== Phase 5.5: Audit Center ===== */

.control-tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:2px solid var(--md-outline-variant);padding-bottom:0}
.control-tab{padding:8px 16px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--md-on-surface-variant);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}

.report-stat .lbl{font-size:10px;color:var(--md-on-surface-variant);margin-top:2px}

/* =============== persistence layer =============== */
const Storage = {
  get() { return DB; },
  save() { save(); },
  backup(label) {
    const backup = JSON.parse(JSON.stringify(DB));
    const key = 'cs_engine_backup_' + Date.now();
    try { localStorage.setItem(key, JSON.stringify({ db: backup, label: label || '', time: new Date().toISOString() })); } catch(e) {}
    return key;
  },
  restore(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      return JSON.parse(raw).db;
    } catch(e) { return null; }
  },
  snapshot() { return JSON.parse(JSON.stringify(DB)); },
  rollback(snap) { if (snap) { Object.assign(DB, snap); save(); } }
};

/* =============== inventory engine =============== */
const TX_TYPES = {
  RECEIVE: 'RECEIVE',
  SALE: 'SALE',
  RESERVATION: 'RESERVATION',
  RESERVATION_RELEASE: 'RESERVATION_RELEASE',
  TRANSFER_OUT: 'TRANSFER_OUT',
  TRANSFER_IN: 'TRANSFER_IN',
  ADJUSTMENT: 'ADJUSTMENT',
  RETURN: 'RETURN',
  CANCELLATION: 'CANCELLATION',
  STOCKTAKE: 'STOCKTAKE'
};

const RES_STATUS = {
  ACTIVE: 'ACTIVE',
  RELEASED: 'RELEASED',
  CONVERTED: 'CONVERTED',
  CANCELLED: 'CANCELLED'
};

// Product index for O(1) lookups
let _productIndex = null;
function buildProductIndex() {
  _productIndex = new Map();
  DB.products.forEach(p => _productIndex.set(p.id, p));
}
function getProdById(id) {
  if (!_productIndex) buildProductIndex();
  return _productIndex.get(id) || null;
}
function rebuildIndex() { _productIndex = null; }

// Create ledger entry
function createLedgerEntry(type, productId, warehouseId, quantity, refType, refId, reason, metadata, prevBalance) {
  const p = getProdById(productId);
  const prevBal = prevBalance !== undefined ? prevBalance : (p ? (p.stock[warehouseId] || 0) : 0);
  const entry = {
    id: uid(),
    timestamp: new Date().toISOString(),
    type: type,
    productId: productId,
    warehouseId: warehouseId,
    quantity: quantity,
    referenceType: refType || '',
    referenceId: refId || '',
    userId: (session && session.name) || '—',
    userRole: (session && session.role) || '',
    reason: reason || '',
    previousBalance: prevBal,
    newBalance: prevBal + quantity,
    metadata: metadata || null
  };
  DB.inventoryTransactions.push(entry);
  // Keep ledger bounded
  if (DB.inventoryTransactions.length > 5000) DB.inventoryTransactions.splice(0, DB.inventoryTransactions.length - 5000);
  return entry;
}

// Create audit entry automatically from engine
function engineAudit(type, detail, oldVal, newVal) {
  auditLog(type, detail, oldVal, newVal);
}

// Atomic operation wrapper
function atomicOp(fn) {
  const snap = Storage.snapshot();
  try {
    fn();
    save();
    rebuildIndex();
  } catch(e) {
    Storage.rollback(snap);
    rebuildIndex();
    throw e;
  }
}

// Main Inventory Engine
const InventoryEngine = {
  // Receive stock into warehouse
  receive(opts) {
    const { productId, warehouseId, quantity, referenceType, referenceId, reason } = opts;
    if (!productId || !warehouseId) throw new Error('productId and warehouseId required');
    if (!Number.isInteger(quantity) || quantity <= 0) throw new Error('quantity must be positive integer');
    const p = getProdById(productId);
    if (!p) throw new Error('product not found');
    const snap = Storage.snapshot();
    try {
      const prevBal = p.stock[warehouseId] || 0;
      p.stock[warehouseId] = prevBal + quantity;
      const entry = createLedgerEntry(TX_TYPES.RECEIVE, productId, warehouseId, quantity, referenceType, referenceId, reason, null, prevBal);
      engineAudit('inventory_receive', `ورود ${fmt(quantity)} ورق ${prodName(p)} به ${whName(warehouseId)}`, null, { qty: quantity, wh: warehouseId });
      save();
      rebuildIndex();
      return entry;
    } catch(e) {
      Storage.rollback(snap);
      rebuildIndex();
      throw e;
    }
  },

  // Sell stock (deduct for invoice)
  sell(opts) {
    const { productId, warehouseId, quantity, referenceType, referenceId, reason } = opts;
    if (!productId || !warehouseId) throw new Error('productId and warehouseId required');
    if (!Number.isInteger(quantity) || quantity <= 0) throw new Error('quantity must be positive integer');
    const p = getProdById(productId);
    if (!p) throw new Error('product not found');
    const available = this.getAvailable(productId, warehouseId);
    if (available < quantity) throw new Error('INSUFFICIENT_STOCK');
    const snap = Storage.snapshot();
    try {
      const prevBal = p.stock[warehouseId] || 0;
      p.stock[warehouseId] = prevBal - quantity;
      const entry = createLedgerEntry(TX_TYPES.SALE, productId, warehouseId, -quantity, referenceType, referenceId, reason, null, prevBal);
      engineAudit('inventory_sale', `فروش ${fmt(quantity)} ورق ${prodName(p)} از ${whName(warehouseId)}`, null, { qty: -quantity, wh: warehouseId });
      save();
      rebuildIndex();
      return entry;
    } catch(e) {
      Storage.rollback(snap);
      rebuildIndex();
      throw e;
    }
  },

  // Reserve stock
  reserve(opts) {
    const { productId, warehouseId, quantity, referenceType, referenceId, reason } = opts;
    if (!productId || !warehouseId) throw new Error('productId and warehouseId required');
    if (!Number.isInteger(quantity) || quantity <= 0) throw new Error('quantity must be positive integer');
    const p = getProdById(productId);
    if (!p) throw new Error('product not found');
    const available = this.getAvailable(productId, warehouseId);
    if (available < quantity) throw new Error('INSUFFICIENT_STOCK');
    const reservation = {
      id: uid(),
      productId, warehouseId, quantity,
      referenceType: referenceType || 'manual',
      referenceId: referenceId || '',
      status: RES_STATUS.ACTIVE,
      createdAt: new Date().toISOString(),
      createdBy: (session && session.name) || '—',
      releasedAt: null
    };
    DB.inventoryReservations.push(reservation);
    const entry = createLedgerEntry(TX_TYPES.RESERVATION, productId, warehouseId, 0, referenceType, referenceId, reason || 'رزرو موجودی');
    engineAudit('inventory_reserve', `رزرو ${fmt(quantity)} ورق ${prodName(p)} در ${whName(warehouseId)}`, null, { qty: quantity, wh: warehouseId });
    save();
    rebuildIndex();
    return reservation;
  },

  // Release reservation
  releaseReservation(opts) {
    const { reservationId, quantity, reason } = opts;
    const res = DB.inventoryReservations.find(r => r.id === reservationId && r.status === RES_STATUS.ACTIVE);
    if (!res) throw new Error('reservation not found');
    if (quantity && quantity > res.quantity) throw new Error('release quantity exceeds reserved');
    const releaseQty = quantity || res.quantity;
    const snap = Storage.snapshot();
    try {
      if (releaseQty >= res.quantity) {
        res.status = RES_STATUS.RELEASED;
        res.releasedAt = new Date().toISOString();
      } else {
        res.quantity -= releaseQty;
      }
      const entry = createLedgerEntry(TX_TYPES.RESERVATION_RELEASE, res.productId, res.warehouseId, 0, 'reservation', reservationId, reason || 'آزادسازی رزرو');
      engineAudit('inventory_release', `آزادسازی ${fmt(releaseQty)} ورق رزرو شده`, null, { qty: releaseQty });
      save();
      rebuildIndex();
      return res;
    } catch(e) {
      Storage.rollback(snap);
      rebuildIndex();
      throw e;
    }
  },

  // Transfer out
  transferOut(opts) {
    const { productId, warehouseId, quantity, referenceType, referenceId, reason } = opts;
    const p = getProdById(productId);
    if (!p) throw new Error('product not found');
    if ((p.stock[warehouseId] || 0) < quantity) throw new Error('INSUFFICIENT_STOCK');
    const snap = Storage.snapshot();
    try {
      const prevBal = p.stock[warehouseId] || 0;
      p.stock[warehouseId] = prevBal - quantity;
      const entry = createLedgerEntry(TX_TYPES.TRANSFER_OUT, productId, warehouseId, -quantity, referenceType, referenceId, reason, null, prevBal);
      engineAudit('inventory_transfer_out', `خروج انتقال ${fmt(quantity)} ورق ${prodName(p)} از ${whName(warehouseId)}`, null, { qty: -quantity, wh: warehouseId });
      save();
      rebuildIndex();
      return entry;
    } catch(e) {
      Storage.rollback(snap);
      rebuildIndex();
      throw e;
    }
  },

  // Transfer in
  transferIn(opts) {
    const { productId, warehouseId, quantity, referenceType, referenceId, reason } = opts;
    const p = getProdById(productId);
    if (!p) throw new Error('product not found');
    const snap = Storage.snapshot();
    try {
      const prevBal = p.stock[warehouseId] || 0;
      p.stock[warehouseId] = prevBal + quantity;
      const entry = createLedgerEntry(TX_TYPES.TRANSFER_IN, productId, warehouseId, quantity, referenceType, referenceId, reason, null, prevBal);
      engineAudit('inventory_transfer_in', `ورود انتقال ${fmt(quantity)} ورق ${prodName(p)} به ${whName(warehouseId)}`, null, { qty: quantity, wh: warehouseId });
      save();
      rebuildIndex();
      return entry;
    } catch(e) {
      Storage.rollback(snap);
      rebuildIndex();
      throw e;
    }
  },

  // Adjust stock to match physical count
  adjust(opts) {
    const { productId, warehouseId, newQuantity, referenceType, referenceId, reason } = opts;
    if (!productId || !warehouseId) throw new Error('productId and warehouseId required');
    if (!Number.isInteger(newQuantity) || newQuantity < 0) throw new Error('newQuantity must be non-negative integer');
    const p = getProdById(productId);
    if (!p) throw new Error('product not found');
    const oldQty = p.stock[warehouseId] || 0;
    const diff = newQuantity - oldQty;
    if (diff === 0) return null;
    const snap = Storage.snapshot();
    try {
      p.stock[warehouseId] = newQuantity;
      const entry = createLedgerEntry(TX_TYPES.ADJUSTMENT, productId, warehouseId, diff, referenceType || 'adjustment', referenceId || '', reason || 'اصلاح موجودی', null, oldQty);
      DB.adjustments.push({ id: uid(), productId, wh: warehouseId, before: oldQty, after: newQuantity, reason: reason || 'اصلاح موجودی', date: todayISO(), by: (session && session.name) || '—' });
      engineAudit('inventory_adjust', `اصلاح موجودی ${prodName(p)} در ${whName(warehouseId)}: ${fmt(oldQty)} → ${fmt(newQuantity)}`, { qty: oldQty }, { qty: newQuantity });
      save();
      rebuildIndex();
      return entry;
    } catch(e) {
      Storage.rollback(snap);
      rebuildIndex();
      throw e;
    }
  },

  // Return stock (from cancelled invoice)
  returnStock(opts) {
    const { productId, warehouseId, quantity, referenceType, referenceId, reason } = opts;
    const p = getProdById(productId);
    if (!p) throw new Error('product not found');
    const snap = Storage.snapshot();
    try {
      const prevBal = p.stock[warehouseId] || 0;
      p.stock[warehouseId] = prevBal + quantity;
      const entry = createLedgerEntry(TX_TYPES.RETURN, productId, warehouseId, quantity, referenceType || 'cancellation', referenceId, reason || 'بازگشت کالا', null, prevBal);
      engineAudit('inventory_return', `بازگشت ${fmt(quantity)} ورق ${prodName(p)} به ${whName(warehouseId)}`, null, { qty: quantity, wh: warehouseId });
      save();
      rebuildIndex();
      return entry;
    } catch(e) {
      Storage.rollback(snap);
      rebuildIndex();
      throw e;
    }
  },

  // Cancel sale (reverse a sale)
  cancelSale(opts) {
    const { productId, warehouseId, quantity, referenceType, referenceId, reason } = opts;
    return this.returnStock({ productId, warehouseId, quantity, referenceType: referenceType || 'cancellation', referenceId, reason: reason || 'ابطال فاکتور' });
  },

  // Get physical stock
  getBalance(productId, warehouseId) {
    const p = getProdById(productId);
    if (!p) return 0;
    return p.stock[warehouseId] || 0;
  },

  // Get total stock across all warehouses
  getTotalBalance(productId) {
    const p = getProdById(productId);
    if (!p) return { qom: 0, jaf: 0, total: 0 };
    const qom = p.stock.qom || 0;
    const jaf = p.stock.jaf || 0;
    return { qom, jaf, total: qom + jaf };
  },

  // Get reserved quantity
  getReserved(productId, warehouseId) {
    return DB.inventoryReservations
      .filter(r => r.productId === productId && r.warehouseId === warehouseId && r.status === RES_STATUS.ACTIVE)
      .reduce((sum, r) => sum + r.quantity, 0);
  },

  // Get available (physical - reserved)
  getAvailable(productId, warehouseId) {
    const physical = this.getBalance(productId, warehouseId);
    const reserved = this.getReserved(productId, warehouseId);
    return Math.max(0, physical - reserved);
  },

  // Get ledger
  getLedger(opts) {
    let list = DB.inventoryTransactions;
    if (opts) {
      if (opts.productId) list = list.filter(t => t.productId === opts.productId);
      if (opts.warehouseId) list = list.filter(t => t.warehouseId === opts.warehouseId);
      if (opts.type) list = list.filter(t => t.type === opts.type);
      if (opts.from) list = list.filter(t => t.timestamp >= opts.from);
      if (opts.to) list = list.filter(t => t.timestamp <= opts.to);
    }
    return list.slice().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
  },

  // Get active reservations
  getActiveReservations(productId, warehouseId) {
    return DB.inventoryReservations.filter(r => {
      if (r.status !== RES_STATUS.ACTIVE) return false;
      if (productId && r.productId !== productId) return false;
      if (warehouseId && r.warehouseId !== warehouseId) return false;
      return true;
    });
  },

  // Reconcile ledger vs product.stock
  reconcile() {
    const discrepancies = [];
    const txByProductWh = {};
    DB.inventoryTransactions.forEach(tx => {
      const key = tx.productId + '|' + tx.warehouseId;
      if (!txByProductWh[key]) txByProductWh[key] = 0;
      txByProductWh[key] += tx.quantity;
    });
    DB.products.forEach(p => {
      ['qom', 'jaf'].forEach(wh => {
        const key = p.id + '|' + wh;
        const ledgerBal = txByProductWh[key] || 0;
        const stockBal = p.stock[wh] || 0;
        // For products with no ledger entries, skip (legacy data)
        if (ledgerBal === 0 && stockBal === 0) return;
        if (ledgerBal === 0 && stockBal > 0) return; // Legacy product, no ledger history
        if (ledgerBal !== stockBal) {
          discrepancies.push({
            productId: p.id,
            productName: prodName(p),
            warehouseId: wh,
            warehouseName: whName(wh),
            ledgerBalance: ledgerBal,
            stockBalance: stockBal,
            difference: stockBal - ledgerBal
          });
        }
      });
    });
    return {
      timestamp: new Date().toISOString(),
      totalProducts: DB.products.length,
      totalTransactions: DB.inventoryTransactions.length,
      matched: DB.products.length * 2 - discrepancies.length,
      mismatched: discrepancies.length,
      discrepancies
    };
  }
};

// Fast Product Search with ranking
const ProductSearch = {
  _cache: null,
  _cacheKey: '',
  
  rebuildCache() {
    this._cache = DB.products.map(p => ({
      id: p.id,
      brand: p.brand || '',
      thickness: p.thickness || '',
      color: p.color || '',
      width: p.width || 0,
      length: p.length || 0,
      stock: { qom: p.stock.qom || 0, jaf: p.stock.jaf || 0 },
      totalStock: (p.stock.qom || 0) + (p.stock.jaf || 0),
      salePrice: p.salePrice || 0,
      minPrice: p.minPrice || 0,
      costPrice: p.costPrice || 0,
      shelf: p.shelf || '',
      searchText: `${p.brand} ${p.thickness} ${p.color} ${p.width} ${p.length} ${p.brand}/${p.color}/${p.width}×${p.length}`.toLowerCase()
    }));
  },
  
  search(query, options = {}) {
    if (!query || query.trim().length === 0) return [];
    const q = query.trim().toLowerCase();
    const qParts = q.split(/[\s\/]+/).filter(Boolean);
    const { warehouse, inStockOnly = false, limit = 20 } = options;
    
    if (!this._cache) this.rebuildCache();
    
    let results = this._cache.map(p => {
      let score = 0;
      const brandLower = p.brand.toLowerCase();
      const colorLower = p.color.toLowerCase();
      const dimStr = `${p.width}×${p.length}`;
      
      // Exact brand match
      if (brandLower === q) score += 100;
      else if (brandLower.startsWith(q)) score += 80;
      else if (brandLower.includes(q)) score += 60;
      
      // Exact color match
      if (colorLower === q) score += 90;
      else if (colorLower.startsWith(q)) score += 70;
      else if (colorLower.includes(q)) score += 50;
      
      // Dimension match
      if (dimStr === q) score += 95;
      else if (dimStr.includes(q)) score += 55;
      
      // Multi-part matching
      qParts.forEach(part => {
        if (brandLower.includes(part)) score += 40;
        if (colorLower.includes(part)) score += 35;
        if (String(p.width).includes(part)) score += 30;
        if (String(p.length).includes(part)) score += 30;
        if (p.thickness.toLowerCase().includes(part)) score += 25;
        if (p.searchText.includes(part)) score += 20;
      });
      
      // Full text match
      if (p.searchText.includes(q)) score += 15;
      
      return { ...p, score };
    }).filter(p => p.score > 0);
    
    // Sort by score descending
    results.sort((a, b) => b.score - a.score);
    
    // Filter in-stock if requested
    if (inStockOnly) {
      results = results.filter(p => {
        if (warehouse) return (p.stock[warehouse] || 0) > 0;
        return p.totalStock > 0;
      });
    }
    
    return results.slice(0, limit);
  }
};

// Pricing Engine
const PricingEngine = {
  // Get price for a product-customer combination
  getPrice(productId, options = {}) {
    const p = getProd(productId);
    if (!p) return null;
    
    const { customerId, paymentType = 'credit', quantity = 1 } = options;
    
    // Priority: customer-specific > customer level > cash/credit > base
    let price = p.salePrice || 0;
    
    // Check customer-specific pricing
    if (customerId && DB.customerPrices) {
      const custPrice = DB.customerPrices.find(cp => 
        cp.productId === customerId &&
        (!cp.validFrom || cp.validFrom <= todayISO()) &&
        (!cp.validUntil || cp.validUntil >= todayISO())
      );
      if (custPrice) price = custPrice.price;
    }
    
    // Check cash/credit pricing
    if (paymentType === 'cash' && p.cashPrice) {
      price = p.cashPrice;
    } else if (paymentType === 'credit' && p.creditPrice) {
      price = p.creditPrice;
    }
    
    return price;
  },
  
  // Validate price against minimum
  validatePrice(productId, price, options = {}) {
    const p = getProd(productId);
    if (!p) return { valid: false, error: 'کالا یافت نشد' };
    
    const minPrice = p.minPrice || 0;
    if (minPrice > 0 && price < minPrice && !isManager()) {
      return { 
        valid: false, 
        error: `قیمت پایین‌تر از حد مجاز است. حداقل قیمت: ${toman(minPrice)}`,
        requiresApproval: true
      };
    }
    
    return { valid: true };
  },
  
  // Calculate line total
  calculateLineTotal(item) {
    const area = (item.width || 0) * (item.length || 0) / 10000;
    if (item.unit === 'm2') {
      return Math.round(area * item.unitPrice * item.qty);
    }
    return item.qty * item.price;
  },
  
  // Calculate cart totals
  calculateCartTotals(items, discount = 0, shipping = 0) {
    const totalSheets = items.reduce((s, i) => s + i.qty, 0);
    const totalArea = items.reduce((s, i) => s + lineArea(i), 0);
    const subtotal = items.reduce((s, i) => s + PricingEngine.calculateLineTotal(i), 0);
    const finalTotal = subtotal - discount + shipping;
    
    return {
      totalSheets,
      totalArea,
      subtotal,
      discount,
      shipping,
      finalTotal
    };
  }
};

// Sales Cart
const SalesCart = {
  _cart: null,
  _submitting: false,
  _operationId: null,
  
  init() {
    this._cart = {
      customerId: null,
      items: [],
      discount: 0,
      shipping: 0,
      showShipping: true,
      paymentType: 'credit',
      card: '',
      sheba: '',
      acctName: '',
      notes: '',
      fromProformaId: null
    };
    this._submitting = false;
    this._operationId = null;
  },
  
  getCart() {
    if (!this._cart) this.init();
    return this._cart;
  },
  
  // Sync from draft to SalesCart (one-time migration)
  syncFromDraft(d) {
    if (!d) return;
    this._cart = {
      customerId: d.customerId || null,
      items: (d.items || []).map(i => ({...i})),
      discount: d.discount || 0,
      shipping: d.shipping || 0,
      showShipping: d.showShipping !== false,
      paymentType: d.payMode === 'full' ? 'full' : d.payMode === 'later' ? 'credit' : 'credit',
      card: d.card || '',
      sheba: d.sheba || '',
      acctName: d.acctName || '',
      notes: '',
      fromProformaId: d.fromProformaId || null
    };
  },
  
  // Sync from SalesCart to draft (keep draft as thin wrapper)
  syncToDraft(d) {
    if (!d) return;
    d.customerId = this._cart.customerId;
    d.items = this._cart.items.map(i => ({...i}));
    d.discount = this._cart.discount;
    d.shipping = this._cart.shipping;
    d.showShipping = this._cart.showShipping;
    d.payMode = this._cart.paymentType === 'full' ? 'full' : 'later';
    d.card = this._cart.card;
    d.sheba = this._cart.sheba;
    d.acctName = this._cart.acctName;
    d.fromProformaId = this._cart.fromProformaId;
  },
  
  setCustomer(customerId) {
    this._cart.customerId = customerId;
    if (draft) draft.customerId = customerId;
  },
  
  setDiscount(discount) {
    this._cart.discount = discount;
    if (draft) draft.discount = discount;
  },
  
  setShipping(shipping) {
    this._cart.shipping = shipping;
    if (draft) draft.shipping = shipping;
  },
  
  setPaymentType(type) {
    this._cart.paymentType = type;
    if (draft) draft.payMode = type === 'full' ? 'full' : 'later';
  },
  
  setCardInfo(card, sheba, acctName) {
    this._cart.card = card || '';
    this._cart.sheba = sheba || '';
    this._cart.acctName = acctName || '';
    if (draft) {
      draft.card = card || '';
      draft.sheba = sheba || '';
      draft.acctName = acctName || '';
    }
  },
  
  addItem(productId, options = {}) {
    const p = getProd(productId);
    if (!p) return { success: false, error: 'کالا یافت نشد' };
    
    const { quantity = 1, price = null, warehouse = 'qom', unit = 'sheet' } = options;
    
    // Get price if not provided
    let finalPrice = price;
    if (!finalPrice || finalPrice <= 0) {
      finalPrice = CustomerPricing.getPrice(this._cart.customerId, productId) ||
                   PricingEngine.getPrice(productId, {
                     customerId: this._cart.customerId,
                     paymentType: this._cart.paymentType
                   }) || p.salePrice || 0;
    }
    
    // Validate price
    const validation = PricingEngine.validatePrice(productId, finalPrice);
    if (!validation.valid) {
      return { success: false, error: validation.error };
    }
    
    // Check stock
    const available = InventoryEngine.getAvailable(productId, warehouse);
    if (available < quantity && !isManager()) {
      return { success: false, error: 'موجودی قابل فروش کافی نیست. موجودی: ' + available + ' ورق' };
    }
    
    // Check if item already exists in cart (same product + warehouse)
    const existingIndex = this._cart.items.findIndex(i => 
      i.productId === productId && i.wh === warehouse
    );
    
    const area = (p.width * p.length) / 10000;
    const unitPrice = unit === 'm2' ? Math.round(finalPrice / area) : finalPrice;
    const lineTotal = unit === 'm2' ? Math.round(unitPrice * area * quantity) : finalPrice * quantity;
    
    if (existingIndex >= 0) {
      this._cart.items[existingIndex].qty += quantity;
      this._cart.items[existingIndex].price = finalPrice;
      this._cart.items[existingIndex].unitPrice = unitPrice;
    } else {
      this._cart.items.push({
        productId,
        name: prodName(p),
        qty: quantity,
        price: finalPrice,
        unit: unit,
        unitPrice: unitPrice,
        wh: warehouse,
        width: p.width,
        length: p.length,
        cost: p.costPrice || 0
      });
    }
    
    // Sync to draft
    if (draft) this.syncToDraft(draft);
    
    return { success: true };
  },
  
  removeItem(index) {
    if (index >= 0 && index < this._cart.items.length) {
      this._cart.items.splice(index, 1);
      if (draft) this.syncToDraft(draft);
      return true;
    }
    return false;
  },
  
  updateItem(index, updates) {
    if (index >= 0 && index < this._cart.items.length) {
      const item = this._cart.items[index];
      
      // Validate price if changing
      if (updates.price !== undefined) {
        const validation = PricingEngine.validatePrice(item.productId, updates.price);
        if (!validation.valid) {
          return { success: false, error: validation.error };
        }
      }
      
      Object.assign(item, updates);
      
      // Recalculate price if quantity or unit changed
      if (updates.qty !== undefined || updates.unit !== undefined) {
        const p = getProd(item.productId);
        if (p && item.unit === 'm2') {
          const area = (p.width * p.length) / 10000;
          item.price = Math.round(item.unitPrice * area);
        } else if (p) {
          item.unitPrice = item.price;
        }
      }
      
      if (draft) this.syncToDraft(draft);
      return { success: true };
    }
    return { success: false, error: 'ردیف یافت نشد' };
  },
  
  clear() {
    this.init();
    if (draft) {
      draft.items = [];
      draft.customerId = null;
      draft.discount = 0;
      draft.shipping = 0;
    }
  },
  
  getTotals() {
    return PricingEngine.calculateCartTotals(
      this._cart.items,
      this._cart.discount,
      this._cart.shipping
    );
  },
  
  getItemCount() {
    return this._cart.items.reduce((s, i) => s + i.qty, 0);
  },
  
  getArea() {
    return this._cart.items.reduce((s, i) => {
      const area = (i.width || 0) * (i.length || 0) * i.qty / 10000;
      return s + area;
    }, 0);
  },
  
  // Validate cart before submission
  validate() {
    const errors = [];
    
    if (!this._cart.customerId) {
      errors.push('مشتری انتخاب نشده است');
    }
    
    if (this._cart.items.length === 0) {
      errors.push('سبد خرید خالی است');
    }
    
    // Validate each item
    for (const item of this._cart.items) {
      const p = getProd(item.productId);
      if (!p) {
        errors.push('کالای ' + item.name + ' یافت نشد');
        continue;
      }
      
      if (item.qty <= 0) {
        errors.push('تعداد ' + item.name + ' باید مثبت باشد');
      }
      
      if (item.price <= 0) {
        errors.push('قیمت ' + item.name + ' باید مثبت باشد');
      }
      
      const validation = PricingEngine.validatePrice(item.productId, item.price);
      if (!validation.valid) {
        errors.push(item.name + ': ' + validation.error);
      }
      
      // Check stock
      const available = InventoryEngine.getAvailable(item.productId, item.wh);
      if (available < item.qty && !isManager()) {
        errors.push(item.name + ': موجودی کافی نیست (موجودی: ' + available + ')');
      }
    }
    
    // Check customer credit limit
    if (this._cart.customerId && this._cart.paymentType === 'credit') {
      const cust = getCust(this._cart.customerId);
      if (cust && cust.creditLimit) {
        const balance = custBalance(this._cart.customerId);
        const total = this.getTotals().finalTotal;
        if (balance + total > cust.creditLimit) {
          errors.push('سقف اعتبار مشتری تکمیل شده است');
        }
      }
    }
    
    return { valid: errors.length === 0, errors };
  },
  
  // Double-submission protection
  isSubmitting() {
    return this._submitting;
  },
  
  // Create invoice/proforma with full validation and idempotency
  async createInvoice(type = 'invoice') {
    // Prevent double submission
    if (this._submitting) {
      return { success: false, error: 'عملیات در حال انجام است' };
    }
    
    // Generate operation ID for idempotency
    this._operationId = 'op_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    this._submitting = true;
    
    try {
      // Validate cart
      const validation = this.validate();
      if (!validation.valid) {
        return { success: false, error: validation.errors.join('\n') };
      }
      
      // Create invoice number
      let number;
      if (type === 'proforma') {
        DB.counters.proforma++;
        number = 'P-' + DB.counters.proforma;
      } else {
        DB.counters.invoice++;
        number = DB.counters.invoice;
      }
      
      // Calculate totals
      const totals = this.getTotals();
      const total = totals.finalTotal;
      const received = type === 'proforma' ? 0 : 
        (this._cart.paymentType === 'full' ? total : 0);
      
      // Create invoice object
      const inv = {
        id: uid(),
        number,
        type,
        status: type === 'proforma' ? 'پیش‌فاکتور' : 'تسویه‌نشده',
        customerId: this._cart.customerId,
        items: this._cart.items.map(i => ({...i})),
        discount: this._cart.discount,
        shipping: this._cart.shipping,
        showShipping: this._cart.showShipping,
        date: todayISO(),
        createdDate: new Date().toISOString(),
        createdBy: session.name,
        mseen: false,
        card: this._cart.card,
        sheba: this._cart.sheba,
        acctName: this._cart.acctName,
        cancelReason: '',
        paymentType: this._cart.paymentType,
        operationId: this._operationId,
        fromProformaId: this._cart.fromProformaId
      };
      
      DB.invoices.push(inv);
      
      // Process inventory for regular invoices
      if (type !== 'proforma') {
        for (const item of inv.items) {
          const sellResult = InventoryEngine.sell({
            productId: item.productId,
            warehouseId: item.wh,
            quantity: item.qty,
            referenceType: 'invoice',
            referenceId: inv.id,
            reason: 'فروش فاکتور شماره ' + inv.number
          });
          
          if (!sellResult.success) {
            // Rollback invoice
            DB.invoices = DB.invoices.filter(i => i.id !== inv.id);
            return { success: false, error: 'خطا در ثبت موجودی: ' + (sellResult.error || '未知 خطا') };
          }
        }
        
        // Record payment if full payment
        if (received > 0) {
          DB.counters.receipt++;
          DB.payments.push({
            id: uid(),
            number: 'R-' + DB.counters.receipt,
            customerId: this._cart.customerId,
            amount: received,
            method: 'نقدی',
            date: todayISO(),
            invoiceNumber: String(number),
            note: 'دریافت هنگام صدور فاکتور'
          });
        }
        
        refreshInvStatus(inv);
      }
      
      // Mark proforma as converted if from proforma
      if (this._cart.fromProformaId && type === 'invoice') {
        const pr = DB.invoices.find(v => v.id === this._cart.fromProformaId);
        if (pr) {
          pr.status = 'تبدیل‌شده';
          pr.convertedToInvoiceId = inv.id;
        }
      }
      
      // Log activity
      logAct(type === 'proforma' ? 'proforma' : 'invoice',
        (type === 'proforma' ? 'صدور پیش‌فاکتور ' : 'صدور فاکتور ') + inv.number +
        ' برای «' + (((getCust(inv.customerId) || {}).name) || '?') + '» — مبلغ ' + fmt(total) + ' تومان'
      );
      
      // Save and clear
      save();
      this.clear();
      
      return { success: true, invoice: inv, number, operationId: this._operationId };
    } finally {
      this._submitting = false;
      this._operationId = null;
    }
  }
};

// Approval Center
const ApprovalCenter = {
  request(type, data, reason, requestedBy) {
    if (!DB.approvals) DB.approvals = [];
    
    const approval = {
      id: uid(),
      type,
      status: 'PENDING',
      requestedBy: requestedBy || session.name,
      requestedAt: new Date().toISOString(),
      referenceType: data.referenceType || null,
      referenceId: data.referenceId || null,
      reason: reason || '',
      data: data || {},
      approvedBy: null,
      approvedAt: null,
      rejectionReason: null
    };
    
    DB.approvals.push(approval);
    save();
    
    logAct('approval', 'درخواست تأییدیه: ' + type + ' — ' + (reason || ''));
    
    return approval;
  },
  
  approve(id, approvedBy) {
    const approval = (DB.approvals || []).find(a => a.id === id);
    if (!approval || approval.status !== 'PENDING') return false;
    
    approval.status = 'APPROVED';
    approval.approvedBy = approvedBy || session.name;
    approval.approvedAt = new Date().toISOString();
    
    save();
    logAct('approval', 'تأیید شد: ' + approval.type + ' — توسط ' + approval.approvedBy);
    
    return true;
  },
  
  reject(id, rejectionReason, rejectedBy) {
    const approval = (DB.approvals || []).find(a => a.id === id);
    if (!approval || approval.status !== 'PENDING') return false;
    
    approval.status = 'REJECTED';
    approval.rejectionReason = rejectionReason || '';
    approval.approvedBy = rejectedBy || session.name;
    approval.approvedAt = new Date().toISOString();
    
    save();
    logAct('approval', 'رد شد: ' + approval.type + ' — دلیل: ' + (rejectionReason || ''));
    
    return true;
  },
  
  cancel(id) {
    const approval = (DB.approvals || []).find(a => a.id === id);
    if (!approval || approval.status !== 'PENDING') return false;
    
    approval.status = 'CANCELLED';
    save();
    
    return true;
  },
  
  getPending() {
    return (DB.approvals || []).filter(a => a.status === 'PENDING');
  },
  
  getByType(type) {
    return (DB.approvals || []).filter(a => a.type === type);
  },
  
  getByStatus(status) {
    return (DB.approvals || []).filter(a => a.status === status);
  },
  
  getAll(filters = {}) {
    let list = (DB.approvals || []).slice();
    
    if (filters.type) list = list.filter(a => a.type === filters.type);
    if (filters.status) list = list.filter(a => a.status === filters.status);
    if (filters.requestedBy) list = list.filter(a => a.requestedBy === filters.requestedBy);
    if (filters.from) list = list.filter(a => new Date(a.requestedAt) >= new Date(filters.from));
    if (filters.to) list = list.filter(a => new Date(a.requestedAt) <= new Date(filters.to));
    
    return list.sort((a, b) => new Date(b.requestedAt) - new Date(a.requestedAt));
  }
};

const CustomerPricing = {
  setPrice(customerId, productId, price, validFrom = null, validUntil = null) {
    if (!DB.customerPrices) DB.customerPrices = [];
    
    // Remove existing price for this customer-product combination
    DB.customerPrices = DB.customerPrices.filter(cp => 
      !(cp.customerId === customerId && cp.productId === productId)
    );
    
    // Add new price
    DB.customerPrices.push({
      id: uid(),
      customerId,
      productId,
      price,
      validFrom,
      validUntil,
      createdBy: session.name,
      createdAt: new Date().toISOString()
    });
    
    save();
  },
  
  getPrice(customerId, productId) {
    if (!DB.customerPrices) return null;
    
    const price = DB.customerPrices.find(cp => 
      cp.customerId === customerId && 
      cp.productId === productId &&
      (!cp.validFrom || cp.validFrom <= todayISO()) &&
      (!cp.validUntil || cp.validUntil >= todayISO())
    );
    
    return price ? price.price : null;
  },
  
  removePrice(customerId, productId) {
    if (!DB.customerPrices) return;
    
    DB.customerPrices = DB.customerPrices.filter(cp => 
      !(cp.customerId === customerId && cp.productId === productId)
    );
    
    save();
  },
  
  getCustomerPrices(customerId) {
    if (!DB.customerPrices) return [];
    
    return DB.customerPrices.filter(cp => 
      cp.customerId === customerId &&
      (!cp.validFrom || cp.validFrom <= todayISO()) &&
      (!cp.validUntil || cp.validUntil >= todayISO())
    );
  }
};

// Customer Account Management
const CustomerAccount = {
  getBalance(customerId) {
    return custBalance(customerId);
  },
  
  getCreditLimit(customerId) {
    const c = getCust(customerId);
    return c ? (c.creditLimit || 0) : 0;
  },
  
  setCreditLimit(customerId, limit) {
    const c = getCust(customerId);
    if (c) {
      c.creditLimit = limit;
      save();
    }
  },
  
  canSaleOnCredit(customerId, amount) {
    const balance = this.getBalance(customerId);
    const limit = this.getCreditLimit(customerId);
    
    if (limit <= 0) return true; // No limit set
    
    return (balance + amount) <= limit;
  },
  
  getTransactions(customerId, options = {}) {
    const { limit = 50, offset = 0 } = options;
    
    const transactions = [];
    
    // Invoices
    DB.invoices
      .filter(inv => inv.customerId === customerId && inv.type === 'invoice')
      .forEach(inv => {
        transactions.push({
          type: 'invoice',
          date: inv.date,
          reference: inv.number,
          description: 'فاکتور شماره ' + inv.number,
          debit: invTotal(inv),
          credit: 0,
          invoiceId: inv.id
        });
      });
    
    // Payments
    DB.payments
      .filter(p => p.customerId === customerId)
      .forEach(p => {
        transactions.push({
          type: 'payment',
          date: p.date,
          reference: p.number,
          description: 'پرداخت ' + p.note,
          debit: 0,
          credit: p.amount,
          paymentId: p.id
        });
      });
    
    // Sort by date descending
    transactions.sort((a, b) => new Date(b.date) - new Date(a.date));
    
    // Apply pagination
    return transactions.slice(offset, offset + limit);
  },
  
  getStatement(customerId) {
    const transactions = this.getTransactions(customerId, { limit: 1000 });
    let balance = 0;
    
    return transactions.reverse().map(t => {
      balance += t.debit - t.credit;
      return { ...t, balance };
    }).reverse();
  }
};

// Fast Search UI Functions
let _fastSearchTimeout = null;
let _fastSearchResults = [];

function handleFastSearch(query) {
  clearTimeout(_fastSearchTimeout);
  
  const resultsDiv = document.getElementById('fast-search-results');
  if (!resultsDiv) return;
  
  if (!query || query.trim().length < 2) {
    resultsDiv.style.display = 'none';
    resultsDiv.innerHTML = '';
    return;
  }
  
  _fastSearchTimeout = setTimeout(() => {
    const results = ProductSearch.search(query, { limit: 10 });
    _fastSearchResults = results;
    
    if (results.length === 0) {
      resultsDiv.innerHTML = '<div class="sub" style="padding:8px">کالایی یافت نشد.</div>';
      resultsDiv.style.display = 'block';
      return;
    }
    
    resultsDiv.innerHTML = results.map((p, i) => {
      const avail = draft.form?.wh ? 
        InventoryEngine.getAvailable(p.id, draft.form.wh) : 
        p.totalStock;
      
      return `
        <div class="search-result-item" onclick="selectFastProduct(${i})" style="padding:10px;border:1px solid var(--md-outline-variant);border-radius:var(--md-shape-md);margin-bottom:8px;cursor:pointer;transition:all .15s">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div>
              <div style="font-weight:600;font-size:14px">${esc(p.brand)}</div>
              <div style="color:var(--md-on-surface-variant);font-size:13px">🖤 ${esc(p.color)}</div>
              <div style="font-size:13px">${faNum(p.width)}×${faNum(p.length)} — ${esc(p.thickness)}</div>
            </div>
            <div style="text-align:left">
              <div class="badge ${avail > 0 ? 'green' : 'red'}">${avail > 0 ? 'موجودی: ' + faNum(avail) : 'ناموجود'}</div>
              ${p.salePrice ? `<div style="font-size:13px;margin-top:4px">${toman(p.salePrice)}</div>` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');
    
    resultsDiv.style.display = 'block';
  }, 150);
}

function selectFastProduct(index) {
  const p = _fastSearchResults[index];
  if (!p) return;
  
  // Set product in draft form
  draft.form = draft.form || {};
  draft.form.pid = p.id;
  draft.form.brand = p.brand;
  draft.form.thickness = p.thickness;
  draft.form.color = p.color;
  draft.form.width = p.width;
  draft.form.length = p.length;
  draft.form.wh = draft.form.wh || 'qom';
  draft.form.qty = '1';
  draft.form.price = p.salePrice || '';
  
  // Clear search
  const searchInput = document.getElementById('fast-product-search');
  if (searchInput) searchInput.value = '';
  
  const resultsDiv = document.getElementById('fast-search-results');
  if (resultsDiv) {
    resultsDiv.style.display = 'none';
    resultsDiv.innerHTML = '';
  }
  
  // Show quick add dialog
  openQuickAddModal(p);
}

/* =============== domain =============== */
const prodName=p=>prodNameOf(p);
const getProd=id=>DB.products.find(p=>p.id===id);
const getCust=id=>DB.customers.find(c=>c.id===id);
const totStock=p=>(p.stock.qom||0)+(p.stock.jaf||0);
const dimStr=p=>faNum(p.width)+"×"+faNum(p.length)+" سانتی‌متر";
const lineArea=i=>(i.width||0)*(i.length||0)*i.qty/10000;
const invArea=v=>v.items.reduce((s,i)=>s+lineArea(i),0);
const invQty=v=>v.items.reduce((s,i)=>s+i.qty,0);
const invTotal=v=>{const items=v.items.reduce((s,i)=>s+i.qty*i.price,0);return items-(v.discount||0)+(v.shipping||0)};
const invItems=v=>v.items.reduce((s,i)=>s+i.qty*i.price,0);
const invPaid=v=>DB.payments.filter(p=>String(p.invoiceNumber)===String(v.number)).reduce((s,p)=>s+p.amount,0);
const invRemain=v=>invTotal(v)-invPaid(v);
const invProfit=v=>v.items.reduce((s,i)=>s+(i.price-i.cost)*i.qty,0)-(v.discount||0);
function custBalance(cid){
  const debt=DB.invoices.filter(v=>v.customerId===cid&&v.type==="invoice"&&v.status!=="باطل‌شده").reduce((s,v)=>s+invTotal(v),0);
  const paid=DB.payments.filter(p=>p.customerId===cid).reduce((s,p)=>s+p.amount,0);
  return debt-paid;
}
function custTotalBuy(cid){return DB.invoices.filter(v=>v.customerId===cid&&v.type==="invoice"&&v.status!=="باطل‌شده").reduce((s,v)=>s+invTotal(v),0)}
function refreshInvStatus(v){if(v.type!=="invoice"||v.status==="باطل‌شده")return;v.status=invRemain(v)<=0?"تسویه‌شده":"تسویه‌نشده"}
const statusBadge=s=>({"تسویه‌شده":"green","تسویه‌نشده":"red","پیش‌فاکتور":"blue","باطل‌شده":"gray","تبدیل‌شده":"gray"}[s]||"gray");
function stockCell(n){return n<=0?'<span class="badge gray">۰</span>':`<span class="num">${fmt(n)}</span>`}
function custEvents(cid){
  return [
    ...DB.invoices.filter(v=>v.customerId===cid&&v.type==="invoice").map(v=>({date:v.date,label:(v.status==="باطل‌شده"?"فاکتور باطل‌شده ":"فاکتور ")+v.number,debit:v.status==="باطل‌شده"?0:invTotal(v),credit:0,invId:v.id})),
    ...DB.payments.filter(p=>p.customerId===cid).map(p=>({date:p.date,label:`دریافت ${p.number} (${p.method})${p.invoiceNumber?" — فاکتور "+p.invoiceNumber:""}`,debit:0,credit:p.amount}))
  ].sort((a,b)=>new Date(a.date)-new Date(b.date));

    // Data
    'data.backup': { label: 'تهیه پشتیبان', default: ['manager'] },
    'data.restore': { label: 'بازیابی پشتیبان', default: ['manager'] },

    'dashboard.view': { label: 'مشاهده داشبورد', default: ['manager'] },
    'dashboard.approvals': { label: 'تأییدیه‌ها', default: ['manager'] }
  },
  
  hasPermission(permission) {
    if (isManager()) return true;
    
    const role = session?.role;
    if (!role) return false;
    
    // Check role permissions
    const roleObj = (DB.roles || []).find(r => r.id === role || r.name === role);
    if (roleObj) {
      if (roleObj.permissions.includes('*')) return true;
      if (roleObj.permissions.includes(permission)) return true;
    }
    
    // Check default permissions
    const permDef = this.permissions[permission];
    if (permDef && permDef.default.includes(role)) return true;
    
    return false;
  },
  
  requirePermission(permission) {
    if (!this.hasPermission(permission)) {
      toast('شما دسترسی به این عملیات را ندارید');
      return false;
    }
    return true;
  },
  
  getRolePermissions(roleId) {
    const role = (DB.roles || []).find(r => r.id === roleId);
    return role ? role.permissions : [];
  },
  
  setRolePermissions(roleId, permissions) {
    const role = (DB.roles || []).find(r => r.id === roleId);
    if (role) {
      role.permissions = permissions;
      save();
    }
  }
};

function renderKeepFocus(){const el=$("#cust-search");const v=el?el.value:"";render();const inp=$("#cust-search");if(inp){inp.focus();inp.value=v;inp.setSelectionRange(v.length,v.length)}}
function updCalc(){
  if(!draft)return;
  const f=draft.form;
  const rowSum=Math.floor(deNum(f.qty))*deNum(f.price);
  const rs=document.querySelector("#f-rowsum");if(rs)rs.textContent=rowSum>0?fmt(rowSum)+" تومان":"—";
  const itemsSum=draft.items.reduce((s,i)=>s+i.qty*i.price,0);
  const total=Math.max(0,itemsSum-(draft.discount||0)+(draft.shipping||0));
  const received=draft.type==="proforma"?0:draft.payMode==="full"?total:draft.payMode==="part"?(draft.received||0):0;
  const remain=Math.max(0,total-received);
  const set=(id,txt)=>{const e=document.querySelector(id);if(e)e.textContent=txt};
  set("#t-disc",draft.discount?"− "+fmt(draft.discount):"۰");
  set("#t-ship",fmt(draft.shipping||0));
  set("#t-total",toman(total));
  set("#t-received",fmt(received));
  const rm=document.querySelector("#t-remain");if(rm){rm.textContent=remain>0?toman(remain):"صفر";rm.className="num"+(remain>0?" pos":"")}
}
function lastSaleTo(cid,pid){
  const list=DB.invoices.filter(v=>v.customerId===cid&&v.status!=="باطل‌شده").sort((a,b)=>new Date(b.date)-new Date(a.date));
  for(const v of list){const it=v.items.find(i=>i.productId===pid);if(it)return it.price}
  return null;
}
function qmAdd(){
  if(!draft.qm)draft.qm={brand:"",th:"۴ میل",color:"",w:"125",pm:"",wh:"qom",mode:"m2"};
  const g=id=>{const e=document.querySelector(id);return e?e.value:""};
  const brand=(g("#qm-brand")||"").trim();
  const th=(g("#qm-th")||"").trim()||"۴ میل";
  const color=(g("#qm-color")||"").trim()||"معمولی";
  const w=parseInt(latinDigits(g("#qm-w")))||125;
  const pm=deNum(g("#qm-pm"));
  const wh=g("#qm-wh")||draft.qm.wh||"qom";
  Object.assign(draft.qm,{brand,th,color:g("#qm-color"),w:String(w),pm:g("#qm-pm"),wh});
  if(!brand){toast("نام برند را بنویسید.");return}
  if(pm<=0){toast(draft.qm.mode==="sheet"?"قیمت هر ورق را وارد کنید.":"قیمت هر مترمربع را وارد کنید.");return}
  const lens=latinDigits(g("#qm-lens")).split(/[^0-9.]+/).map(Number).filter(x=>x>0);
  if(!lens.length){toast("حداقل یک طول وارد کنید.");return}
  const fresh=[];let blocked=0;const mode=(draft.qm.mode==="sheet")?"sheet":"m2";
  lens.forEach(L=>{
    let p=DB.products.find(x=>x.brand===brand&&x.thickness===th&&x.color===color&&x.width===w&&x.length===L);
    if(!p){p={id:uid(),brand,thickness:th,color,width:w,length:L,stock:{qom:0,jaf:0},minStock:0,costPrice:0,salePrice:0,minPrice:0,shelf:""};DB.products.push(p);DB.pendingMin=DB.pendingMin||[];DB.pendingMin.push(p.id);fresh.push(p)}
    const price=mode==="sheet"?Math.round(pm):Math.round(w*L*pm/10000);
    if(!isManager()&&p.minPrice&&price<p.minPrice){blocked++;return}
    if(fresh.includes(p))InventoryEngine.receive({ productId: p.id, warehouseId: wh, quantity: 1, referenceType: 'quick_entry', referenceId: '', reason: 'ورود سریع' });
    const result=SalesCart.addItem(p.id,{quantity:1,price:price,warehouse:wh,unit:mode});
    if(!result.success){blocked++;return}
  });
  if(fresh.length)save();
  saveDraft();render();
  setTimeout(()=>{const e=document.querySelector("#qm-lens");if(e){e.value="";e.focus()}},30);
  let msg=faNum(lens.length-blocked)+" ردیف اضافه شد";
  if(fresh.length)msg+=" — "+faNum(fresh.length)+" کالای جدید تعریف شد";
  if(blocked)msg+=" — "+faNum(blocked)+" ردیف به دلیل قیمت کمتر از حداقل مجاز اضافه نشد";
  toast(msg);
}
function addItem(){
  const f=draft.form;
  const p=f.pid?getProd(f.pid):null;
  if(!p){toast("ابتدا برند، ضخامت، رنگ و ابعاد را انتخاب کنید.");return}
  const qty=Math.floor(deNum(f.qty)),price=deNum(f.price);
  if(qty<=0){toast("تعداد ورق باید عدد صحیح مثبت باشد.");return}
  if(price<=0){toast("قیمت فروش هر ورق را وارد کنید.");return}
  const result=SalesCart.addItem(p.id,{quantity:qty,price:price,warehouse:f.wh||"qom"});
  if(!result.success){toast(result.error);return}
  draft.form={brand:"",thickness:"",color:"",pid:"",wh:f.wh||"qom",qty:"",price:""};
  render();
}
function editItem(i){
  const it=draft.items[i];if(!it)return;
  const area=it.width&&it.length?it.width*it.length/10000:0;
  const pm2=area>0?Math.round(it.price/area):it.price;
  openModal(`<h3>ویرایش ردیف</h3><div class="sub" style="margin-bottom:10px">${esc(it.name)} — ابعاد ${faNum(it.width)}×${faNum(it.length)} cm — متراژ ${area1(area)} m²</div>
    <div class="grid3">
      <div class="field"><label>تعداد ورق</label><input id="ei-qty" inputmode="numeric" value="${it.qty}" oninput="this.value=latinDigits(this.value).replace(/[^0-9]/g,'')"></div>
      <div class="field"><label>قیمت هر مترمربع (تومان)</label><input id="ei-price" inputmode="numeric" value="${fmt(pm2).replace(/[^\d]/g,'')}" oninput="fmtPriceInput(this)"></div>
      <div class="field"><label>انبار</label><select id="ei-wh">${WH.map(w=>`<option value="${w.id}" ${it.wh===w.id?"selected":""}>${w.name}</option>`).join("")}</select></div>
    </div>
    <div class="actions"><button class="btn primary" onclick="saveEditItem(${i})">ذخیره</button><button class="btn" onclick="closeModal()">انصراف</button></div>`);
}
function saveEditItem(i){
  const it=draft.items[i];if(!it)return;
  const qty=Math.floor(deNum(document.querySelector("#ei-qty").value)),pm2=deNum(document.querySelector("#ei-price").value);
  if(qty<=0||pm2<=0){toast("تعداد و قیمت را درست وارد کنید.");return}
  const area=it.width&&it.length?it.width*it.length/10000:1;
  const price=Math.round(pm2*area);
  const result=SalesCart.updateItem(i,{qty:qty,price:price,unit:"m2",unitPrice:pm2,wh:document.querySelector("#ei-wh").value});
  if(!result.success){toast(result.error);return}
  saveDraft();closeModal();refreshInvoiceView();
}
function removeItem(i){
  SalesCart.removeItem(i);
  saveDraft();refreshInvoiceView();
}
function refreshInvoiceView(){
  const sy=window.scrollY;
  const itemsEl=document.querySelector(".card .itemrow")?.parentElement;
  if(!itemsEl){render();return}
  const cartTotals=SalesCart.getTotals();
  const itemsSum=cartTotals.itemsTotal;
  const totalArea=SalesCart.getArea();
  const total=cartTotals.finalTotal;
  let html=draft.items.map((it,i)=>`<div class="itemrow"><div class="t"><b>${esc(it.name)}</b><span>${fmt(it.qty)} ورق × ${it.unit==="m2"?fmt(it.unitPrice)+" تومان (متری)":fmt(it.price)+" تومان"} — متراژ ${area1(lineArea(it))} متر مربع — ${whName(it.wh)}</span></div>
      <div style="display:flex;align-items:center;gap:10px"><b class="num">${fmt(it.qty*it.price)}</b>
      <button class="btn sm" onclick="editItem(${i})">ویرایش</button><button class="btn sm danger" onclick="removeItem(${i})">حذف</button></div></div>`).join("");
  itemsEl.innerHTML=html;
  const sumEl=document.querySelector("#t-disc");
  const sumTotal=document.querySelector("#t-total");
  const sumCount=document.querySelector("#f-sum-count");
  if(sumEl)sumEl.textContent=draft.discount?"− "+fmt(draft.discount):"۰";
  if(sumTotal)sumTotal.textContent=toman(total);
  if(sumCount)sumCount.textContent=fmt(SalesCart.getItemCount())+" ورق / "+area1(totalArea)+" متر مربع";
  window.scrollTo(0,sy);
}
function saveInvoice(){
  // Prevent double submission
  if(SalesCart.isSubmitting()){
    toast("عملیات در حال انجام است. لطفاً صبر کنید.");
    return;
  }
  
  // Sync draft to SalesCart
  SalesCart.syncFromDraft(draft);
  
  // Use SalesCart to create invoice with full validation
  const type = draft.type === "proforma" ? "proforma" : "invoice";
  
  // Show processing state
  const btn = document.querySelector('.btn.primary[onclick="saveInvoice()"]');
  if(btn) {
    btn.disabled = true;
    btn.textContent = 'در حال ثبت...';
  }
  
  SalesCart.createInvoice(type).then(result => {
    if(btn) {
      btn.disabled = false;
      btn.textContent = type === "proforma" ? "ذخیره پیش‌فاکتور" : "ثبت فاکتور";
    }
    
    if(result.success){
      clearDraft();
      go("invoiceDetail", result.invoice.id);
      toast(type === "proforma" ? 
        "پیش‌فاکتور با شماره " + result.number + " ذخیره شد." :
        "فاکتور با شماره " + faNum(result.number) + " ثبت شد.");
    } else {
      toast(result.error);
    }
  });
}
function previewDraft(asType){
  const t=asType||draft.type;
  if(!draft.items.length){toast("برای پیش‌نمایش، حداقل یک ردیف کالا اضافه کنید.");return}
  const total=invTotal(draft);
  const received=t==="proforma"?0:(draft.payMode==="full"?total:draft.payMode==="later"?0:Math.min(draft.received||0,total));
  const fake={id:"preview",number:t==="proforma"?"P-پیش‌نمایش":"پیش‌نمایش",type:t,status:t==="proforma"?"پیش‌فاکتور":"تسویه‌نشده",customerId:draft.customerId,items:draft.items,discount:draft.discount||0,shipping:draft.shipping||0,showShipping:!!draft.showShipping,date:todayISO(),createdBy:session.name,mseen:false,card:(draft.card||"").trim(),sheba:(draft.sheba||"").trim(),acctName:(draft.acctName||"").trim(),cancelReason:"",_previewReceived:received};
  openPreview(fake,{isDraftPreview:true});
}

function convertProforma(id){
  const v=DB.invoices.find(x=>x.id===id);if(!v)return;
  if(v.convertedToInvoiceId){toast("این پیش‌فاکتور قبلاً به فاکتور تبدیل شده است. شماره فاکتور: "+(DB.invoices.find(x=>x.id===v.convertedToInvoiceId)?.number || "نامشخص"));return}
  draft=newDraft("invoice");
  draft.customerId=v.customerId;draft.items=v.items.map(i=>({...i,cost:getProd(i.productId)?.costPrice??i.cost}));
  draft.discount=v.discount;draft.shipping=v.shipping;draft.showShipping=v.showShipping;draft.fromProformaId=v.id;
  // Sync to SalesCart
  SalesCart.syncFromDraft(draft);
  go("newInvoice");
}

  const v=DB.invoices.find(x=>x.id===id);if(!v)return;
  openModal(`<h3>ابطال فاکتور ${esc(v.number)}</h3>
    <div class="field"><label>دلیل ابطال</label><select id="cn-reason"><option>اشتباه در قیمت</option><option>اشتباه در تعداد</option><option>لغو خرید</option><option>سایر</option></select></div>

    <div class="actions"><button class="btn danger" onclick="doCancel('${id}')">ابطال فاکتور</button><button class="btn" onclick="closeModal()">انصراف</button></div>`);

function doCancel(id){
  const v=DB.invoices.find(x=>x.id===id);if(!v)return;
  v.status="باطل‌شده";v.cancelReason=$("#cn-reason").value+($("#cn-note").value?" — "+$("#cn-note").value:"");
  v.items.forEach(i=>{
    InventoryEngine.cancelSale({ productId: i.productId, warehouseId: i.wh, quantity: i.qty, referenceType: 'invoice', referenceId: v.id, reason: 'ابطال فاکتور ' + v.number });
  });
  logAct("cancel","ابطال فاکتور "+v.number+" — دلیل: "+v.cancelReason);
  save();closeModal();render();toast("فاکتور باطل شد و موجودی بازگشت.");
}
