function xmlSafe(h){return h.replace(/&nbsp;/g,"&#160;").replace(/&zwnj;/g,"&#8204;").replace(/&zwj;/g,"&#8205;")}
async function docCanvas(scaleW){
  const {v,withStmt}=window._pv;
  const html=pvHtml();
  const holder=document.createElement("div");
  holder.style.cssText="position:fixed;left:-9999px;top:0;width:794px;background:#fff";
  holder.innerHTML=html;document.body.appendChild(holder);
  const h=Math.max(holder.firstElementChild.scrollHeight,holder.scrollHeight)+4;
  holder.remove();
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="794" height="${h}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" style="width:794px;overflow:hidden"><style>${DOC_CSS}</style>${xmlSafe(html)}</div></foreignObject></svg>`;
  const img=new Image();
  await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)});
  const k=scaleW/794;
  const canvas=document.createElement("canvas");canvas.width=scaleW;canvas.height=Math.round(h*k);
  const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);ctx.scale(k,k);ctx.drawImage(img,0,0);
  return canvas;
}
function dataUrlBytes(u){const b=atob(u.split(",")[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function buildPdf(jpegs,wPx,hPx){
  const NL=String.fromCharCode(10);
  const W=595.28,H=841.89;
  const parts=[];let pos=0;const xref=[];
  const add=x=>{parts.push(x);pos+=(typeof x==="string"?x.length:x.length)};
  const obj=x=>{xref.push(pos);add(x)};
  add("%PDF-1.4"+NL);
  obj("1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj"+NL);
  const kids=jpegs.map((_,i)=>`${3+i*3} 0 R`).join(" ");
  obj(`2 0 obj<</Type/Pages/Kids[${kids}]/Count ${jpegs.length}>>endobj`+NL);
  jpegs.forEach((jp,i)=>{
    const pn=3+i*3,cn=4+i*3,im=5+i*3;
    obj(`${pn} 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</XObject<</Im${i} ${im} 0 R>>/ProcSet[/PDF/ImageC]>>/Contents ${cn} 0 R>>endobj`+NL);
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    obj(`${cn} 0 obj<</Length ${cs.length}>>stream`+NL+cs+NL+"endstream endobj"+NL);
    obj(`${im} 0 obj<</Type/XObject/Subtype/Image/Width ${wPx}/Height ${hPx}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jp.length}>>stream`+NL);
    add(jp);add(NL+"endstream endobj"+NL);
  });
  const xstart=pos;
  let x="xref"+NL+`0 ${xref.length+1}`+NL+"0000000000 65535 f "+NL;
  xref.forEach(o=>{x+=String(o).padStart(10,"0")+" 00000 n "+NL});
  x+=`trailer<</Size ${xref.length+1}/Root 1 0 R>>`+NL+"startxref"+NL+xstart+NL+"%%EOF";
  add(x);
  return new Blob(parts,{type:"application/pdf"});
}
async function makeDocPdf(){
  const W=2480;const canvas=await docCanvas(W);
  const pageH=Math.round(W*841.89/595.28);
  const n=Math.max(1,Math.ceil(canvas.height/pageH));
  const jp=[];
  for(let i=0;i<n;i++){
    const pc=document.createElement("canvas");pc.width=W;pc.height=pageH;
    const ctx=pc.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,W,pageH);
    ctx.drawImage(canvas,0,-i*pageH);
    jp.push(dataUrlBytes(pc.toDataURL("image/jpeg",.92)));
  }
  return buildPdf(jp,W,pageH);
}

function toast(msg){
  let t=document.querySelector("#toast");
  if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;bottom:90px;right:50%;transform:translateX(50%);background:#2C2C2B;color:#fff;padding:10px 18px;border-radius:10px;z-index:99;font-size:14px;max-width:92vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)";document.body.appendChild(t)}
  t.textContent=msg;t.style.display="block";clearTimeout(window._tt);window._tt=setTimeout(()=>{t.style.display="none"},3500);
}

function exportInventoryExcel(){
  if(!window.XLSX){toast("کتابخانه XLSX بارگذاری نشده است.");return}
  const wb=XLSX.utils.book_new();
  const allProducts=DB.products.filter(p=>totStock(p)>0);

  // Build last entry date map per product
  const lastEntryDate={};
  (DB.entries||[]).forEach(e=>{
    if(!e.productId||!e.date)return;
    const d=e.date.slice(0,10);
    if(!lastEntryDate[e.productId]||d>lastEntryDate[e.productId])lastEntryDate[e.productId]=d;
  });

  const head=["برند","ضخامت","رنگ","عرض","طول","قم","جعفریه","کل","حداقل موجودی","حداقل قیمت","قیمت فروش","قیمت/م²","وضعیت","قفسه","تاریخ آخرین ورود"];
  if(canViewCostPrice())head.push("قیمت تمام‌شده","ارزش موجودی");
  const rows=[head];

  allProducts.forEach(p=>{
    const area=p.width*p.length/10000;
    const pm2=area>0?Math.round((p.salePrice||0)/area):0;
    const stock=totStock(p);
    const status=stock===0?"ناموجود":stock<=2?"محدود":"موجود";
    const lastDate=lastEntryDate[p.id]||"";
    const r=[p.brand,p.thickness,p.color,p.width,p.length,p.stock.qom||0,p.stock.jaf||0,stock,p.minStock||0,p.minPrice||0,p.salePrice||0,pm2,status,p.shelf||"",lastDate];
    if(canViewCostPrice())r.push(p.costPrice||0,stock*(p.costPrice||0));
    rows.push(r);
  });

  const ws=XLSX.utils.aoa_to_sheet(rows);

  // Column widths
  const cols=[{wch:16},{wch:10},{wch:14},{wch:8},{wch:8},{wch:8},{wch:10},{wch:8},{wch:12},{wch:14},{wch:14},{wch:12},{wch:10},{wch:10},{wch:14}];
  if(canViewCostPrice())cols.push({wch:14},{wch:14});
  ws["!cols"]=cols;

  // Style: header row
  const headerStyle={font:{bold:true,color:{rgb:"FFFFFF"},sz:11},fill:{fgColor:{rgb:"1976D2"}},alignment:{horizontal:"center",vertical:"center"},border:[
    {top:{style:"thin",color:{rgb:"BBBBBB"}},bottom:{style:"thin",color:{rgb:"BBBBBB"}},left:{style:"thin",color:{rgb:"BBBBBB"}},right:{style:"thin",color:{rgb:"BBBBBB"}}}
  ]};
  const range=XLSX.utils.decode_range(ws["!ref"]);
  for(let c=range.s.c;c<=range.e.c;c++){
    const addr=XLSX.utils.encode_cell({r:0,c});
    if(!ws[addr])ws[addr]={t:"s",v:head[c]};
    ws[addr].s=headerStyle;
  }

  // Style: data rows
  const evenFill={fgColor:{rgb:"F5F7FA"}};
  const borderThin=[{top:{style:"thin",color:{rgb:"DDDDDD"}},bottom:{style:"thin",color:{rgb:"DDDDDD"}},left:{style:"thin",color:{rgb:"DDDDDD"}},right:{style:"thin",color:{rgb:"DDDDDD"}}}];
  for(let r=1;r<=range.e.r;r++){
    for(let c=range.s.c;c<=range.e.c;c++){
      const addr=XLSX.utils.encode_cell({r,c});
      if(!ws[addr])continue;
      ws[addr].s={
        font:{sz:10},
        fill:r%2===0?evenFill:{fgColor:{rgb:"FFFFFF"}},
        border:borderThin,
        alignment:{horizontal:c>=5&&c<=8?"center":"right",vertical:"center"}
      };
    }
    // Color status cell
    const statusAddr=XLSX.utils.encode_cell({r,c:12});
    if(ws[statusAddr]){
      const v=ws[statusAddr].v;
      if(v==="موجود")ws[statusAddr].s={font:{sz:10,bold:true,color:{rgb:"2E7D32"}},fill:{fgColor:{rgb:"E8F5E9"}},border:borderThin,alignment:{horizontal:"center"}};
      else if(v==="محدود")ws[statusAddr].s={font:{sz:10,bold:true,color:{rgb:"E65100"}},fill:{fgColor:{rgb:"FFF3E0"}},border:borderThin,alignment:{horizontal:"center"}};
      else if(v==="ناموجود")ws[statusAddr].s={font:{sz:10,bold:true,color:{rgb:"C62828"}},fill:{fgColor:{rgb:"FFEBEE"}},border:borderThin,alignment:{horizontal:"center"}};
    }
    // Color stock cells
    for(let sc=5;sc<=7;sc++){
      const stockAddr=XLSX.utils.encode_cell({r,c:sc});
      if(ws[stockAddr]&&ws[stockAddr].v>0){
        ws[stockAddr].s={font:{sz:10,bold:true,color:{rgb:"1565C0"}},fill:ws[stockAddr].s?.fill||{fgColor:{rgb:"FFFFFF"}},border:borderThin,alignment:{horizontal:"center"}};
      }
    }
  }

  // Freeze top row
  ws["!freeze"]={xSplit:0,ySplit:1};

  XLSX.utils.book_append_sheet(wb,ws,"لیست کالاها");

  // Color summary sheets
  const colors=[...new Set(allProducts.map(p=>p.color))].sort((a,b)=>a.localeCompare(b,"fa"));
  const brands=[...new Set(allProducts.map(p=>p.brand))].sort((a,b)=>a.localeCompare(b,"fa"));
  colors.forEach(color=>{
    const cp=allProducts.filter(p=>p.color===color);
    const cm=brands.map(b=>{
      const bp=cp.filter(p=>p.brand===b);
      if(!bp.length)return null;
      const lengths=[];
      bp.forEach(p=>{for(let i=0;i<totStock(p);i++)lengths.push(p.length)});
      lengths.sort((a,b)=>b-a);
      return {brand:b,lengths,totalArea:bp.reduce((s,p)=>s+totStock(p)*p.width*p.length/10000,0)};
    }).filter(Boolean);
    if(!cm.length)return;
    const maxLen=Math.max(...cm.map(c=>c.lengths.length));
    const sRows=[[color+" — خلاصه","",...cm.map(c=>c.brand)]];
    for(let i=0;i<maxLen;i++){
      sRows.push([i+1,"",...cm.map(c=>c.lengths[i]?c.lengths[i]+" سانتی‌متر":"—")]);
    }
    sRows.push([]);
    sRows.push(["جمع سانتی‌متر","",...cm.map(c=>faNum(c.lengths.reduce((s,l)=>s+l,0)))]);
    sRows.push(["متر مربع","",...cm.map(c=>area1(c.totalArea))]);
    sRows.push(["تعداد ورق","",...cm.map(c=>faNum(c.lengths.length))]);
    const sws=XLSX.utils.aoa_to_sheet(sRows);
    sws["!cols"]=[{wch:16},{wch:4},...cm.map(()=>({wch:14}))];
    // Style summary header
    const sRange=XLSX.utils.decode_range(sws["!ref"]);
    for(let c=0;c<=sRange.e.c;c++){
      const addr=XLSX.utils.encode_cell({r:0,c});
      if(sws[addr])sws[addr].s={font:{bold:true,color:{rgb:"FFFFFF"},sz:11},fill:{fgColor:{rgb:"455A64"}},alignment:{horizontal:"center"},border:borderThin};
    }
    XLSX.utils.book_append_sheet(wb,sws,color.slice(0,31));
  });

  XLSX.writeFile(wb,"mojoodi-anbar.xlsx");
  toast("فایل اکسل دانلود شد: mojoodi-anbar.xlsx");
}

function openSheet(html){document.querySelector("#modal-root").innerHTML=`<div class="overlay sheetov" onclick="if(event.target===this)closeSheet()"><div class="sheet">${html}</div></div>`}
function closeSheet(){closeModal()}
function invFilteredList(){
  let list=DB.products.slice();
  if(stBrand)list=list.filter(p=>p.brand===stBrand);
  if(stColor)list=list.filter(p=>p.color===stColor);
  const q=normDim(stSearch.trim());
  if(q)list=list.filter(p=>{const hay=normDim(p.brand+" "+p.thickness+" "+p.color+" "+p.width+"x"+p.length+" "+p.width+" "+p.length);return q.split(/\s+/).every(t=>hay.includes(t))});
  const areaP=p=>p.width*p.length;
  const sorts={dimdesc:(a,b)=>areaP(b)-areaP(a),dimasc:(a,b)=>areaP(a)-areaP(b),stockdesc:(a,b)=>totStock(b)-totStock(a),stockasc:(a,b)=>totStock(a)-totStock(b)};
  if(sorts[stSort])list.sort(sorts[stSort]);
  return list;
}

function deleteProduct(pid){
  const p=DB.products.find(x=>x.id===pid);if(!p)return;
  if(!confirm("این کالا حذف شود؟ "+prodName(p)))return;
  DB.products=DB.products.filter(x=>x.id!==pid);
  DB.pendingMin=(DB.pendingMin||[]).filter(id=>id!==pid);
  save();render();toast("کالا حذف شد.");
}

function pmAdd(id){DB.pendingMin=DB.pendingMin||[];if(!DB.pendingMin.includes(id))DB.pendingMin.push(id)}
let imp=null;
function openImport(){
  openModal(`<h3>ورود کالا از اکسل</h3>

  </div>
  <input type="file" id="imp-file" accept=".csv,.xlsx,.xls" style="margin:14px 0;width:100%" onchange="impRead(this)">

  <div class="actions"><button class="btn" onclick="closeModal()">بستن</button></div>`,true);

function parseCSV(t){
  const NL=String.fromCharCode(10),CR=String.fromCharCode(13);
  if(t.charCodeAt(0)===65279)t=t.slice(1);
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===","){row.push(cur);cur=""}
    else if(ch===NL){row.push(cur);rows.push(row);row=[];cur=""}
    else if(ch!==CR)cur+=ch}
  if(cur!==""||row.length){row.push(cur);rows.push(row)}
  return rows;
}
async function impRead(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  try{
    if(/\.(xlsx|xls)$/i.test(f.name)){
      if(!window.XLSX){toast("برای فایل xlsx اینترنت لازم است.");return}
      const buf=await f.arrayBuffer();const wb=XLSX.read(buf);
      const firstSheet=wb.Sheets[wb.SheetNames[0]];
      const firstRows=XLSX.utils.sheet_to_json(firstSheet,{header:1,raw:false});
      const firstHead=firstRows[0]?firstRows[0].map(h=>String(h==null?"":h).trim()):[];
      const _hb=firstHead.some(h=>h.includes("برند")),_hc=firstHead.some(h=>h.includes("رنگ")),_hw=firstHead.some(h=>h.includes("عرض")),_hl=firstHead.some(h=>h.includes("طول"));
      if(_hb&&_hc&&_hw&&_hl){
        impBuildDB(firstRows);
      }else{
        const allItems=[];const allErrors=[];
        wb.SheetNames.forEach(sname=>{
          const ws=wb.Sheets[sname];
          const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
          const color=sname.replace(/^کامپوزیت\s*/,"").trim()||sname;
          const result=impParseMatrix(rows,color);
          allItems.push(...result.items);
          allErrors.push(...result.errors);
        });
        imp={items:allItems,errors:allErrors,dups:[]};
        impCheckDups();
        impRender();
      }
    }else{
      const txt=await f.text();const rows=parseCSV(txt);
      const head=rows[0]?rows[0].map(h=>String(h==null?"":h).trim()):[];
      const _hb2=head.some(h=>h.includes("برند")),_hc2=head.some(h=>h.includes("رنگ")),_hw2=head.some(h=>h.includes("عرض")),_hl2=head.some(h=>h.includes("طول"));
      if(_hb2&&_hc2&&_hw2&&_hl2){impBuildDB(rows)}
      else{toast("فرمت CSV پشتیبانی نمی‌شود. از فرمت xlsx استفاده کنید.");return}
    }
  }catch(e){const _b=document.querySelector("#imp-body");if(_b)_b.innerHTML='<div class="notice red">خطا در خواندن فایل: '+esc(e.message||"نامشخص")+'</div>';toast("خواندن فایل ممکن نشد.")}
}
function impParseMatrix(rows,color){
  const items=[],errors=[];
  if(!rows||rows.length<3)return{items,errors};
  const brandRow=rows[1];
  if(!brandRow)return{items,errors};
  const brands=brandRow.map((c,i)=>i>0?String(c==null?"":c).trim():"").filter(Boolean);
  for(let ri=2;ri<rows.length;ri++){
    const r=rows[ri];
    if(!r||!r[0])continue;
    const rowNum=parseInt(String(r[0]).trim());
    if(isNaN(rowNum)||rowNum<=0)continue;
    if(String(r[0]).includes("سانتی")||String(r[0]).includes("متر"))continue;
    brands.forEach((bname,bi)=>{
      const val=r[bi+1];
      if(val==null||String(val).trim()==="")return;
      const length=parseInt(String(val).trim());
      if(isNaN(length)||length<=0)return;
      items.push({brand:bname,th:"۴ میل",color,w:125,l:length,sq:1,sj:0,minp:0,sale:0,minSt:5,n:ri+1});
    });
  }
  return{items,errors};
}
function impCheckDups(){
  if(!imp)return;
  imp.dups=[];
  imp.items=imp.items.filter(item=>{
    const ex=DB.products.find(p=>p.brand===item.brand&&p.thickness===item.th&&p.color===item.color&&p.width===item.w&&p.length===item.l);
    if(ex){item.exId=ex.id;item.action="skip";imp.dups.push(item);return false}
    return true;
  });
}
function impBuildDB(rows){
  const body=document.querySelector("#imp-body");if(!body)return;
  rows=(rows||[]).filter(r=>r&&r.some(c=>String(c==null?"":c).trim()!==""));
  if(rows.length<2){body.innerHTML='<div class="notice red">فایل خالی است یا فقط سرستون دارد.</div>';return}
  const head=rows[0].map(h=>String(h==null?"":h).trim());
  const find=(...keys)=>head.findIndex(h=>keys.some(k=>h.includes(k)));
  const ci={brand:find("برند"),th:find("ضخامت"),color:find("رنگ"),w:find("عرض"),l:find("طول"),
    sq:head.findIndex(h=>h.includes("موجودی")&&h.includes("قم")),
    sj:head.findIndex(h=>h.includes("موجودی")&&h.includes("جعفر")),
    sale:head.findIndex(h=>h.includes("فروش")&&!h.includes("حداقل")),
    minp:find("حداقل قیمت"),
    minSt:head.findIndex(h=>h.includes("حداقل موجودی")||h.includes("هشدار")),
    pm2:find("مترمربع"),
    shelf:find("قفسه","محل نگهداری")};
  if(ci.brand<0||ci.w<0||ci.l<0){body.innerHTML='<div class="notice red">ستون‌های برند / عرض / طول در فایل پیدا نشد.</div>';return}
  imp={items:[],errors:[],dups:[]};
  rows.slice(1).forEach((r,idx)=>{
    const n=idx+2;
    const get=i=>i>=0?String(r[i]==null?"":r[i]).trim():"";
    const brand=get(ci.brand),th=get(ci.th)||"۴ میل",color=get(ci.color);
    const w=Math.floor(deNum(get(ci.w))),l=Math.floor(deNum(get(ci.l)));
    if(!brand){imp.errors.push({n,msg:"برند خالی است"});return}
    if(!color){imp.errors.push({n,msg:"رنگ خالی است"});return}
    if(!(w>0)||!(l>0)){imp.errors.push({n,msg:"عرض یا طول نامعتبر"});return}
    let sale=deNum(get(ci.sale))||0;
    const pm2=deNum(get(ci.pm2))||0;
    if(!sale&&pm2>0)sale=Math.round(w*l*pm2/10000);
    const item={brand,th,color,w,l,sq:Math.floor(deNum(get(ci.sq)))||0,sj:Math.floor(deNum(get(ci.sj)))||0,minp:deNum(get(ci.minp))||0,sale,minSt:Math.floor(deNum(get(ci.minSt)))||5,shelf:get(ci.shelf),n};
    const ex=DB.products.find(p=>p.brand===brand&&p.thickness===th&&p.color===color&&p.width===w&&p.length===l);
    if(ex){item.exId=ex.id;item.action="skip";imp.dups.push(item)}else imp.items.push(item);
  });
  impRender();
}
function impRender(){
  const b=document.querySelector("#imp-body");if(!b||!imp)return;
  b.innerHTML=`
  <div class="tk-sum" style="margin:0 0 10px"><span>${faNum(imp.items.length)} جدید</span><span>${faNum(imp.dups.length)} تکراری</span><span>${faNum(imp.errors.length)} خطا</span></div>

  ${imp.dups.length?`<div class="sub" style="margin:10px 0 4px">کالاهای تکراری — برای هرکدام انتخاب کنید:</div>${imp.dups.map((t,i)=>`<div class="tk-line"><b class="num">${faNum(t.w)}×${faNum(t.l)}</b><span class="meta">${esc(t.brand)} — ${esc(t.color)}</span><select onchange="imp.dups[${i}].action=this.value" style="padding:6px;border:1px solid var(--border);border-radius:8px">${[["skip","رد شود"],["merge","ویرایش (افزودن موجودی)"],["replace","جایگزین شود"]].map(([k,l2])=>`<option value="${k}" ${t.action===k?"selected":""}>${l2}</option>`).join("")}</select></div>`).join("")}`:""}
  ${(imp.items.length||imp.dups.length)?`<div class="actions"><button class="btn primary" onclick="impCommit()">تأیید و ثبت همه</button></div>`:""}`;

function impCommit(){
  if(!imp)return;
  let added=0,merged=0,replaced=0,skipped=0;
  imp.items.forEach(t=>{
    const p={id:uid(),brand:t.brand,thickness:t.th,color:t.color,width:t.w,length:t.l,stock:{qom:0,jaf:0},minStock:t.minSt,costPrice:0,salePrice:t.sale,minPrice:t.minp,shelf:t.shelf||""};
    DB.products.push(p);if(!(p.minPrice>0))pmAdd(p.id);
    [["qom",t.sq],["jaf",t.sj]].forEach(([wh,qn])=>{
      if(qn>0){
        InventoryEngine.receive({ productId: p.id, warehouseId: wh, quantity: qn, referenceType: 'xlsx_import', referenceId: '', reason: 'ورود از اکسل' });
        DB.counters.entry++;
        DB.entries.push({id:uid(),number:"I-"+DB.counters.entry,productId:p.id,name:prodName(p),qty:qn,buyPrice:0,shippingTotal:0,supplier:"ورود از اکسل",wh,date:todayISO(),note:"ورود از اکسل"});
      }
    });
    added++;
  });
  imp.dups.forEach(t=>{
    const p=DB.products.find(x=>x.id===t.exId);if(!p){skipped++;return}
    if(t.action==="replace"){
      const qomDiff=t.sq-(p.stock.qom||0),jafDiff=t.sj-(p.stock.jaf||0);
      if(qomDiff>0)InventoryEngine.receive({ productId: p.id, warehouseId: 'qom', quantity: qomDiff, referenceType: 'xlsx_import', referenceId: '', reason: 'ورود از اکسل - جایگزینی' });
      else if(qomDiff<0)InventoryEngine.sell({ productId: p.id, warehouseId: 'qom', quantity: -qomDiff, referenceType: 'xlsx_import', referenceId: '', reason: 'ورود از اکسل - جایگزینی' });
      if(jafDiff>0)InventoryEngine.receive({ productId: p.id, warehouseId: 'jaf', quantity: jafDiff, referenceType: 'xlsx_import', referenceId: '', reason: 'ورود از اکسل - جایگزینی' });
      else if(jafDiff<0)InventoryEngine.sell({ productId: p.id, warehouseId: 'jaf', quantity: -jafDiff, referenceType: 'xlsx_import', referenceId: '', reason: 'ورود از اکسل - جایگزینی' });
      p.minStock=t.minSt;p.salePrice=t.sale;p.minPrice=t.minp;if(t.shelf)p.shelf=t.shelf;if(!(p.minPrice>0))pmAdd(p.id);replaced++;
    }
    else if(t.action==="merge"){
      if(t.sq>0)InventoryEngine.receive({ productId: p.id, warehouseId: 'qom', quantity: t.sq, referenceType: 'xlsx_import', referenceId: '', reason: 'ورود از اکسل - ادغام' });
      if(t.sj>0)InventoryEngine.receive({ productId: p.id, warehouseId: 'jaf', quantity: t.sj, referenceType: 'xlsx_import', referenceId: '', reason: 'ورود از اکسل - ادغام' });
      if(t.sale)p.salePrice=t.sale;if(t.minp)p.minPrice=t.minp;if(t.shelf)p.shelf=t.shelf;merged++;
    }
    else skipped++;
  });
  const errs=imp.errors.slice();
  save();render();
  openModal(`<h3>گزارش ورود از اکسل</h3>
  <div class="pc-stocks" style="margin:12px 0"><div><span>ثبت‌شده</span><b class="num">${faNum(added)}</b></div><div><span>ویرایش/جایگزین</span><b class="num">${faNum(merged+replaced)}</b></div><div><span>خطا</span><b class="num">${faNum(errs.length)}</b></div><div class="tot"><span>تکراری ردشده</span><b class="num">${faNum(skipped)}</b></div></div>
  ${errs.length?`<div class="notice red">${errs.map(e=>`ردیف ${faNum(e.n)}: ${e.msg}`).join("<br>")}</div>`:""}
  <div class="actions"><button class="btn primary" onclick="closeModal()">باشه</button></div>`);
  imp=null;
}

function addBulkRow(){
  const d=document.createElement("div");d.className="bk-row";
  d.innerHTML=`<input class="bk-w" value="125" inputmode="numeric" oninput="this.value=latinDigits(this.value).replace(/[^0-9]/g,'')" onkeydown="bkKey(event)">`+
  `<input class="bk-l" inputmode="numeric" oninput="this.value=latinDigits(this.value).replace(/[^0-9]/g,'')" onkeydown="bkKey(event)">`+
  `<input class="bk-p" inputmode="numeric" oninput="fmtPriceInput(this)" onkeydown="bkKey(event)">`+
  (isManager()?`<input class="bk-m" inputmode="numeric" oninput="fmtPriceInput(this)" onkeydown="bkKey(event)">`:`<input class="bk-m" disabled placeholder="مدیر">`)+
  `<input class="bk-sq" value="0" inputmode="numeric" oninput="this.value=latinDigits(this.value).replace(/[^0-9]/g,'')" onkeydown="bkKey(event)">`+
  `<input class="bk-sj" value="0" inputmode="numeric" oninput="this.value=latinDigits(this.value).replace(/[^0-9]/g,'')" onkeydown="bkKey(event)">`+
  `<button class="del" tabindex="-1" onclick="this.parentNode.remove()">×</button>`;
  const box=document.querySelector("#bk-rows");if(!box)return;box.appendChild(d);
  const l=d.querySelector(".bk-l");setTimeout(()=>l.focus(),30);
}
function bkKey(e){
  if(e.key!=="Enter")return;e.preventDefault();
  const inputs=[...document.querySelectorAll("#bk-rows input:not([disabled])")];
  const i=inputs.indexOf(e.target);
  if(i>=0&&i<inputs.length-1){const n=inputs[i+1];n.focus();n.select()}else addBulkRow();
}
function saveBulk(){
  const brand=(bulk.brand||"").trim(),th=(bulk.th||"").trim(),color=(bulk.color||"").trim();
  if(!brand||!th||!color){toast("برند، ضخامت و رنگ را وارد کنید.");return}
  const rows=[...document.querySelectorAll(".bk-row")];
  let saved=0,skipped=0;
  const histItems=[];
  rows.forEach(r=>{
    const g=cl=>deNum((r.querySelector(cl)||{}).value||"");
    const w=Math.floor(g(".bk-w")),l=Math.floor(g(".bk-l"));
    if(w<=0||l<=0){skipped++;return}
    if(DB.products.some(p=>p.brand===brand&&p.thickness===th&&p.color===color&&p.width===w&&p.length===l)){skipped++;return}
    const p={id:uid(),brand,thickness:th,color,width:w,length:l,stock:{qom:0,jaf:0},minStock:5,costPrice:0,salePrice:g(".bk-p"),minPrice:isManager()?g(".bk-m"):0,shelf:""};
    DB.products.push(p);
    if(!(p.minPrice>0))(DB.pendingMin=DB.pendingMin||[]).push(p.id);
    const qomQty=Math.floor(g(".bk-sq")),jafQty=Math.floor(g(".bk-sj"));
    [["qom",qomQty],["jaf",jafQty]].forEach(([wh,qn])=>{
      if(qn>0){
        InventoryEngine.receive({ productId: p.id, warehouseId: wh, quantity: qn, referenceType: 'bulk_entry', referenceId: '', reason: 'ثبت گروهی کالا' });
        DB.counters.entry++;
        DB.entries.push({id:uid(),number:"I-"+DB.counters.entry,productId:p.id,name:prodName(p),qty:qn,buyPrice:0,shippingTotal:0,supplier:"ثبت گروهی",wh,date:jdToISO(document.querySelector("#bk-date").value)||todayISO(),note:"ثبت گروهی کالا"});
        histItems.push({brand,color,thickness:th,width:w,length:l,qty:qn,wh});
      }
    });
    saved++;
  });
  if(!saved){toast("هیچ ردیف معتبری برای ثبت نیست."+(skipped?" ("+faNum(skipped)+" ردیف ناقص/تکراری)":""));return}
  if(histItems.length){
    const bulkDateISO=jdToISO(document.querySelector("#bk-date").value)||todayISO();
    DB.truckHistory.push({id:uid(),date:bulkDateISO,plate:bulk.plate||"",driver:bulk.driver||"",supplier:bulk.supplier||"ثبت گروهی",items:histItems,totalQty:histItems.reduce((s,i)=>s+i.qty,0),totalArea:histItems.reduce((s,i)=>s+i.qty*i.width*i.length/10000,0),registeredBy:session.name,registeredAt:new Date().toISOString()});
  }
  save();closeModal();render();
  toast(faNum(saved)+" کالا ثبت شد"+(skipped?" — "+faNum(skipped)+" ردیف ناقص/تکراری رد شد":"")+(isManager()?"":" — به مدیر برای تعیین حداقل قیمت اطلاع داده شد"));
}

let truck=null;
function openTruck(){
  truck={wh:"qom",brand:"",th:"۴ میل",color:"",lines:[],date:todayISO(),plate:"",driver:"",supplier:"",shelf:""};
  go("truckEntry");
}
function truckAddLine(){
  const w=Math.floor(deNum(document.querySelector("#tk-w").value)),l=Math.floor(deNum(document.querySelector("#tk-l").value)),q=Math.floor(deNum(document.querySelector("#tk-q").value))||1;
  if(w<=0||l<=0){toast("عرض و طول را وارد کنید.");return}
  const ex=truck.lines.find(x=>x.w===w&&x.l===l);
  if(ex)ex.qty+=q;else truck.lines.push({w,l,qty:q});
  document.querySelector("#tk-l").value="";document.querySelector("#tk-q").value="1";
  renderTruckLines();document.querySelector("#tk-l").focus();
}
function truckAddLens(){
  const el=document.querySelector("#tk-lens");if(!el)return;
  const w=Math.floor(deNum(document.querySelector("#tk-w").value))||125;
  const toks=latinDigits(el.value).split(/[\s,،٬;\-]+/).filter(Boolean);
  let added=0;
  toks.forEach(t=>{
    const m=t.match(/^([0-9]+(?:\.[0-9]+)?)(?:[xX*×]([0-9]+))?$/);if(!m)return;
    const L=Math.floor(Number(m[1])),q=Math.floor(Number(m[2]||"1"))||1;
    if(L<=0)return;
    const ex=truck.lines.find(x=>x.w===w&&x.l===L);
    if(ex)ex.qty+=q;else truck.lines.push({w,l:L,qty:q});
    added+=q;
  });
  if(!added){toast("حداقل یک طول بنویسید.");return}
  el.value="";renderTruckLines();el.focus();
  toast(faNum(added)+" ورق به لیست اضافه شد.");
}
function truckAddQuick(L){
  const w=Math.floor(deNum(document.querySelector("#tk-w").value))||125;
  const ex=truck.lines.find(x=>x.w===w&&x.l===L);
  if(ex)ex.qty+=1;else truck.lines.push({w,l:L,qty:1});
  renderTruckLines();
}
function truckAddFull(n){
  n=Math.floor(n)||0;if(n<=0)return;
  const w=Math.floor(deNum(document.querySelector("#tk-w").value))||125;
  const ex=truck.lines.find(x=>x.w===w&&x.l===320);
  if(ex)ex.qty+=n;else truck.lines.push({w,l:320,qty:n});
  renderTruckLines();
  toast(faNum(n)+" ورق کامل "+faNum(w)+"×۳۲۰ اضافه شد.");
}
function truckDelLine(i){truck.lines.splice(i,1);renderTruckLines()}
function renderTruckLines(){
  const box=document.querySelector("#tk-lines"),sum=document.querySelector("#tk-sum");
  if(!box)return;
  box.innerHTML=truck.lines.map((x,i)=>`<div class="tk-line"><b class="num">${faNum(x.w)}×${faNum(x.l)}</b><span class="meta">${fmt(x.qty)} ورق — ${(x.w*x.l*x.qty/10000).toLocaleString("fa-IR",{maximumFractionDigits:1})} متر مربع</span><button class="del" onclick="truckDelLine(${i})">×</button></div>`).join("");
  const tq=truck.lines.reduce((s,x)=>s+x.qty,0),ta=truck.lines.reduce((s,x)=>s+x.w*x.l*x.qty/10000,0);
  sum.style.display=truck.lines.length?"flex":"none";
  sum.innerHTML=`<span>جمع: ${fmt(tq)} ورق در ${faNum(truck.lines.length)} سایز</span><span>${ta.toLocaleString("fa-IR",{maximumFractionDigits:1})} متر مربع</span>`;
  const sv=document.querySelector("#tk-save");if(sv)sv.textContent=truck.lines.length?`ثبت ورود انبار (${fmt(tq)} ورق)`:"ثبت ورود انبار";
}
function saveTruck(fromPage){
  const brand=(truck.brand||"").trim(),color=(truck.color||"").trim(),th=(truck.th||"").trim();
  const shelf=(document.querySelector("#tk-shelf")?.value||"").trim();
  if(!brand||!th||!color){toast("برند، ضخامت و رنگ محموله را وارد کنید.");return false}
  if(!truck.lines.length){toast("حداقل یک ردیف ابعاد اضافه کنید.");return false}
  const buy=deNum(document.querySelector("#tk-buy")?.value||"0"),ship=deNum(document.querySelector("#tk-ship")?.value||"0"),sup=(truck.supplier||"").trim()||"تخلیه کامیون";
  const totalQty=truck.lines.reduce((s,x)=>s+x.qty,0);
  const shipPer=totalQty>0?ship/totalQty:0;
  const histItems=[];
  let created=0;
  truck.lines.forEach(x=>{
    let p=DB.products.find(p=>p.brand===brand&&p.thickness===th&&p.color===color&&p.width===x.w&&p.length===x.l);
    if(!p){p={id:uid(),brand,thickness:th,color,width:x.w,length:x.l,stock:{qom:0,jaf:0},minStock:5,costPrice:0,salePrice:0,minPrice:0,shelf};DB.products.push(p);(DB.pendingMin=DB.pendingMin||[]).push(p.id);created++}
    const unit=buy>0?Math.round(buy+shipPer):0;
    if(unit>0){const prev=totStock(p);p.costPrice=prev>0&&p.costPrice>0?Math.round((prev*p.costPrice+x.qty*unit)/(prev+x.qty)):unit}
    InventoryEngine.receive({ productId: p.id, warehouseId: truck.wh, quantity: x.qty, referenceType: 'truck_entry', referenceId: '', reason: 'تخلیه کامیون' });
    DB.counters.entry++;
    DB.entries.push({id:uid(),number:"I-"+DB.counters.entry,productId:p.id,name:prodName(p),qty:x.qty,buyPrice:buy,shippingTotal:Math.round(shipPer*x.qty),supplier:sup,wh:truck.wh,date:jdToISO(document.querySelector("#tk-date").value)||todayISO(),note:"تخلیه کامیون"});
    histItems.push({brand,color,thickness:th,width:x.w,length:x.l,qty:x.qty,wh:truck.wh});
  });
  DB.truckHistory.push({id:uid(),date:jdToISO(document.querySelector("#tk-date").value)||todayISO(),plate:truck.plate||"",driver:truck.driver||"",supplier:sup,items:histItems,totalQty,totalArea:histItems.reduce((s,i)=>s+i.qty*i.width*i.length/10000,0),registeredBy:session.name,registeredAt:new Date().toISOString()});
  if(!fromPage){save();closeModal();render()}
  else{save()}
  toast(`ورود انبار ثبت شد: ${fmt(totalQty)} ورق${created?` — ${faNum(created)} کالای جدید تعریف شد`:""}`);
}

function saveNewProduct(fromInvoice){
  const g=id=>{const el=document.querySelector(id);return el?el.value.trim():""};
  const brand=g("#np-brand"),th=g("#np-th"),color=g("#np-color");
  const w=Math.floor(deNum(g("#np-w"))),l=Math.floor(deNum(g("#np-l")));

function qaParseLens(){
  const el=document.querySelector("#qa-page-lens");if(!el)return;

  const toks=latinDigits(text).split(/[\s,،٬;\-]+/).filter(Boolean);
  let added=0;
  toks.forEach(t=>{
    const m=t.match(/^([0-9]+(?:\.[0-9]+)?)(?:[xX*×]([0-9]+))?$/);if(!m)return;
    const l=Math.floor(Number(m[1])),q=Math.floor(Number(m[2]||"1"))||1;
    if(l<=0)return;
    const ex=_qaRows.find(r=>r.l===l);
    if(ex)ex.qty+=q; else _qaRows.push({l,qty:q,w});
    added+=q;
  });
  if(!added){toast("حداقل یک طول معتبر بنویسید.");return}
  el.value="";el.focus();
  window._qaLastAdded=faNum(added)+" سایز به لیست اضافه شد";
  render();
  setTimeout(()=>{const el2=document.querySelector("#qa-page-lens");if(el2)el2.focus()},50);
}

function renderCustomerPrices(customerId) {
  const prices = DB.customerPrices.filter(cp => cp.customerId === customerId);
  if (prices.length === 0) {
    return '<div class="sub">هنوز قیمت اختصاصی تعریف نشده است.</div>';
  }
  
  return `
    <div class="tblwrap"><table class="statement-table">
      <thead><tr><th>محصول</th><th>قیمت اختصاصی</th><th>شروع</th><th>پایان</th><th>وضعیت</th><th>عملیات</th></tr></thead>
      <tbody>
      ${prices.map(cp => {
        const product = getProd(cp.productId);
        const now = todayISO();
        const isValid = (!cp.validFrom || cp.validFrom <= now) && (!cp.validUntil || cp.validUntil >= now);
        const isExpired = cp.validUntil && cp.validUntil < now;
        return `
          <tr>
            <td>${product ? esc(prodName(product)) : '<span class="sub">محصول حذف شده</span>'}</td>
            <td class="num">${fmt(cp.price)}</td>
            <td class="num">${cp.validFrom ? faDate(cp.validFrom) : '—'}</td>
            <td class="num">${cp.validUntil ? faDate(cp.validUntil) : '—'}</td>
            <td><span class="badge ${isValid ? 'green' : isExpired ? 'red' : 'gray'}">${isValid ? 'فعال' : isExpired ? 'منقضی' : 'آینده'}</span></td>
            <td>
              <button class="btn sm" onclick="editCustomerPrice('${customerId}','${cp.id}')">ویرایش</button>
              <button class="btn sm danger" onclick="deleteCustomerPrice('${customerId}','${cp.id}')">حذف</button>
            </td>
          </tr>
        `;
      }).join('')}
      </tbody>
    </table></div>
  `;
}

      </div>

        <label>پایان (اختیاری)</label>
        <input id="cp-until" type="date" value="${existingPrice?.validUntil || ''}">
      </div>

function saveCustomerPrice(customerId, priceId) {
  const productId = document.getElementById('cp-product').value;
  const price = deNum(document.getElementById('cp-price').value);
  const validFrom = document.getElementById('cp-from').value || null;
  const validUntil = document.getElementById('cp-until').value || null;
  
  if (!productId) {
    toast('محصول را انتخاب کنید');
    return;
  }
  
  if (price <= 0) {
    toast('قیمت را وارد کنید');
    return;
  }
  
  // Validate price against minimum
  const product = getProd(productId);
  if (product && product.minPrice && price < product.minPrice && !isManager()) {
    toast('قیمت کمتر از حداقل مجاز است: ' + fmt(product.minPrice));
    return;
  }
  
  if (validFrom && validUntil && validFrom > validUntil) {
    toast('تاریخ پایان باید بعد از تاریخ شروع باشد');
    return;
  }
  
  CustomerPricing.setPrice(customerId, productId, price, validFrom, validUntil);
  closeModal();
  render();
  toast('قیمت اختصاصی ذخیره شد');
}

function editCustomerPrice(customerId, priceId) {
  openCustomerPriceModal(customerId, priceId);
}

function deleteCustomerPrice(customerId, priceId) {
  if (!confirm('آیا از حذف قیمت اختصاصی اطمینان دارید؟')) return;
  CustomerPricing.removePrice(customerId, priceId);
  render();
  toast('قیمت اختصاصی حذف شد');
}

}
function applyBackup(text,name){
  let j=null;try{j=JSON.parse(text)}catch(e){toast("فایل پشتیبان معتبر نیست.");return false}
  const db=(j&&j.db&&Array.isArray(j.db.products))?j.db:((j&&Array.isArray(j.products))?j:null);
  if(!db||!Array.isArray(db.customers)||!Array.isArray(db.invoices)){toast("فایل پشتیبان معتبر نیست.");return false}
  if(!confirm("همه اطلاعات فعلی اپ با فایل پشتیبان جایگزین می‌شود. ادامه می‌دهید؟"))return false;
  db.cards=db.cards||[];db.activity=db.activity||[];db.payments=db.payments||[];db.counters=db.counters||DB.counters;db.truckHistory=db.truckHistory||[];db.stocktaking=db.stocktaking||[];db.auditLog=db.auditLog||[];db.roles=db.roles||[];db.brandMemory=db.brandMemory||{};
  DB=db;logAct("backup","بازیابی فایل پشتیبان"+(name?" ("+name+")":""));save();render();toast("اطلاعات از فایل پشتیبان بازیابی شد.");return true;
}
function backupImport(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>applyBackup(String(r.result),f.name);r.readAsText(f)};
  inp.click();
}

      <button class="btn primary" onclick="openNewStocktaking()">+ شروع انبارگردانی جدید</button>
    </div></div>
  <div class="card">
  ${list.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>تاریخ</th><th>تعداد کالا</th><th>اختلاف کل</th><th>وضعیت</th><th>ثبت‌کننده</th><th></th></tr></thead><tbody>
  ${list.map(s=>{
    const diffCount=s.items.reduce((d,i)=>d+(i.counted!==null?Math.abs(i.diff):0),0);

  </div>`;
}
function openNewStocktaking(){
  if(!isManager())return;
  const items=DB.products.map(p=>({productId:p.id,brand:p.brand,color:p.color,thickness:p.thickness,width:p.width,length:p.length,qom:p.stock.qom||0,jaf:p.stock.jaf||0,total:totStock(p),counted:null,diff:0}));
  const s={id:uid(),date:todayISO(),items,applied:false,registeredBy:session.name,registeredAt:new Date().toISOString()};
  DB.stocktaking.push(s);
  save();closeModal();render();
  openStocktakingSession(s.id);
  toast("انبارگردانی جدید شروع شد. تعداد شمارش‌شده را وارد کنید.");
}
function openStocktakingSession(id){
  const s=(DB.stocktaking||[]).find(x=>x.id===id);
  if(!s){toast("رکورد پیدا نشد.");return}
  window._stk=s;
  const diffs=s.items.filter(i=>i.counted!==null&&i.diff!==0);
  const totalDiff=diffs.reduce((d,i)=>d+i.diff,0);
  openModal(`<h3>${ic("box",22)} انبارگردانی — ${faDate(s.date)}</h3>
    ${s.applied?'<div class="notice green" style="margin-bottom:12px">✅ این انبارگردانی قبلاً اعمال شده است.</div>':''}
    <div class="invsum" style="margin-bottom:12px"><span>📦 کل کالاها: <b class="num">${faNum(s.items.length)}</b></span><span>✅ شمارش شده: <b class="num">${faNum(s.items.filter(i=>i.counted!==null).length)}</b></span>${diffs.length?`<span>⚠️ اختلاف: <b class="num pos">${faNum(diffs.length)} مورد</b></span>`:""}</div>
    <div style="max-height:60vh;overflow-y:auto">
    <table class="tbl"><thead><tr><th>برند</th><th>رنگ</th><th>ابعاد</th><th>سیستم قم</th><th>سیستم جعفریه</th><th>سیستم کل</th><th>شمارش قم</th><th>شمارش جعفریه</th><th>اختلاف</th></tr></thead><tbody>
    ${s.items.map((i,idx)=>`<tr${i.counted!==null&&(i.counted.qom!==i.qom||i.counted.jaf!==i.jaf)?' style="background:rgba(255,193,7,.08)"':''}>
      <td>${esc(i.brand)}</td><td>${esc(i.color)}</td><td class="num">${faNum(i.width)}×${faNum(i.length)}</td>
      <td class="num">${fmt(i.qom)}</td><td class="num">${fmt(i.jaf)}</td><td class="num"><b>${fmt(i.total)}</b></td>
      <td><input class="stk-qom" data-idx="${idx}" inputmode="numeric" value="${i.counted!==null?i.counted.qom:""}" placeholder="—" ${s.applied?"disabled":""} oninput="stkUpdate(${idx})" style="width:60px;text-align:center"></td>
      <td><input class="stk-jaf" data-idx="${idx}" inputmode="numeric" value="${i.counted!==null?i.counted.jaf:""}" placeholder="—" ${s.applied?"disabled":""} oninput="stkUpdate(${idx})" style="width:60px;text-align:center"></td>
      <td class="num ${i.counted!==null?(i.diff>0?"pos":i.diff<0?"neg":""):''}">${i.counted!==null?(i.diff>0?"+"+fmt(i.diff):i.diff<0?fmt(i.diff):"—"):"—"}</td>
    </tr>`).join("")}
    </tbody></table></div>
    ${!s.applied?`<div class="actions" style="margin-top:12px">
      <button class="btn primary" onclick="applyStocktaking('${s.id}')">اعمال اختلافات روی موجودی</button>
      <button class="btn" onclick="saveStocktaking('${s.id}')">ذخیره موقت</button>
      <button class="btn danger" onclick="deleteStocktaking('${s.id}')">حذف</button>
      <button class="btn" onclick="closeModal()">بستن</button>
    </div>`:`<div class="actions"><button class="btn" onclick="closeModal()">بستن</button></div>`}`,true);
}
function stkUpdate(idx){
  const s=window._stk;if(!s)return;
  const qomEl=document.querySelectorAll(".stk-qom")[idx];
  const jafEl=document.querySelectorAll(".stk-jaf")[idx];
  if(!qomEl||!jafEl)return;
  const qom=qomEl.value.trim()===""?null:Math.floor(Number(latinDigits(qomEl.value)));
  const jaf=jafEl.value.trim()===""?null:Math.floor(Number(latinDigits(jafEl.value)));
  if(qom!==null&&jaf!==null){
    s.items[idx].counted={qom,jaf};
    s.items[idx].diff=(qom+jaf)-s.items[idx].total;
  }else{
    s.items[idx].counted=null;
    s.items[idx].diff=0;
  }
}
function saveStocktaking(id){
  const s=(DB.stocktaking||[]).find(x=>x.id===id);if(!s)return;
  save();closeModal();toast("انبارگردانی ذخیره شد.");
}
function applyStocktaking(id){
  const s=(DB.stocktaking||[]).find(x=>x.id===id);if(!s)return;
  const diffs=s.items.filter(i=>i.counted!==null&&i.diff!==0);
  if(!diffs.length){toast("اختلافی وجود ندارد یا شمارشی ثبت نشده.");return}
  if(!confirm("آیا مطمئن هستید؟ تعداد "+fmt(diffs.length)+" کالا تغییر خواهد کرد."))return;
  diffs.forEach(i=>{
    const p=getProd(i.productId);if(!p)return;
    InventoryEngine.adjust({ productId: p.id, warehouseId: 'qom', newQuantity: i.counted.qom, referenceType: 'stocktaking', referenceId: s.id, reason: 'انبارگردانی ' + s.date });
    InventoryEngine.adjust({ productId: p.id, warehouseId: 'jaf', newQuantity: i.counted.jaf, referenceType: 'stocktaking', referenceId: s.id, reason: 'انبارگردانی ' + s.date });
  });
  s.applied=true;
  s.appliedAt=new Date().toISOString();
  save();closeModal();render();
  toast("انبارگردانی اعمال شد: "+fmt(diffs.length)+" کالا تغییر یافت.");
}
function deleteStocktaking(id){
  if(!confirm("آیا این انبارگردانی حذف شود؟"))return;
  DB.stocktaking=(DB.stocktaking||[]).filter(x=>x.id!==id);
  save();closeModal();render();toast("انبارگردانی حذف شد.");
}

/* =============== shelf report (گزارش قفسه‌بندی انبار) =============== */
function pageShelfReport(){
  const shelfMap={};

    const sh=p.shelf||"بدون قفسه";
    if(!shelfMap[sh])shelfMap[sh]={items:[],totalQty:0,totalArea:0};
    const tot=totStock(p);
    shelfMap[sh].items.push(p);
    shelfMap[sh].totalQty+=tot;
    shelfMap[sh].totalArea+=tot*(p.width*p.length/10000);
  });
  const shelves=Object.entries(shelfMap).sort((a,b)=>a[0].localeCompare(b[0],"fa"));
  const totalAllQty=shelves.reduce((s,[,v])=>s+v.totalQty,0);
  const totalAllArea=shelves.reduce((s,[,v])=>s+v.totalArea,0);
  const maxQty=shelves.length?Math.max(...shelves.map(([,v])=>v.totalQty)):0;
  return `
  <div class="pagehead"><div><div class="h1">قفسه‌بندی انبار</div><div class="sub">${faNum(shelves.length)} قفسه — ${fmt(totalAllQty)} ورق — ${area1(totalAllArea)} متر مربع</div></div></div>

  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:20px">
    ${shelves.map(([sh,v])=>{
      const pct=maxQty>0?Math.round(v.totalQty/maxQty*100):0;
      return `<div class="card" style="padding:14px;text-align:center;cursor:pointer" onclick="document.getElementById('shelf-${esc(sh).replace(/[^a-zA-Z0-9]/g,'')}')?.scrollIntoView({behavior:'smooth',block:'start'})">
        <div style="font-size:13px;font-weight:700;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sh)}</div>
        <div style="font-size:22px;font-weight:800;color:var(--md-primary)">${fmt(v.totalQty)}</div>
        <div style="font-size:11px;color:var(--md-on-surface-variant)">ورق</div>
        <div style="margin-top:6px;height:4px;background:var(--md-surface-variant);border-radius:2px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:var(--md-primary);border-radius:2px"></div>
        </div>
        <div style="font-size:11px;color:var(--md-on-surface-variant);margin-top:4px">${area1(v.totalArea)} m² — ${faNum(v.items.filter(p=>totStock(p)>0).length)} نوع</div>
      </div>`;
    }).join("")}
    <div class="card" style="padding:14px;text-align:center;border:2px dashed var(--md-outline-variant)">
      <div style="font-size:13px;font-weight:700;margin-bottom:6px">بدون قفسه</div>
      <div style="font-size:22px;font-weight:800;color:var(--md-error)">${shelfMap["بدون قفسه"]?fmt(shelfMap["بدون قفسه"].totalQty):"۰"}</div>
      <div style="font-size:11px;color:var(--md-on-surface-variant)">ورق</div>
    </div>
  </div>

  ${shelves.length?shelves.map(([sh,v])=>{
    const brands=[...new Set(v.items.filter(p=>totStock(p)>0).map(p=>p.brand))].sort();
    return `<div class="card" id="shelf-${esc(sh).replace(/[^a-zA-Z0-9]/g,'')}" style="scroll-margin-top:80px">
      <h3 style="display:flex;justify-content:space-between;align-items:center">
        <span>📁 ${esc(sh)}</span>
        <span class="badge blue">${fmt(v.totalQty)} ورق — ${area1(v.totalArea)} م²</span>
      </h3>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin:8px 0">
        ${brands.map(b=>{
          const bc=v.items.filter(p=>p.brand===b&&totStock(p)>0);
          const bq=bc.reduce((s,p)=>s+totStock(p),0);
          return `<span style="font-size:12px;background:var(--md-primary-container);color:var(--md-primary);padding:3px 10px;border-radius:12px">${esc(b)}: ${fmt(bq)}</span>`;
        }).join("")}
      </div>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>برند</th><th>رنگ</th><th>ابعاد</th><th>تعداد ورق</th><th>متراژ</th>${isManager()?"<th>قفسه</th>":""}</tr></thead><tbody>
      ${v.items.filter(p=>totStock(p)>0).sort((a,b)=>a.brand.localeCompare(b.brand,"fa")||(b.length-a.length)).map(p=>{
        const tot=totStock(p);
        const area=tot*(p.width*p.length/10000);
        if(isManager()){
        return `<tr><td>${esc(p.brand)}</td><td>${esc(p.color)}</td><td class="num">${faNum(p.width)}×${faNum(p.length)}</td><td class="num"><b>${fmt(tot)}</b></td><td class="num">${area1(area)} م²</td>

        }
      }).join("")}
      </tbody></table></div>
    </div>`;
  }).join(""):'<div class="empty">هیچ قفسه‌ای تعریف نشده است.</div>'}`;
}
function saveShelfInline(el){
  const pid=el.dataset.pid;
  const val=(el.value||"").trim();
  const p=DB.products.find(x=>x.id===pid);
  if(p){p.shelf=val;save();}

/* =============== database management (مدیریت دیتابیس) =============== */
let _dbBackup=null,_dbBackupTime="",_dbBackupAction="";
function dbAutoBackup(action){
  _dbBackup=JSON.parse(JSON.stringify(DB));
  _dbBackupTime=new Date().toLocaleString("fa-IR");
  _dbBackupAction=action;
  try{localStorage.setItem("cs_db_backup",JSON.stringify({db:_dbBackup,time:_dbBackupTime,action:_dbBackupAction}))}catch(e){}
}
function dbLoadSavedBackup(){
  try{const raw=localStorage.getItem("cs_db_backup");if(raw){const d=JSON.parse(raw);if(d&&d.db){_dbBackup=d.db;_dbBackupTime=d.time;_dbBackupAction=d.action}}}catch(e){}
}
function dbRestoreBackup(){
  if(!_dbBackup){toast("بکاپی برای بازیابی وجود ندارد.");return}
  if(!confirm("اطلاعات قبلی بازگردانده شود؟"))return;
  DB=_dbBackup;
  _dbBackup=null;_dbBackupTime="";_dbBackupAction="";
  try{localStorage.removeItem("cs_db_backup")}catch(e){}
  save();render();toast("اطلاعات با موفقیت بازگردانده شد.");
}
function dbClearBackup(){
  _dbBackup=null;_dbBackupTime="";_dbBackupAction="";

}

  const tabs=[{id:"reservations",label:"رزروها"},{id:"transfers",label:"انتقالات"},{id:"reconciliation",label:"تطبیق"},{id:"adjustments",label:"اصلاحات"},{id:"stocktaking",label:"انبارگردانی"}];
  return `
  <div class="pagehead"><div><div class="h1">${ic("settings",22)} مرکز کنترل انبار</div><div class="sub">مدیریت رزروها، انتقالات و تطبیق</div></div></div>

  ${_invCtrlTab==="reservations"?renderReservations():
    _invCtrlTab==="transfers"?renderTransfers():
    _invCtrlTab==="reconciliation"?renderReconciliation():
    _invCtrlTab==="adjustments"?renderAdjustments():
    renderStocktakingHistory()}`;
}
function renderReservations(){
  const reservations=(DB.inventoryReservations||[]).slice().reverse();
  const now=Date.now();
  const statusColors={ACTIVE:"blue",RELEASED:"green",CONVERTED:"green",CANCELLED:"gray"};
  const rows=reservations.map(r=>{
    const prod=getProd(r.productId);
    const ageMs=now-new Date(r.createdAt).getTime();
    const ageDays=Math.floor(ageMs/86400000);
    let agingClass="fresh",agingLabel="امروز";
    if(ageDays>=7){agingClass="critical";agingLabel=faNum(ageDays)+" روز"}
    else if(ageDays>=3){agingClass="warning";agingLabel=faNum(ageDays)+" روز"}
    else if(ageDays>=1){agingClass="fresh";agingLabel=faNum(ageDays)+" روز"}
    return `<div class="reservation-row">
      <div style="flex:1"><b>${prod?prodName(prod):"—"}</b><div class="sub">${whName(r.warehouseId)} — ${faNum(r.quantity)} واحد</div></div>
      <div class="sub">${esc(r.customerId?(DB.customers||[]).find(c=>c.id===r.customerId)?.name||"—":"—")}</div>
      <div><span class="badge ${statusColors[r.status]||"gray"}">${esc(r.status)}</span></div>
      <div class="reservation-aging ${agingClass}">${agingLabel}</div>
      <div class="sub">${faDate(r.createdAt)}</div>
    </div>`;
  });
  return `<div class="card"><h3>رزروهای موجودی (${faNum(reservations.length)})</h3>
    ${rows.length?rows.join(""):'<div class="empty">رزروی ثبت نشده.</div>'}</div>`;
}
function renderTransfers(){
  const transfers=(DB.inventoryTransactions||[]).filter(t=>t.type==="TRANSFER_OUT"||t.type==="TRANSFER_IN").slice().reverse();
  const rows=transfers.map(t=>{
    const prod=getProd(t.productId);
    const isIn=t.type==="TRANSFER_IN";
    return `<div class="transfer-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><b>${prod?prodName(prod):"—"}</b><div class="sub">${whName(t.warehouseId)} — ${faNum(Math.abs(t.quantity))} واحد</div></div>
        <span class="transfer-status ${isIn?"completed":"pending"}">${isIn?"دریافت":"ارسال"}</span>
      </div>
      <div class="sub" style="margin-top:4px">${faDate(t.createdAt)} — ${esc(t.reason||"—")}</div>
    </div>`;
  });
  return `<div class="card"><h3>سابقه انتقالات (${faNum(transfers.length)})</h3>
    ${rows.length?rows.join(""):'<div class="empty">انتقالی ثبت نشده.</div>'}</div>`;
}
function renderReconciliation(){
  const products=(DB.products||[]).filter(p=>!p._deleted);
  const rows=products.map(p=>{
    const results=WH.map(w=>{
      const stock=p.stock?p.stock[w.id]||0:0;
      const ledger=(DB.inventoryTransactions||[]).filter(t=>t.productId===p.id&&t.warehouseId===w.id).reduce((s,t)=>s+t.quantity,0);
      const diff=stock-ledger;
      return {wh:w.id,stock,ledger,diff,match:diff===0};
    });
    return {product:p,results};
  }).filter(r=>r.results.some(x=>!x.match));
  return `<div class="card"><h3>تطبیق موجودی (${faNum(rows.length)} مغایرت)</h3>
    ${rows.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>کالا</th><th>انبار</th><th>موجودی</th><th>دفتر</th><th>اختلاف</th></tr></thead><tbody>
    ${rows.flatMap(r=>r.results.filter(x=>!x.match).map(x=>`<tr>
      <td>${prodName(r.product)}</td><td>${whName(x.wh)}</td>
      <td class="num">${faNum(x.stock)}</td><td class="num">${faNum(x.ledger)}</td>
      <td class="reconciliation-diff">${x.diff>0?"+":""}${faNum(x.diff)}</td>
    </tr>`)).join("")}
    </tbody></table></div>`:'<div class="empty">✓ همه موارد مطابقت دارند.</div>'}</div>`;
}

/* =============== Phase 5.7: Inventory Alerts =============== */
function pageInventoryAlerts(){
  if(!isManager())return '<div class="empty">فقط مدیر به این بخش دسترسی دارد.</div>';
  const alerts=[];
  (DB.products||[]).filter(p=>!p._deleted).forEach(p=>{
    WH.forEach(w=>{
      const stock=p.stock?p.stock[w.id]||0:0;
      const reserved=(DB.inventoryReservations||[]).filter(r=>r.productId===p.id&&r.warehouseId===w.id&&r.status==="ACTIVE").reduce((s,r)=>s+r.quantity,0);
      const available=stock-reserved;
      const minStock=p.minStock||5;
      if(available<minStock)alerts.push({type:"low-stock",product:p,warehouse:w,stock,reserved,available,minStock});
    });
  });
  (DB.inventoryReservations||[]).filter(r=>r.status==="ACTIVE").forEach(r=>{
    const ageMs=Date.now()-new Date(r.createdAt).getTime();
    const ageDays=Math.floor(ageMs/86400000);
    if(ageDays>=3)alerts.push({type:"aging",reservation:r,ageDays});
  });
  (DB.approvals||[]).filter(a=>a.status==="PENDING").forEach(a=>{
    alerts.push({type:"pending",approval:a});
  });
  return `
  <div class="pagehead"><div><div class="h1">${ic("bell",22)} هشدارهای انبار</div><div class="sub">${faNum(alerts.length)} هشدار فعال</div></div></div>
  ${alerts.length?alerts.map(a=>{
    if(a.type==="low-stock")return `<div class="alert-card"><div class="alert-icon low-stock">!</div><div class="alert-content"><div class="alert-title">موجودی کم: ${prodName(a.product)}</div><div class="alert-desc">${whName(a.warehouse.id)} — موجودی: ${faNum(a.stock)} — رزرو: ${faNum(a.reserved)} — در دسترس: ${faNum(a.available)} (حداقل: ${faNum(a.minStock)})</div></div></div>`;
    if(a.type==="aging")return `<div class="alert-card"><div class="alert-icon aging">⏰</div><div class="alert-content"><div class="alert-title">رزروی قدیمی: ${faNum(a.ageDays)} روز</div><div class="alert-desc">${getProd(a.reservation.productId)?prodName(getProd(a.reservation.productId)):"—"} — ${whName(a.reservation.warehouseId)} — ${faNum(a.reservation.quantity)} واحد</div></div></div>`;
    if(a.type==="pending")return `<div class="alert-card"><div class="alert-icon pending">⏳</div><div class="alert-content"><div class="alert-title">درخواست تأیید: ${esc(a.approval.type)}</div><div class="alert-desc">${esc(a.approval.reason||"—")} — ${esc(a.approval.requestedBy)}</div></div></div>`;
    return "";
  }).join(""):'<div class="card"><div class="empty">✓ هشداری وجود ندارد.</div></div>'}`;
}

/* =============== Phase 5.8: Customer Financial Control =============== */
function pageCustomerFinancial(){
  if(!isManager())return '<div class="empty">فقط مدیر به این بخش دسترسی دارد.</div>';
  const customers=(DB.customers||[]).filter(c=>!c._deleted);
  let totalReceivables=0,overdueReceivables=0,todaySales=0,todayPayments=0,nearLimit=0,overLimit=0;
  const today=todayISO().slice(0,10);
  customers.forEach(c=>{
    const balance=getBalance(c.id);
    totalReceivables+=balance;
    const limit=c.creditLimit||0;
    if(limit>0){
      const util=balance/limit;
      if(util>=1)overLimit++;
      else if(util>=0.8)nearLimit++;
    }
    (DB.invoices||[]).filter(inv=>inv.customerId===c.id&&inv.status!=="باطل‌شده"&&inv.date&&inv.date.slice(0,10)===today).forEach(inv=>{todaySales+=inv.total||0});
    (DB.payments||[]).filter(p=>p.customerId===c.id&&p.date&&p.date.slice(0,10)===today).forEach(p=>{todayPayments+=p.amount||0});
  });
  const riskCustomers=customers.filter(c=>{const b=getBalance(c.id);const l=c.creditLimit||0;return l>0&&b/l>=0.8}).map(c=>({customer:c,balance:getBalance(c.id),util:(c.creditLimit?getBalance(c.id)/c.creditLimit:0)})).sort((a,b)=>b.util-a.util);
  return `
  <div class="pagehead"><div><div class="h1">${ic("wallet",22)} کنترل مالی مشتریان</div></div></div>
  <div class="financial-summary">
    <div class="financial-stat"><div class="value">${fmt(totalReceivables)}</div><div class="label">کل مطالبات</div></div>
    <div class="financial-stat"><div class="value">${fmt(todaySales)}</div><div class="label">فروش امروز</div></div>
    <div class="financial-stat"><div class="value">${fmt(todayPayments)}</div><div class="label">وصولی امروز</div></div>
    <div class="financial-stat"><div class="value ${nearLimit>0?"risk-warning":""}">${faNum(nearLimit)}</div><div class="label">نزدیک سقف</div></div>
    <div class="financial-stat"><div class="value ${overLimit>0?"risk-danger":""}">${faNum(overLimit)}</div><div class="label">فراتر از سقف</div></div>
  </div>
  ${riskCustomers.length?`<div class="card"><h3>مشتریان پرخطر</h3>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>مشتری</th><th>مانده</th><th>سقف اعتبار</th><th>نرخ استفاده</th><th>وضعیت</th></tr></thead><tbody>
    ${riskCustomers.slice(0,20).map(r=>`<tr>
      <td>${esc(r.customer.name)}</td><td class="num">${fmt(r.balance)}</td><td class="num">${fmt(r.customer.creditLimit)}</td>
      <td class="num">${Math.round(r.util*100)}%</td>
      <td><span class="badge ${r.util>=1?"red":"yellow"}">${r.util>=1?"فراتر":"نزدیک"}</span></td>
    </tr>`).join("")}
    </tbody></table></div></div>`:""}
  <div class="card"><h3>راهنما</h3><div class="sub">🟢 عادی: کمتر از ۸۰٪ سقف — 🟡 نزدیک سقف: ۸۰-۹۹٪ — 🔴 فراتر: ۱۰۰٪ و بالاتر</div></div>`;
}

function confirmReset(scope){
  const labels={products:"کالاها",customers:"مشتریان",transactions:"تراکنش‌ها",inventory:"موجودی",all:"تمام دیتابیس"};
  const desc={products:"کالاها و موجودی سازگار",customers:"تعریف مشتریان",transactions:"فاکتورها، پرداخت‌ها، ورودی‌ها",inventory:"موجودی انبارها (از روی تراکنش‌ها بازسازی می‌شود)",all:"تمام اطلاعات"};
  openModal(`<h3>⚠ بازنشانی ${labels[scope]}</h3>
    <div class="confirm-step">
      <div class="sub">این عملیه حذف خواهد کرد:</div>
      <ul style="font-size:12px;margin:8px 0"><li>${esc(desc[scope])}</li></ul>
      <div class="sub">برای تأیید عبارت زیر را تایپ کنید:</div>
      <input id="confirm-reset" placeholder="بازنشانی ${labels[scope]}">
    </div>
    <div class="actions">
      <button class="btn" onclick="closeModal()">انصراف</button>
      <button class="danger-btn" onclick="executeReset('${scope}')">اجرا</button>
    </div>`);
}
function executeReset(scope){
  const input=document.querySelector("#confirm-reset");
  const expected="بازنشانی "+{products:"کالاها",customers:"مشتریان",transactions:"تراکنش‌ها",inventory:"موجودی",all:"تمام دیتابیس"}[scope];
  if(!input||input.value.trim()!==expected){toast("عبارت تأیید صحیح نیست.");return}
  dbAutoBackup("بازنشانی "+scope);
  if(scope==="products"||scope==="all"){DB.products=seed().products;auditLog("reset","بازنشانی کالاها")}
  if(scope==="customers"||scope==="all"){DB.customers=[];auditLog("reset","بازنشانی مشتریان")}
  if(scope==="transactions"||scope==="all"){DB.invoices=[];DB.payments=[];DB.entries=[];DB.adjustments=[];auditLog("reset","بازنشانی تراکنش‌ها")}
  if(scope==="inventory"||scope==="all"){DB.inventoryTransactions=[];DB.inventoryReservations=[];DB.products.forEach(p=>{p.stock={qom:0,jaf:0}});auditLog("reset","بازنشانی موجودی")}
  save();closeModal();render();toast("بازنشانی انجام شد.");
}

/* =============== Phase 5.11: Backup Management =============== */
function doBackup(){
  const key=Storage.backup("نسخه پشتیبان دستی");
  auditLog("backup","تهیه پشتیبان دستی");
  toast("پشتیبان تهیه شد.");
}
function exportFullBackup(){
  const data=JSON.stringify(DB,null,2);
  const blob=new Blob([data],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="backup-"+todayJ().replace(/\//g,"-")+".json";
  document.body.appendChild(a);a.click();a.remove();
  auditLog("backup","دانلود پشتیبان");
  toast("فایل پشتیبان دانلود شد.");
}
function openRestoreModal(){
  const backups=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith("cs_engine_backup_")){
      try{const d=JSON.parse(localStorage.getItem(k));backups.push({key:k,label:d.label,time:d.time})}catch(e){}
    }
  }
  backups.sort((a,b)=>new Date(b.time)-new Date(a.time));
  openModal(`<h3>بازیابی از پشتیبان</h3>
    <div class="sub">${backups.length} پشتیبان موجود</div>
    ${backups.length?backups.slice(0,10).map(b=>`<div class="reservation-row">
      <div><b>${esc(b.label||"—")}</b><div class="sub">${faDateTime(b.time)}</div></div>
      <button class="btn sm" onclick="restoreBackup('${b.key}')">بازیابی</button>
    </div>`).join(""):'<div class="empty">پشتیبانی موجود نیست.</div>'}
    <div class="actions"><button class="btn" onclick="closeModal()">بستن</button></div>`);
}
function restoreBackup(key){
  if(!confirm("آیا از بازیابی این پشتیبان مطمئنید؟ ج فعلی بازنویسی خواهد شد."))return;
  const snap=Storage.snapshot();
  const db=Storage.restore(key);
  if(!db){toast("پشتیبان یافت نشد.");return}
  Object.assign(DB,db);save();
  auditLog("restore","بازیابی پشتیبان");
  closeModal();render();toast("پشتیبان بازیابی شد.");
}

/* =============== Phase 5.12: Data Health =============== */
function pageDataHealth(){
  if(!isManager())return '<div class="empty">فقط مدیر به این بخش دسترسی دارد.</div>';
  const checks=[];
  (DB.products||[]).filter(p=>!p._deleted).forEach(p=>{
    WH.forEach(w=>{
      const stock=p.stock?p.stock[w.id]||0:0;
      const ledger=(DB.inventoryTransactions||[]).filter(t=>t.productId===p.id&&t.warehouseId===w.id).reduce((s,t)=>s+t.quantity,0);
      if(stock!==ledger)checks.push({status:"fail",label:`موجودی مغایر: ${prodName(p)} — ${whName(w.id)} (موجودی: ${stock}, دفتر: ${ledger})`});
    });
  });
  (DB.inventoryReservations||[]).forEach(r=>{
    if(!getProd(r.productId))checks.push({status:"fail",label:`رزروی با کالای ناموجود: ${r.productId}`});
    if(!WH.find(w=>w.id===r.warehouseId))checks.push({status:"fail",label:`رزروی با انبار ناموجود: ${r.warehouseId}`});
    if(r.quantity<=0)checks.push({status:"warn",label:`رزروی با تعداد نامعتبر: ${r.quantity}`});
  });
  (DB.invoices||[]).forEach(inv=>{
    if(!inv.customerId)checks.push({status:"warn",label:`فاکتور بدون مشتری: ${inv.id}`});
    if(inv.items)inv.items.forEach(item=>{
      if(item.productId&&!getProd(item.productId))checks.push({status:"fail",label:`آیتم فاکتور با کالای ناموجود: ${inv.id}`});
    });
  });
  (DB.customers||[]).forEach(c=>{
    if(!c.name)checks.push({status:"warn",label:`مشتری بدون نام: ${c.id}`});
  });
  const ids=new Set();const dupes=[];
  (DB.products||[]).forEach(p=>{if(ids.has(p.id))dupes.push(p.id);ids.add(p.id)});
  (DB.invoices||[]).forEach(i=>{if(ids.has(i.id))dupes.push(i.id);ids.add(i.id)});
  (DB.customers||[]).forEach(c=>{if(ids.has(c.id))dupes.push(c.id);ids.add(c.id)});
  if(dupes.length)checks.push({status:"fail",label:`شناسه‌های تکراری: ${dupes.length} مورد`});
  const passCount=checks.filter(c=>c.status==="pass").length;
  const warnCount=checks.filter(c=>c.status==="warn").length;
  const failCount=checks.filter(c=>c.status==="fail").length;
  return `
  <div class="pagehead"><div><div class="h1">${ic("check-circle",22)} سلامت داده‌ها</div><div class="sub">${faNum(failCount)} خطا — ${faNum(warnCount)} هشدار</div></div></div>
  <div class="card">
    ${checks.length?checks.map(c=>`<div class="health-check"><div class="health-icon ${c.status}">${c.status==="pass"?"✓":c.status==="warn"?"!":"✕"}</div><div class="health-label">${esc(c.label)}</div></div>`).join(""):'<div class="health-check"><div class="health-icon pass">✓</div><div class="health-label">همه موارد سالم هستند.</div></div>'}
  </div>`;
}

let _reportTab="sales";
function pageReports(){
  if(!PermissionService.hasPermission('reports.view'))return '<div class="empty">دسترسی ندارید.</div>';
  const tabs=[{id:"sales",label:"فروش"},{id:"inventory",label:"انبار"},{id:"receivables",label:"مطالبات"},{id:"payments",label:"پرداخت‌ها"}];
  return `

  ${_reportTab==="sales"?renderSalesReport():
    _reportTab==="inventory"?renderInventoryReport():
    _reportTab==="receivables"?renderReceivablesReport():
    renderPaymentsReport()}`;
}
function renderSalesReport(){
  const invoices=(DB.invoices||[]).filter(i=>i.status!=="باطل‌شده");
  const byDay={},bySeller={},byBrand={},byColor={},byCustomer={};
  let totalGross=0,totalDiscount=0,totalSheets=0,totalM2=0;
  invoices.forEach(inv=>{
    const day=inv.date?inv.date.slice(0,10):"نامشخص";
    byDay[day]=(byDay[day]||{count:0,total:0});byDay[day].count++;byDay[day].total+=inv.total||0;
    const seller=inv.seller||inv.createdBy||"نامشخص";
    bySeller[seller]=(bySeller[seller]||{count:0,total:0});bySeller[seller].count++;bySeller[seller].total+=inv.total||0;
    if(inv.customerId){byCustomer[inv.customerId]=(byCustomer[inv.customerId]||{count:0,total:0});byCustomer[inv.customerId].count++;byCustomer[inv.customerId].total+=inv.total||0}
    totalGross+=inv.subtotal||inv.total||0;totalDiscount+=inv.discount||0;
    (inv.items||[]).forEach(item=>{
      totalSheets+=item.qty||0;totalM2+=item.area||0;
      const prod=getProd(item.productId);
      if(prod){byBrand[prod.brand]=(byBrand[prod.brand]||{sheets:0,m2:0});byBrand[prod.brand].sheets+=item.qty||0;byBrand[prod.brand].m2+=item.area||0;
      byColor[prod.color]=(byColor[prod.color]||{sheets:0,m2:0});byColor[prod.color].sheets+=item.qty||0;byColor[prod.color].m2+=item.area||0}
    });
  });
  return `<div class="report-summary">

/* =============== Phase 5.15-5.18: Security, Auth, Session, Performance =============== */
const AuthService={
  _xorKey:0x5A,// Simple XOR obfuscation key (NOT true encryption)
  _getDefaultPins(){return{manager:"8036",seller:"1414"}},
  _getStoredPins(){
    try{
      const stored=localStorage.getItem("cs_auth_pins");
      if(stored){
        const decoded=atob(stored);
        const bytes=new Uint8Array(decoded.length);
        for(let i=0;i<decoded.length;i++)bytes[i]=decoded.charCodeAt(i)^this._xorKey;
        return JSON.parse(new TextDecoder().decode(bytes));
      }
    }catch(e){}
    return this._getDefaultPins();
  },
  _storePins(pins){
    try{
      const json=JSON.stringify(pins);
      const bytes=new TextEncoder().encode(json);
      const encoded=Array.from(bytes).map(b=>b^this._xorKey);
      localStorage.setItem("cs_auth_pins",btoa(String.fromCharCode(...encoded)));
    }catch(e){}
  },
  getPins(){return this._getStoredPins()},
  setPins(manager,seller){
    if(manager&&seller){
      this._storePins({manager,seller});
      auditLog("pins_change","تغییر شماره‌های PIN");
    }
  },
  validate(role,pin){
    const cleaned=latinDigits(String(pin||"").trim());
    const pins=this._getStoredPins();
    if(role==="manager")return cleaned===pins.manager;
    if(role==="seller")return cleaned===pins.seller;
    return false;
  },
  login(role,name){
    if(!name)name=role==="manager"?"مدیر مجموعه":"مهندس عقیلی";
    session={role,name,loginAt:Date.now()};
    auditLog("login","ورود به سیستم");
    return true;
  },
  logout(){
    auditLog("logout","خروج از سیستم");
    session=null;
  },
  isAuthenticated(){return!!session},
  getSessionAge(){return session&&session.loginAt?Math.floor((Date.now()-session.loginAt)/60000):0}
};
const SessionService={
  TIMEOUT_MS:8*60*60*1000,
  isExpired(){return session&&session.loginAt&&(Date.now()-session.loginAt>this.TIMEOUT_MS)},
  refresh(){if(session)session.loginAt=Date.now()},
  clearSensitive(){if(route.page==="newInvoice")try{localStorage.removeItem("composite_draft_newInvoice")}catch(e){}},
  onLogout(){this.clearSensitive();route={page:"home"}}
};

// Get availability status for a product (customer-safe)
function getAvailStatus(product,warehouse){
  const stock=warehouse?((product.stock||{})[warehouse]||0):totStock(product);
  if(stock===0)return{status:"none",label:"ناموجود",color:"red",emoji:"⚪"};
  if(stock<=AVAIL_THRESHOLDS.low)return{status:"low",label:"موجودی محدود",color:"orange",emoji:"🟡"};
  if(stock<=AVAIL_THRESHOLDS.medium)return{status:"medium",label:"موجود",color:"green",emoji:"🟢"};
  return{status:"high",label:"موجود",color:"green",emoji:"🟢"};
}

function pageCustomerCatalog(){

  const brandMap={};
  allProducts.forEach(p=>{
    const stock=totStock(p);
    if(!brandMap[p.brand])brandMap[p.brand]={colors:{}};
    const bm=brandMap[p.brand];
    if(!bm.colors[p.color])bm.colors[p.color]={products:[]};
    bm.colors[p.color].products.push({...p,totalStock:stock});
  });
  
  // Apply filters
  let brands=Object.entries(brandMap);
  if(cat6BrandFilter)brands=brands.filter(([b])=>b===cat6BrandFilter);
  if(cat6ColorFilter)brands=brands.map(([b,c])=>[b,{colors:Object.entries(c.colors).filter(([c2])=>c2===cat6ColorFilter).reduce((a,[k,v])=>{a[k]=v;return a},{})}]).filter(([,v])=>Object.keys(v.colors).length>0);
  
  // Search filtering
  if(q){
    brands=brands.filter(([bname,bv])=>{
      if(bname.toLowerCase().includes(q))return true;
      return Object.entries(bv.colors).some(([cname,cv])=>{
        if(cname.toLowerCase().includes(q))return true;
        return cv.products.some(p=>String(p.length).includes(q)||String(p.width).includes(q));
      });
    });
  }

  draft=newDraft("invoice");

// Phase 6.5: Enhanced Seller Search with Ranking
const SellerSearch={
  _index:null,
  
  rebuildIndex(){
    this._index=(DB.products||[]).filter(p=>!p._deleted).map(p=>{
      const stock=totStock(p);
      const avail=getAvailStatus(p);
      return{
        id:p.id,
        brand:p.brand||"",
        color:p.color||"",
        width:p.width||0,
        length:p.length||0,
        thickness:p.thickness||"",
        totalStock:stock,
        salePrice:p.salePrice||0,
        minPrice:p.minPrice||0,
        costPrice:p.costPrice||0,
        availStatus:avail.status,
        searchText:`${p.brand} ${p.color} ${p.width} ${p.length} ${p.thickness} ${p.brand}/${p.color}/${p.width}×${p.length}`.toLowerCase()
      };
    });
  },
  
  search(query,options={}){
    if(!query||query.trim().length===0)return[];
    const q=query.trim().toLowerCase();
    const qParts=q.split(/[\s\/]+/).filter(Boolean);
    const{limit=20,inStockOnly=false}=options;
    
    if(!this._index)this.rebuildIndex();
    
    let results=this._index.map(p=>{
      let score=0;
      const brandLower=p.brand.toLowerCase();
      const colorLower=p.color.toLowerCase();
      const dimStr=`${p.width}×${p.length}`;
      
      // Exact brand match
      if(brandLower===q)score+=100;
      else if(brandLower.startsWith(q))score+=80;
      else if(brandLower.includes(q))score+=60;
      
      // Exact color match
      if(colorLower===q)score+=90;
      else if(colorLower.startsWith(q))score+=70;
      else if(colorLower.includes(q))score+=50;
      
      // Dimension match
      if(dimStr===q)score+=95;
      else if(dimStr.includes(q))score+=55;
      
      // Length match (important for composite sheets)
      if(String(p.length)===q)score+=85;
      else if(String(p.length).startsWith(q))score+=65;
      
      // Multi-part matching
      qParts.forEach(part=>{
        if(brandLower.includes(part))score+=40;
        if(colorLower.includes(part))score+=35;
        if(String(p.width).includes(part))score+=30;
        if(String(p.length).includes(part))score+=30;
        if(p.thickness.toLowerCase().includes(part))score+=25;
        if(p.searchText.includes(part))score+=20;
      });
      
      // Full text match
      if(p.searchText.includes(q))score+=15;
      
      return{...p,score};
    }).filter(p=>p.score>0);
    
    results.sort((a,b)=>b.score-a.score);
    
    if(inStockOnly)results=results.filter(p=>p.totalStock>0);
    
    returnresults.slice(0,limit);
  }
};

function cat6ConvertToProforma(inquiryId){
  const inq=(DB.inquiries||[]).find(i=>i.id===inquiryId);
  if(!inq){toast("درخواست یافت نشد.");return}
  
  // Find matching product
  const p=(DB.products||[]).find(x=>x.brand===inq.brand&&x.color===inq.color&&x.length===inq.length&&!x._deleted);
  if(!p){toast("کالا یافت نشد.");return}
  
  // Create proforma
  draft=newDraft("proforma");
  draft.items=[{
    productId:p.id,
    name:prodName(p),
    qty:inq.quantity,
    price:p.salePrice||0,
    wh:"qom",
    width:p.width,
    length:p.length,
    unit:"sheet",
    unitPrice:p.salePrice||0
  }];
  
  InquiryEngine.quote(inquiryId);
  InquiryEngine.convert(inquiryId,null);
  go("newInvoice");
  toast("پیش‌فاکتور ایجاد شد.");
}

const APP_VERSION="۷.۲";
const SYNC={url:localStorage.getItem("cs_sync_url")||"",auth:localStorage.getItem("cs_sync_auth")||"",status:"off",err:"",last:Number(localStorage.getItem("cs_sync_at")||0),pushT:null,pulling:false,conflicts:[]};

// Version tracking for conflict detection
function getDBVersion(){return DB._version||0}
function bumpDBVersion(){DB._version=(DB._version||0)+1;DB._lastUpdated=Date.now();DB._updatedBy=session?session.name:"unknown"}
function syncEndpoint(u,a){let x=(u!==undefined?u:SYNC.url).trim().replace(/\/+$/,"");if(!/^https?:\/\//.test(x))x="https://"+x;const t=(a!==undefined?a:SYNC.auth).trim();return x+"/appdb.json"+(t?"?auth="+encodeURIComponent(t):"")}
function syncStamp(){return Number(localStorage.getItem("cs_sync_at")||0)}
function syncSetStamp(t){localStorage.setItem("cs_sync_at",String(t));SYNC.last=t}
function syncBadgeHTML(){
  if(!SYNC.url)return `<button id="sync-badge" class="syncb off" onclick="openSync()">${ic("share",13)} همگام‌سازی آنلاین: غیرفعال — راه‌اندازی</button>`;
  const tme=SYNC.last?new Date(SYNC.last).toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"}):"";
  const conflictBadge=SYNC.conflicts.length?` <span style="color:var(--md-error)">⚠ ${SYNC.conflicts.length} تداخل</span>`:"";
  return SYNC.status==="err"?`<button id="sync-badge" class="syncb err" onclick="openSync()">⚠ ${SYNC.err||"خطا در همگام‌سازی"}</button>`:`<button id="sync-badge" class="syncb ok" onclick="openSync()">● آنلاین${tme?" — آخرین همگام‌سازی "+tme:""}${conflictBadge}</button>`;
}
function syncBadge(){const el=document.querySelector("#sync-badge");if(el)el.outerHTML=syncBadgeHTML()}

// Safe merge: append-only for inventory transactions
function syncMerge(incoming){
  if(!incoming||!incoming.db)return false;
  const localVersion=getDBVersion();
  const incomingVersion=incoming.db._version||0;
  
  // If incoming is older or same, no merge needed
  if(incomingVersion<=localVersion)return false;
  
  // Detect conflicts: both modified since last sync
  const localLastSync=syncStamp();
  const incomingLastUpdate=incoming.db._lastUpdated||0;
  const localLastUpdate=DB._lastUpdated||0;
  
  // Conflict: both devices made changes since last sync
  if(localLastUpdate>localLastSync&&incomingLastUpdate>localLastSync){
    // Log conflict
    SYNC.conflicts.push({
      timestamp:Date.now(),
      localVersion,
      incomingVersion,
      localUpdatedBy:DB._updatedBy||"unknown",
      incomingUpdatedBy:incoming.db._updatedBy||"unknown"
    });
    auditLog("sync_conflict",`تداخل همگام‌سازی: نسخه محلی ${localVersion} vs نسخه ورودی ${incomingVersion}`);
    
    // For inventory transactions, use append-only merge
    if(incoming.db.entries&&DB.entries){
      const localIds=new Set(DB.entries.map(e=>e.id));
      const newEntries=incoming.db.entries.filter(e=>!localIds.has(e.id));
      if(newEntries.length>0){
        DB.entries=DB.entries.concat(newEntries);
        auditLog("sync_merge",`${newEntries.length} تراکنش جدید ادغام شد`);
      }
    }
    
    // For other data, prefer the higher version
    // But preserve local inventory counts (never overwrite stock directly)
    const incomingDB=incoming.db;
    if(incomingDB.products){
      incomingDB.products.forEach(ip=>{
        const lp=DB.products.find(p=>p.id===ip.id);
        if(lp){
          // Never overwrite stock from sync - only InventoryEngine modifies stock
          const savedStock={...lp.stock};
          Object.assign(lp,ip);
          lp.stock=savedStock;// Preserve local stock
        }else{
          DB.products.push(ip);
        }
      });
    }
    
    // Merge other arrays (append-only)
    ["customers","invoices","payments","auditLog","approvals","inquiries","customerPrices"].forEach(key=>{
      if(incomingDB[key]&&DB[key]){
        const localIds=new Set(DB[key].map(i=>i.id));
        const newItems=incomingDB[key].filter(i=>!localIds.has(i.id));
        if(newItems.length>0)DB[key]=DB[key].concat(newItems);
      }
    });
    
    return true;
  }
  
  // No conflict: incoming is strictly newer, safe to replace
  Object.keys(incomingDB).forEach(key=>{
    if(key!=="stock")DB[key]=incomingDB[key];// Never overwrite stock directly
  });
  return true;
}

async function syncPush(){
  if(!SYNC.url)return;
  const t=Date.now();
  bumpDBVersion();
  try{
    const r=await fetch(syncEndpoint(),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({updatedAt:t,version:getDBVersion(),db:DB})});
    if(!r.ok)throw new Error("st"+r.status);
    SYNC.status="ok";SYNC.err="";syncSetStamp(t);syncBadge();
  }catch(e){SYNC.status="err";SYNC.err="ارسال به سرور ممکن نشد";syncBadge()}
}
function syncQueuePush(){if(!SYNC.url)return;clearTimeout(SYNC.pushT);SYNC.pushT=setTimeout(syncPush,1200)}
async function syncPull(){
  if(!SYNC.url||SYNC.pulling)return;SYNC.pulling=true;
  try{
    const r=await fetch(syncEndpoint());
    if(!r.ok)throw new Error("st"+r.status);
    const data=await r.json();
    SYNC.status="ok";SYNC.err="";
    if(data&&data.db&&Number(data.updatedAt||0)>syncStamp()){
      const merged=syncMerge(data);
      if(merged){
        DB.pendingMin=DB.pendingMin||[];DB.entries=DB.entries||[];DB.adjustments=DB.adjustments||[];DB.payments=DB.payments||[];DB.truckHistory=DB.truckHistory||[];DB.stocktaking=DB.stocktaking||[];DB.auditLog=DB.auditLog||[];DB.roles=DB.roles||[];DB.brandMemory=DB.brandMemory||{};
        try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}
        syncSetStamp(Number(data.updatedAt));
      }
      const busy=document.querySelector("#modal-root").innerHTML.trim()||route.page==="newInvoice";
      if(session&&!busy)render();else syncBadge();
    }else syncBadge();
  }catch(e){SYNC.status="err";SYNC.err="اتصال به سرور برقرار نشد";syncBadge()}
  SYNC.pulling=false;
}
function openSync(){
  openModal(`<h3>همگام‌سازی آنلاین بین دستگاه‌ها</h3>
  <div class="sub">فاکتورها، انبار، مشتریان و گزارش‌ها بین گوشی مدیر و فروشنده آنلاین و خودکار همگام می‌شود. این تنظیم را فقط یک‌بار در هر دستگاه وارد کنید.</div>
  <div class="field"><label>آدرس سرور</label><input id="sy-url" dir="ltr" placeholder="https://company-site.com/app" value="${esc(SYNC.url)}"></div>
  <div class="field"><label>رمز اتصال (auth)</label><input id="sy-auth" dir="ltr" value="${esc(SYNC.auth)}"></div>
  <div class="notice">اگر سرور روی هاست سایت شرکت است: آدرس پوشه اپ (مثلاً <b dir="ltr">https://your-site.com/app</b>) و رمز اتصالی که در فایل sync.php گذاشته شده را وارد کنید. اگر از Firebase استفاده می‌کنید، آدرس Realtime Database را بدهید.</div>
  <div class="sub" style="margin-top:8px">نسخه اپ: ${APP_VERSION}</div>
  <div class="actions">
    ${SYNC.url?`<button class="btn" onclick="syncDisconnect()">قطع اتصال</button>`:""}
    <button class="btn" onclick="closeModal()">بستن</button>
    <button class="btn primary" onclick="withBusy(this,syncConnect)" data-err="اتصال برقرار نشد؛ آدرس و اینترنت را بررسی کنید.">اتصال و همگام‌سازی</button>
  </div>`);
}
async function syncConnect(){
  const u=(document.querySelector("#sy-url").value||"").trim();
  const a=(document.querySelector("#sy-auth").value||"").trim();
  if(!u){toast("آدرس دیتابیس را وارد کنید.");return}
  const r=await fetch(syncEndpoint(u,a));
  if(!r.ok)throw new Error("bad");
  const data=await r.json();
  SYNC.url=u;SYNC.auth=a;localStorage.setItem("cs_sync_url",u);localStorage.setItem("cs_sync_auth",a);
  if(data&&data.db&&Number(data.updatedAt||0)>syncStamp()){DB=data.db;DB.pendingMin=DB.pendingMin||[];try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}syncSetStamp(Number(data.updatedAt))}
  else await syncPush();
  SYNC.status="ok";SYNC.err="";
  closeModal();render();toast("همگام‌سازی آنلاین فعال شد.");
}
function syncDisconnect(){SYNC.url="";SYNC.auth="";SYNC.status="off";localStorage.removeItem("cs_sync_url");localStorage.removeItem("cs_sync_auth");closeModal();render();toast("همگام‌سازی غیرفعال شد.")}

/* =============== PWA: Service Worker + Install =============== */
let deferredPrompt=null;
function doInstall(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(r=>{if(r.outcome==="accepted")toast("اپلیکیشن با موفقیت نصب شد.");deferredPrompt=null})}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById('install-btn');if(b)b.style.display='block'});
window.addEventListener('appinstalled',()=>{deferredPrompt=null;const b=document.getElementById('install-btn');if(b)b.style.display='none';toast("اپلیکیشن نصب شد.")});
</script>
