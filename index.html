function startInvoice(type,custId){
  const saved=(()=>{try{return JSON.parse(localStorage.getItem(DRAFT_KEY))}catch(e){return null}})();
  draft=(saved&&saved.type===type&&saved.items&&saved.items.length&&!custId)?saved:newDraft(type);
  if(custId)draft.customerId=custId;
  go("newInvoice");
}

/* =============== Bulk Import from Invoice Text =============== */
function toLatDigits(s){return String(s).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d))}
function parseInvoiceLine(line){
  var s=toLatDigits(line).replace(/[\u200C\u200D\u200E\u200F\uFEFF]/g,'');
  var m=s.match(/^(.+?)\s*\/\s*(\d+)\s*میل\s*\/\s*(.+?)\s*\/\s*(\d+)\s*[x×]\s*(\d+)/i);
  if(!m)return null;
  return{brand:m[1].trim(),th:m[2]+' میل',color:m[3].trim(),w:parseInt(m[4])||125,l:parseInt(m[5])||0};
}
function parseQtyLine(line){
  var s=toLatDigits(line).replace(/[\u200C\u200D\u200E\u200F\uFEFF]/g,'');
  var m=s.match(/(\d+)\s*ورق/);
  return m?parseInt(m[1]):0;
}
function bulkImportItems(text){
  if(!draft)draft=newDraft("invoice");
  var allLines=text.split("\n");
  var items=[];
  var cur=null,curQty=0;
  for(var i=0;i<allLines.length;i++){
    var hdr=parseInvoiceLine(allLines[i]);
    if(hdr){
      if(cur&&cur.l&&curQty>0)items.push({brand:cur.brand,th:cur.th,color:cur.color,w:cur.w,l:cur.l,qty:curQty});
      cur=hdr;curQty=0;
    }
    var q=parseQtyLine(allLines[i]);
    if(q>0)curQty=q;
  }
  if(cur&&cur.l&&curQty>0)items.push({brand:cur.brand,th:cur.th,color:cur.color,w:cur.w,l:cur.l,qty:curQty});
  var added=0,blocked=0,created=0;
  for(var j=0;j<items.length;j++){
    var it=items[j];var w=it.w||125,l=it.l;
    if(!l){blocked++;continue}
    var p=DB.products.find(function(x){return x.brand===it.brand&&x.thickness===it.th&&x.color===it.color&&x.width===w&&x.length===l});
    if(!p){p={id:uid(),brand:it.brand,thickness:it.th,color:it.color,width:w,length:l,stock:{qom:0,jaf:0},minStock:0,costPrice:0,salePrice:0,minPrice:0,shelf:""};DB.products.push(p);DB.pendingMin=DB.pendingMin||[];DB.pendingMin.push(p.id);created++}
    var area=w*l/10000;
    var pricePerSheet;
    var lpRes=calculateLengthBasedPrice(p,draft);
    if(lpRes){pricePerSheet=lpRes.sheetPrice;}
    else{pricePerSheet=Math.round(880000*area);}
    var result=SalesCart.addItem(p.id,{quantity:it.qty,price:pricePerSheet,warehouse:"jaf",unit:"sheet"});
    if(result.success)added++;else blocked++;
  }
  if(created)save();
  saveDraft();render();
  toast(faNum(added)+" \u0631\u062F\u06CC\u0641 \u0627\u0636\u0627\u0641\u0647 \u0634\u062F"+(created?" \u2014 "+faNum(created)+" \u06A9\u0627\u0644\u0627\u06CC \u062C\u062F\u06CC\u062F":"")+(blocked?" \u2014 "+faNum(blocked)+" \u0631\u062F\u06CC\u0641 \u0631\u062F \u0634\u062D":""));
}
function qmAdd(){
  if(qmAdd._busy)return; // guard against double Enter/double-click firing this twice
  if(!draft.qm)draft.qm={brand:"",th:"۴ میل",color:"",w:"125",pm:"",wh:"qom",mode:"m2"};
  const g=id=>{const e=document.querySelector(id);return e?e.value:""};
  const brand=(g("#qm-brand")||"").trim();
  const th=(g("#qm-th")||"").trim()||"۴ میل";
  const color=(g("#qm-color")||"").trim()||"معمولی";
  const w=parseInt(latinDigits(g("#qm-w")))||125;
  const pm=deNum(g("#qm-pm"));
  const wh=g("#qm-wh")||draft.qm.wh||"qom";
  Object.assign(draft.qm,{brand,th,color:g("#qm-color"),w:String(w),pm:g("#qm-pm"),wh});
  if(!brand){toast("نام برند را بنویسید.");return}
  const lenPricingOn=!!(draft.lengthPricing&&draft.lengthPricing.enabled);
  if(lenPricingOn){
    if(!(Number(draft.lengthPricing.shortM2Price)>0)||!(Number(draft.lengthPricing.longM2Price)>0)){
      toast("قیمت «تا حد» و «بالای حد» را در بخش قیمت‌گذاری بر اساس طول وارد کنید.");return;
    }
  } else if(pm<=0){
    toast(draft.qm.mode==="sheet"?"قیمت هر ورق را وارد کنید.":"قیمت هر مترمربع را وارد کنید.");return;
  }
  const lensEl=document.querySelector("#qm-lens");
  const lens=latinDigits(lensEl?lensEl.value:"").split(/[^0-9.]+/).map(Number).filter(x=>x>0);
  if(!lens.length){toast("حداقل یک طول وارد کنید.");return}
  qmAdd._busy=true;
  if(lensEl)lensEl.value=""; // clear immediately so a repeated Enter/click can't resubmit the same lengths
  try{
    const fresh=[];let blocked=0;const mode=(draft.qm.mode==="sheet")?"sheet":"m2";
    lens.forEach(L=>{
      let p=DB.products.find(x=>x.brand===brand&&x.thickness===th&&x.color===color&&x.width===w&&x.length===L);
      if(!p){p={id:uid(),brand,thickness:th,color,width:w,length:L,stock:{qom:0,jaf:0},minStock:0,costPrice:0,salePrice:0,minPrice:0,shelf:""};DB.products.push(p);DB.pendingMin=DB.pendingMin||[];DB.pendingMin.push(p.id);fresh.push(p)}
      // Use length-based pricing if enabled — price is always the TOTAL per-sheet price,
      // matching what the non-automatic branch computes, so the min-price check and
      // SalesCart.addItem (which expects a sheet total regardless of unit mode) stay consistent.
      let price;
      const lpResult=calculateLengthBasedPrice(p,draft);
      if(lpResult){
        price=lpResult.sheetPrice;
      } else {
        price=mode==="sheet"?Math.round(pm):Math.round(w*L*pm/10000);
      }
      if(!isManager()&&p.minPrice&&price<p.minPrice){blocked++;return}
      if(fresh.includes(p))InventoryEngine.receive({ productId: p.id, warehouseId: wh, quantity: 1, referenceType: 'quick_entry', referenceId: '', reason: 'ورود سریع' });
      const itemOpts={quantity:1,price:price,warehouse:wh,unit:mode};
      if(lpResult){itemOpts.lengthPricingCategory=lpResult.category;itemOpts.lengthPricingM2Price=lpResult.m2Price;}
      const result=SalesCart.addItem(p.id,itemOpts);
      if(!result.success){blocked++;return}
    });
    if(fresh.length)save();
    saveDraft();render();
    setTimeout(()=>{const e=document.querySelector("#qm-lens");if(e){e.focus()}},30);
    let msg=faNum(lens.length-blocked)+" ردیف اضافه شد";
    if(fresh.length)msg+=" — "+faNum(fresh.length)+" کالای جدید تعریف شد";
    if(blocked)msg+=" — "+faNum(blocked)+" ردیف به دلیل قیمت کمتر از حداقل مجاز اضافه نشد";
    toast(msg);
  }finally{
    qmAdd._busy=false;
  }
}

/* =============== PROFORMA SUPPLY MANAGEMENT =============== */

// Get supply records for a proforma
function getProformaSupplies(proformaId) {
  return DB.proformaSupplies.filter(s => s.proformaId === proformaId);
}

// Get total supplied quantity for a product in a proforma
function getSuppliedQty(proformaId, productId) {
  // Direct match
  const direct = DB.proformaSupplies
    .filter(s => s.proformaId === proformaId && s.productId === productId && !s.cancelled)
    .reduce((sum, s) => sum + s.quantity, 0);
  if (direct > 0) return direct;
  // Fallback: if productId is stale, find the proforma item and match supply records
  // by individual product properties instead of full name string
  const proforma = DB.invoices.find(v => v.id === proformaId);
  if (!proforma) return direct;
  const item = proforma.items.find(i => i.productId === productId);
  if (!item || !item.name) return direct;
  const itemProduct = getProdById(item.productId);
  if (!itemProduct) return direct;
  return DB.proformaSupplies
    .filter(s => {
      if (s.proformaId !== proformaId || s.cancelled) return false;
      const sp = getProdById(s.productId);
      if (sp) {
        return sp.brand === itemProduct.brand && sp.thickness === itemProduct.thickness &&
               sp.color === itemProduct.color && sp.width === itemProduct.width && sp.length === itemProduct.length;
      }
      return false;
    })
    .reduce((sum, s) => sum + s.quantity, 0);
}

// Calculate supply status for a proforma
function getSupplyStatus(proforma) {
  if (!proforma || !proforma.items || proforma.items.length === 0) return 'بدون تأمین';
  let totalOrdered = 0, totalSupplied = 0;
  for (const item of proforma.items) {
    totalOrdered += item.qty;
    totalSupplied += getSuppliedQty(proforma.id, item.productId);
  }
  if (totalSupplied === 0) return 'بدون تأمین';
  if (totalSupplied >= totalOrdered) return 'تأمین کامل';
  return 'تأمین ناقص';
}

// Get supply status badge class
function supplyStatusBadge(status) {
  if (status === 'تأمین کامل') return 'green';
  if (status === 'تأمین ناقص') return 'orange';
  return 'red';
}

// Get supply progress for a specific product
function getProductSupplyProgress(proformaId, productId, orderedQty) {
  const supplied = getSuppliedQty(proformaId, productId);
  const remaining = Math.max(0, orderedQty - supplied);
  const ratio = orderedQty > 0 ? supplied / orderedQty : 0;
  return { supplied, remaining, ratio, complete: supplied >= orderedQty };
}

// Check if all products are fully supplied
function isFullySupplied(proforma) {
  if (!proforma || !proforma.items) return false;
  return proforma.items.every(item => {
    const supplied = getSuppliedQty(proforma.id, item.productId);
    return supplied >= item.qty;
  });
}

// Get supply status label with progress
function getSupplyStatusLabel(proforma) {
  if (!proforma || !proforma.items || proforma.items.length === 0) return '';
  let totalOrdered = 0, totalSupplied = 0;
  for (const item of proforma.items) {
    totalOrdered += item.qty;
    totalSupplied += getSuppliedQty(proforma.id, item.productId);
  }
  return totalSupplied + ' / ' + totalOrdered + ' تأمین شده' + (totalOrdered - totalSupplied > 0 ? ' — باقی‌مانده: ' + (totalOrdered - totalSupplied) : '');
}

// Check duplicate proforma before creation
function checkDuplicateProforma(customerId, items) {
  if (!customerId || !items || items.length === 0) return null;
  const activeProformas = DB.invoices.filter(v =>
    v.type === 'proforma' &&
    v.status === 'پیش‌فاکتور' &&
    v.customerId === customerId &&
    !v.convertedToInvoiceId
  );
  for (const p of activeProformas) {
    if (!p.items || p.items.length === 0) continue;
    // Check if same products and quantities exist
    const pProductIds = p.items.map(i => i.productId).sort();
    const nProductIds = items.map(i => i.productId).sort();
    if (pProductIds.length === nProductIds.length && pProductIds.every((id, i) => id === nProductIds[i])) {
      // Check quantities match
      const allMatch = p.items.every(pi => {
        const ni = items.find(i => i.productId === pi.productId);
        return ni && ni.qty === pi.qty;
      });
      if (allMatch) return p;
    }
  }
  return null;
}

// Process supply operation with double-click protection
let _supplyProcessing = false;
function processSupply(proformaId) {
  if (_supplyProcessing) { toast('عملیات در حال انجام است.'); return; }
  _supplyProcessing = true;

  try {
    const v = DB.invoices.find(x => x.id === proformaId);
    if (!v || v.status !== 'پیش‌فاکتور') { toast('خطا: پیش‌فاکتور یافت نشد.'); return; }

    const wh = document.querySelector('#supply-wh')?.value || 'qom';
    const supplier = (document.querySelector('#supply-supplier')?.value || '').trim();
    const purchasePrice = parseInt(document.querySelector('#supply-price')?.value) || 0;
    const shippingCost = parseInt(document.querySelector('#supply-shipping')?.value) || 0;

    const inputs = document.querySelectorAll('.supply-input[data-pid]');
    const supplies = [];
    let totalSupplyQty = 0;

    for (const input of inputs) {
      const pid = input.dataset.pid;
      const max = parseInt(input.dataset.max) || 0;
      const qty = Math.floor(Number(input.value)) || 0;
      if (qty > 0 && qty <= max) {
        supplies.push({ productId: pid, quantity: qty });
        totalSupplyQty += qty;
      } else if (qty > max) {
        toast('مقدار تأمین نمی‌تواند از باقی‌مانده بیشتر باشد.');
        _supplyProcessing = false;
        return;
      }
    }

    if (supplies.length === 0) {
      toast('مقدار تأمین وارد نشده است.');
      _supplyProcessing = false;
      return;
    }

    // Use atomic operation for data safety
    atomicOp(() => {
      for (const supply of supplies) {
        let p = getProdById(supply.productId);
        // Fallback: if product not found by ID, try matching by name properties from proforma item
        if (!p) {
          const v2 = DB.invoices.find(x => x.id === proformaId);
          const proformaItem = v2 ? v2.items.find(i => i.productId === supply.productId) : null;
          if (proformaItem && proformaItem.name) {
            const parts = proformaItem.name.split('/');
            if (parts.length >= 4) {
              const brand = parts[0].trim();
              const thickness = parts[1].trim();
              const color = parts[2].trim();
              const dimParts = parts[3].trim().split(/[x×]/);
              const w = parseInt(latinDigits(dimParts[0])) || proformaItem.width;
              const l = parseInt(latinDigits(dimParts[1])) || proformaItem.length;
              p = findProdByProps(brand, thickness, color, w, l);
              if (p) {
                supply.productId = p.id;
                proformaItem.productId = p.id;
              }
            }
          }
        }
        if (!p) { toast('کالا یافت نشد: ' + supply.productId); continue; }

        // Create supply record
        const supplyRecord = {
          id: uid(),
          proformaId: proformaId,
          productId: supply.productId,
          quantity: supply.quantity,
          warehouseId: wh,
          supplier: supplier,
          purchasePrice: purchasePrice,
          shippingCost: shippingCost,
          date: todayISO(),
          timestamp: new Date().toISOString(),
          createdBy: session.name,
          cancelled: false
        };
        DB.proformaSupplies.push(supplyRecord);

        // Increase actual warehouse inventory
        InventoryEngine.receive({
          productId: supply.productId,
          warehouseId: wh,
          quantity: supply.quantity,
          referenceType: 'proforma_supply',
          referenceId: proformaId,
          reason: 'تأمین موجودی برای پیش‌فاکتور ' + v.number
        });
      }
    });

    logAct('proforma_supply', 'تأمین ' + fmt(totalSupplyQty) + ' ورق برای پیش‌فاکتور ' + v.number);
    save();
    closeModal();
    render();
    toast('تأمین موجودی با موفقیت ثبت شد.');
  } catch(e) {
    toast('خطا در ثبت تأمین: ' + e.message);
  } finally {
    _supplyProcessing = false;
  }
}

function doDeleteInvoice(id){
  const v=DB.invoices.find(x=>x.id===id);if(!v)return;
  if(!canDeleteDocs()){toast("\u062f\u0633\u062a\u0631\u0633\u06cc \u0646\u062f\u0627\u0631\u06cc\u062f.");return}
  const reason=(document.querySelector("#dl-reason")||{}).value||"";
  const conf=latinDigits(((document.querySelector("#dl-confirm")||{}).value||"").trim());
  if(!reason.trim()){toast("\u062f\u0644\u06cc\u0644 \u062d\u0630\u0641 \u0631\u0627 \u0648\u0627\u0631\u062f \u06a9\u0646\u06cc\u062f.");return}
  if(conf!==String(v.number)){toast("\u0634\u0645\u0627\u0631\u0647 \u0633\u0646\u062f \u0645\u0637\u0627\u0628\u0642\u062a \u0646\u062f\u0627\u0631\u062f.");return}
  const delPaysEl=document.querySelector("#dl-pays");
  const delPays=delPaysEl?delPaysEl.checked:true;
  const snap=Storage.snapshot();
  try{
    if(v.type!=="proforma"&&v.status!=="\u0628\u0627\u0637\u0644\u200c\u0634\u062f\u0647"){
      v.items.forEach(i=>{
        try{InventoryEngine.cancelSale({productId:i.productId,warehouseId:i.wh,quantity:i.qty,referenceType:"invoice",referenceId:v.id,reason:"\u062d\u0630\u0641 \u0641\u0627\u06a9\u062a\u0648\u0631 "+v.number});}catch(e){}
      });
    }
    const pays=DB.payments.filter(p=>(p.invoiceId&&p.invoiceId===v.id)||String(p.invoiceNumber)===String(v.number));
    if(delPays)DB.payments=DB.payments.filter(p=>pays.indexOf(p)<0);
    else pays.forEach(p=>{p.invoiceId="";p.invoiceNumber="";p.note=(p.note?p.note+" \u2014 ":"")+"\u0641\u0627\u06a9\u062a\u0648\u0631 "+v.number+" \u062d\u0630\u0641 \u0634\u062f"});
    /* release a linked proforma back to open state */
    if(v.fromProformaId){
      const pr=DB.invoices.find(x=>x.id===v.fromProformaId);
      if(pr&&pr.convertedToInvoiceId===v.id){pr.convertedToInvoiceId=null;pr.status="\u067e\u06cc\u0634\u200c\u0641\u0627\u06a9\u062a\u0648\u0631"}
    }
    DB.invoices.filter(x=>x.fromProformaId===v.id).forEach(x=>{x.fromProformaId=null});
    DB.proformaSupplies=(DB.proformaSupplies||[]).filter(s=>s.proformaId!==v.id);
    DB.alerts=(DB.alerts||[]).filter(a=>a.invoiceId!==v.id);
    DB.invoices=DB.invoices.filter(x=>x.id!==v.id);
    auditLog("delete_document","\u062d\u0630\u0641 "+(v.type==="proforma"?"\u067e\u06cc\u0634\u200c\u0641\u0627\u06a9\u062a\u0648\u0631":"\u0641\u0627\u06a9\u062a\u0648\u0631")+" "+v.number+" \u2014 "+reason,v,null,{module:"sales",reference:String(v.number)});
    logAct("delete","\u062d\u0630\u0641 "+(v.type==="proforma"?"\u067e\u06cc\u0634\u200c\u0641\u0627\u06a9\u062a\u0648\u0631 ":"\u0641\u0627\u06a9\u062a\u0648\u0631 ")+v.number+" \u2014 \u062f\u0644\u06cc\u0644: "+reason);
    DB.customers.forEach(c=>{DB.invoices.filter(x=>x.customerId===c.id&&x.type==="invoice").forEach(refreshInvStatus)});
    save();rebuildIndex();closeModal();go("invoices");
    toast("\u0633\u0646\u062f \u062d\u0630\u0641 \u0634\u062f."+(v.type!=="proforma"?" \u0645\u0648\u062c\u0648\u062f\u06cc \u0628\u0627\u0632\u06af\u0634\u062a.":""));
  }catch(e){
    Storage.rollback(snap);rebuildIndex();render();
    toast("\u062d\u0630\u0641 \u0627\u0646\u062c\u0627\u0645 \u0646\u0634\u062f: "+((e&&e.message)||e));
  }
}

let _convertProcessing = false;
function convertProforma(id){
  if(_convertProcessing){toast('عملیات در حال انجام است.');return}
  _convertProcessing = true;
  try{
  const v=DB.invoices.find(x=>x.id===id);
  if(!v){toast('پیش‌فاکتور یافت نشد.');return}
  if(v.convertedToInvoiceId){toast("این پیش‌فاکتور قبلاً به فاکتور تبدیل شده است. شماره فاکتور: "+(DB.invoices.find(x=>x.id===v.convertedToInvoiceId)?.number || "نامشخص"));return}
  if(v.status!=="پیش‌فاکتور"){toast("این پیش‌فاکتور قبلاً باطل یا تبدیل شده است. وضعیت: " + v.status);return}
  // Rebuild product index to ensure fresh data
  rebuildIndex();
  // Check actual stock availability for all items
  const insufficient=[];
  const correctedItems=[];
  for(const item of v.items){
    let p = getProdById(item.productId);
    // Fallback: if product not found by ID, try matching by name/properties
    if (!p && item.name) {
      const parts = item.name.split('/');
      if (parts.length >= 4) {
        const brand = parts[0].trim();
        const thickness = parts[1].trim();
        const color = parts[2].trim();
        const dimParts = parts[3].trim().split(/[x×]/);
        const w = parseInt(latinDigits(dimParts[0])) || item.width;
        const l = parseInt(latinDigits(dimParts[1])) || item.length;
        p = findProdByProps(brand, thickness, color, w, l);
        if (p) {
          item.productId = p.id;
          correctedItems.push(item);
        }
      }
    }
    // Ultimate fallback: search all products by name match
    if (!p && item.name) {
      p = DB.products.find(pr => prodNameOf(pr) === item.name);
      if (p) {
        item.productId = p.id;
        correctedItems.push(item);
      }
    }
    const wh = item.wh || 'qom';
    const available = p ? InventoryEngine.getAvailable(p.id, wh) : 0;
    if(available<item.qty){
      insufficient.push({name:item.name,requested:item.qty,available:available,productFound:!!p});
    }
  }
  // Persist any corrected productIds
  if(correctedItems.length > 0) save();
  if(insufficient.length>0){
    const msg=insufficient.map(i=>'❌ '+i.name+': نیاز '+fmt(i.requested)+' — موجودی '+fmt(i.available)+(i.productFound===false?' (کالا در دیتابیس یافت نشد)':'')).join('\n');
    toast('موجودی انبار کافی نیست:\n'+msg);
    openModal(`<h3>⚠️ موجودی ناکافی</h3>
      <div class="notice red">امکان تبدیل به فاکتور وجود ندارد. محصولات زیر موجودی کافی ندارند:</div>
      <div style="margin:12px 0;font-size:14px;line-height:2.2">${insufficient.map(i=>'<div>❌ <b>'+esc(i.name)+'</b> — نیاز: '+fmt(i.requested)+' ورق — موجودی: '+fmt(i.available)+' ورق'+(i.productFound===false?' <span style="color:var(--md-error)">(کالا در دیتابیس فعلی یافت نشد — ممکن است حذف شده باشد)</span>':'')+'</div>').join('')}</div>
      <div class="notice orange">ابتدا موجودی انبار را تأمین کنید، سپس دوباره اقدام کنید.</div>
      <div class="actions"><button class="btn" onclick="closeModal()">بستن</button></div>`);
    return;
  }
  draft=newDraft("invoice");
  draft.customerId=v.customerId;draft.items=v.items.map(i=>({...i,cost:getProd(i.productId)?.cost??i.cost}));
  draft.discount=v.discount;draft.shipping=v.shipping;draft.showShipping=v.showShipping;draft.fromProformaId=v.id;
  // Preserve length pricing configuration from proforma
  if(v.lengthPricing){draft.lengthPricing=JSON.parse(JSON.stringify(v.lengthPricing));}
  // Sync to SalesCart
  SalesCart.syncFromDraft(draft);
  go("newInvoice");
  }catch(e){toast('خطا در تبدیل پیش‌فاکتور: '+e.message);console.error('convertProforma error:',e);}
  finally{_convertProcessing = false;}
}

    <div class="field"><label>دلیل ابطال</label><select id="cn-reason"><option>اشتباه در قیمت</option><option>اشتباه در تعداد</option><option>لغو خرید</option><option>سایر</option></select></div>

function openCancelProforma(id){
  const v=DB.invoices.find(x=>x.id===id);if(!v)return;
  const supplies=getProformaSupplies(id);
  const totalSupplied=supplies.filter(s=>!s.cancelled).reduce((sum,s)=>sum+s.quantity,0);
  let warnHtml='';
  if(totalSupplied>0){
    warnHtml=`<div class="notice orange">⚠️ این پیش‌فاکتور قبلاً ${fmt(totalSupplied)} ورق تأمین دریافت کرده است. ابطال پیش‌فاکتور موجودی تأمین‌شده را به‌صورت خودکار کم نمی‌کند. مدیر مسئول مدیریت موجودی تأمین‌شده است.</div>`;
  }else{
    warnHtml=`<div class="notice blue">پیش‌فاکتور موجودی را کم نکرده است. ابطال آن تأثیری روی موجودی انبار ندارد.</div>`;
  }
  openModal(`<h3>ابطال پیش‌فاکتور ${esc(v.number)}</h3>
    ${warnHtml}
    <div class="field"><label>دلیل ابطال</label><select id="cn-reason"><option>لغو سفارش</option><option>اشتباه در ثبت</option><option>تغییر سفارش</option><option>سایر</option></select></div>

}
function doCancelProforma(id){
  const v=DB.invoices.find(x=>x.id===id);if(!v)return;
  v.status="باطل‌شده";v.cancelReason=$("#cn-reason").value+($("#cn-note").value?" — "+$("#cn-note").value:"");
  // Do NOT return stock — proformas never reduced stock
  // Do NOT delete supply records — they remain for traceability
  logAct("cancel","ابطال پیش‌فاکتور "+v.number+" — دلیل: "+v.cancelReason);
  save();closeModal();render();toast("پیش‌فاکتور باطل شد.");
}
function doCancel(id){
  const v=DB.invoices.find(x=>x.id===id);if(!v)return;
  v.status="باطل‌شده";v.cancelReason=$("#cn-reason").value+($("#cn-note").value?" — "+$("#cn-note").value:"");
  v.items.forEach(i=>{

  });
  logAct("cancel","ابطال فاکتور "+v.number+" — دلیل: "+v.cancelReason);

       - a single page also carries the whole summary/notes/signature tail

  const CAP_ONE=5, CAP_FIRST=14, CAP_MID=20, CAP_LAST=9;

/* Printing happens in its own iframe: the document is laid out for A4 without
   the app shell interfering, and nothing on screen has to be hidden. */
function printHTML(inner,title){
  return new Promise(resolve=>{
    let done=false;
    const finish=()=>{if(done)return;done=true;resolve()};
    const legacy=()=>{
      try{document.querySelector("#print-root").innerHTML=inner;window.print()}catch(e){}
      finish();
    };
    let f;
    try{
      const old=document.getElementById("print-frame");if(old)old.remove();
      f=document.createElement("iframe");
      f.id="print-frame";f.setAttribute("aria-hidden","true");
      f.style.cssText="position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;pointer-events:none";
      document.body.appendChild(f);
    }catch(e){legacy();return}
    const fire=()=>{
      try{
        f.contentWindow.focus();
        f.contentWindow.print();
        setTimeout(()=>{try{f.remove()}catch(e){}},2000);
        finish();
      }catch(e){try{f.remove()}catch(e2){}legacy()}
    };
    f.onload=()=>{
      try{
        const d=f.contentWindow.document;
        if(d.fonts&&d.fonts.ready)d.fonts.ready.then(()=>setTimeout(fire,150)).catch(()=>setTimeout(fire,500));
        else setTimeout(fire,500);
      }catch(e){setTimeout(fire,500)}
    };
    const html=standaloneDocHTML(inner,title);
    try{
      if("srcdoc" in f)f.srcdoc=html;
      else{const d=f.contentWindow.document;d.open();d.write(html);d.close();setTimeout(fire,600)}
    }catch(e){legacy()}
    setTimeout(finish,12000);
  });
}

    img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
  });
  return {img,w:W,h:H};
}
async function nodeToCanvas(node,wrapClass,scale){
  const {img,w,h}=await nodeToImage(node,wrapClass,794);
  let s=Math.max(1,scale||2);
  while(w*s*h*s>30000000&&s>1)s=Math.max(1,s-0.25);
  const c=document.createElement("canvas");
  c.width=Math.round(w*s);c.height=Math.round(h*s);
  const ctx=c.getContext("2d");
  ctx.fillStyle="#ffffff";ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(img,0,0,c.width,c.height);
  return c;
}
async function docPageCanvases(scale){

function dataUrlBytes(u){const b=atob(u.split(",")[1]);const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function buildPdf(jpegs,wPx,hPx){
  const NL=String.fromCharCode(10);
  const W=595.28,H=841.89;
  const parts=[];let pos=0;const xref=[];
  const add=x=>{parts.push(x);pos+=x.length};
  const obj=x=>{xref.push(pos);add(x)};
  add("%PDF-1.4"+NL);
  obj("1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj"+NL);
  const kids=jpegs.map((_,i)=>`${3+i*3} 0 R`).join(" ");
  obj(`2 0 obj<</Type/Pages/Kids[${kids}]/Count ${jpegs.length}>>endobj`+NL);
  jpegs.forEach((jp,i)=>{
    const pn=3+i*3,cn=4+i*3,im=5+i*3;
    obj(`${pn} 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${W} ${H}]/Resources<</XObject<</Im${i} ${im} 0 R>>/ProcSet[/PDF/ImageC]>>/Contents ${cn} 0 R>>endobj`+NL);
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    obj(`${cn} 0 obj<</Length ${cs.length}>>stream`+NL+cs+NL+"endstream endobj"+NL);
    obj(`${im} 0 obj<</Type/XObject/Subtype/Image/Width ${wPx}/Height ${hPx}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jp.length}>>stream`+NL);
    add(jp);add(NL+"endstream endobj"+NL);
  });
  const xstart=pos;
  let x="xref"+NL+`0 ${xref.length+1}`+NL+"0000000000 65535 f "+NL;
  xref.forEach(o=>{x+=String(o).padStart(10,"0")+" 00000 n "+NL});
  x+=`trailer<</Size ${xref.length+1}/Root 1 0 R>>`+NL+"startxref"+NL+xstart+NL+"%%EOF";
  add(x);
  return new Blob(parts,{type:"application/pdf"});
}
async function renderDocPdf(scale){
  const canvases=await docPageCanvases(scale);
  if(!canvases.length)throw new Error("\u0633\u0646\u062f\u06cc \u0628\u0631\u0627\u06cc \u062e\u0631\u0648\u062c\u06cc \u0648\u062c\u0648\u062f \u0646\u062f\u0627\u0631\u062f");
  const W=canvases[0].width;
  const H=Math.round(W*841.89/595.28);
  const jpegs=canvases.map(c=>{
    const pc=document.createElement("canvas");pc.width=W;pc.height=H;
    const ctx=pc.getContext("2d");ctx.fillStyle="#ffffff";ctx.fillRect(0,0,W,H);
    const k=Math.min(W/c.width,H/c.height);
    const dw=Math.round(c.width*k),dh=Math.round(c.height*k);
    ctx.drawImage(c,Math.round((W-dw)/2),0,dw,dh);
    return dataUrlBytes(pc.toDataURL("image/jpeg",.92));
  });
  return buildPdf(jpegs,W,H);
}
async function makeDocPdf(){
  const tries=[2.5,1.75,1];
  let last=null;
  for(const s of tries){
    try{return await renderDocPdf(s)}catch(e){last=e}
  }
  throw last||new Error("\u0633\u0627\u062e\u062a PDF \u0645\u0645\u06a9\u0646 \u0646\u0634\u062f");
}

function canvasToBlob(c,type,q){

    try{c.toBlob(b=>b?res(b):rej(new Error("\u0633\u0627\u062e\u062a \u062a\u0635\u0648\u06cc\u0631 \u0645\u0645\u06a9\u0646 \u0646\u0634\u062f")),type||"image/png",q)}

async function sendDocImage(){
  const canvases=await docPageCanvases(2);
  if(!canvases.length)throw new Error("\u0633\u0646\u062f\u06cc \u0628\u0631\u0627\u06cc \u062e\u0631\u0648\u062c\u06cc \u0648\u062c\u0648\u062f \u0646\u062f\u0627\u0631\u062f");
  const W=canvases[0].width;
  const totalH=canvases.reduce((s,c)=>s+c.height,0);
  const files=[];
  if(canvases.length===1||W*totalH<=30000000){
    const c=document.createElement("canvas");c.width=W;c.height=totalH;
    const ctx=c.getContext("2d");ctx.fillStyle="#ffffff";ctx.fillRect(0,0,W,totalH);
    let y=0;canvases.forEach(p=>{ctx.drawImage(p,0,y);y+=p.height});
    files.push(new File([await canvasToBlob(c,"image/jpeg",.95)],docFileName("jpg"),{type:"image/jpeg"}));
  }else{
    for(let i=0;i<canvases.length;i++){

    try{await navigator.share({files,title:docTitleOf()});return}
    catch(e){if(e&&e.name==="AbortError")return}
  }
  files.forEach(f=>saveBlob(f,f.name));
  toast(files.length>1?"\u062a\u0635\u0627\u0648\u06cc\u0631 \u0633\u0646\u062f \u062f\u0627\u0646\u0644\u0648\u062f \u0634\u062f\u0646\u062f.":"\u062a\u0635\u0648\u06cc\u0631 \u0633\u0646\u062f \u062f\u0627\u0646\u0644\u0648\u062f \u0634\u062f.");

/* Resolve the price for one sheet: the bar price wins, otherwise fall back
   to the normal pricing chain (customer price -> engine -> sale price). */
function ssResolvePrice(p){
  const unit=deNum(ssPrice.value)||0;
  const area=p.width*p.length/10000;
  if(unit>0){
    return ssPrice.mode==="m2"
      ? {price:Math.round(unit*area),unit:"m2",src:"\u0642\u06cc\u0645\u062a \u0645\u062a\u0631\u06cc \u0648\u0627\u0631\u062f\u0634\u062f\u0647"}
      : {price:Math.round(unit),unit:"sheet",src:"\u0642\u06cc\u0645\u062a \u0648\u0631\u0642\u06cc \u0648\u0627\u0631\u062f\u0634\u062f\u0647"};
  }
  try{
    if(draft&&draft.lengthPricing&&draft.lengthPricing.enabled){
      const lp=calculateLengthBasedPrice(p,draft);
      if(lp&&lp.sheetPrice>0)return{price:lp.sheetPrice,unit:"sheet",src:"\u0642\u06cc\u0645\u062a\u200c\u06af\u0630\u0627\u0631\u06cc \u0637\u0648\u0644\u06cc",cat:lp.category,m2:lp.m2Price};
    }
  }catch(e){}
  try{
    const cp=CustomerPricing.getPrice(draft?draft.customerId:null,p.id);
    if(cp>0)return{price:Math.round(cp),unit:"sheet",src:"\u0642\u06cc\u0645\u062a \u0627\u062e\u062a\u0635\u0627\u0635\u06cc \u0645\u0634\u062a\u0631\u06cc"};
  }catch(e){}
  try{
    const pe=PricingEngine.getPrice(p.id,{customerId:draft?draft.customerId:null});
    if(pe>0)return{price:Math.round(pe),unit:"sheet",src:"\u0642\u06cc\u0645\u062a \u0633\u06cc\u0633\u062a\u0645"};
  }catch(e){}
  if(p.salePrice>0)return{price:Math.round(p.salePrice),unit:"sheet",src:"\u0642\u06cc\u0645\u062a \u067e\u06cc\u0634\u0646\u0647\u0627\u062f\u06cc \u06a9\u0627\u0644\u0627"};
  return{price:0,unit:"sheet",src:""};
}

/* ================= v6: number -> Persian words ================= */
const _NW_ONES=["","\u06cc\u06a9","\u062f\u0648","\u0633\u0647","\u0686\u0647\u0627\u0631","\u067e\u0646\u062c","\u0634\u0634","\u0647\u0641\u062a","\u0647\u0634\u062a","\u0646\u0647"];
const _NW_TEENS=["\u062f\u0647","\u06cc\u0627\u0632\u062f\u0647","\u062f\u0648\u0627\u0632\u062f\u0647","\u0633\u06cc\u0632\u062f\u0647","\u0686\u0647\u0627\u0631\u062f\u0647","\u067e\u0627\u0646\u0632\u062f\u0647","\u0634\u0627\u0646\u0632\u062f\u0647","\u0647\u0641\u062f\u0647","\u0647\u062c\u062f\u0647","\u0646\u0648\u0632\u062f\u0647"];
const _NW_TENS=["","","\u0628\u06cc\u0633\u062a","\u0633\u06cc","\u0686\u0647\u0644","\u067e\u0646\u062c\u0627\u0647","\u0634\u0635\u062a","\u0647\u0641\u062a\u0627\u062f","\u0647\u0634\u062a\u0627\u062f","\u0646\u0648\u062f"];
const _NW_HUND=["","\u06cc\u06a9\u0635\u062f","\u062f\u0648\u06cc\u0633\u062a","\u0633\u06cc\u0635\u062f","\u0686\u0647\u0627\u0631\u0635\u062f","\u067e\u0627\u0646\u0635\u062f","\u0634\u0634\u0635\u062f","\u0647\u0641\u062a\u0635\u062f","\u0647\u0634\u062a\u0635\u062f","\u0646\u0647\u0635\u062f"];
const _NW_SCALE=["","\u0647\u0632\u0627\u0631","\u0645\u06cc\u0644\u06cc\u0648\u0646","\u0645\u06cc\u0644\u06cc\u0627\u0631\u062f","\u0647\u0632\u0627\u0631 \u0645\u06cc\u0644\u06cc\u0627\u0631\u062f"];
function _nw3(n){
  const out=[];
  const h=Math.floor(n/100),r=n%100;
  if(h)out.push(_NW_HUND[h]);
  if(r>=10&&r<20)out.push(_NW_TEENS[r-10]);
  else{
    const t=Math.floor(r/10),o=r%10;
    if(t)out.push(_NW_TENS[t]);
    if(o)out.push(_NW_ONES[o]);
  }
  return out.join(" \u0648 ");
}
function numToWords(n){
  n=Math.round(Math.abs(Number(n)||0));
  if(n===0)return "\u0635\u0641\u0631";
  const parts=[];let i=0;
  while(n>0&&i<_NW_SCALE.length){
    const c=n%1000;
    if(c)parts.unshift(_nw3(c)+(_NW_SCALE[i]?" "+_NW_SCALE[i]:""));
    n=Math.floor(n/1000);i++;
  }
  return parts.join(" \u0648 ");
}

/* ================= v6: tiny dependency-free SVG charts ================= */
const CHART_COLORS=["#1976D2","#43A047","#FB8C00","#8E24AA","#E53935","#00ACC1","#5E35B1","#7CB342","#D81B60","#546E7A"];
function svgEsc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function niceMax(v){
  if(!(v>0))return 1;
  const p=Math.pow(10,Math.floor(Math.log10(v)));
  const n=v/p;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;
}
function shortNum(n){
  n=Number(n)||0;const a=Math.abs(n);
  if(a>=1e9)return faNum((n/1e9).toFixed(1))+" \u0645\u06cc\u0644\u06cc\u0627\u0631\u062f";
  if(a>=1e6)return faNum((n/1e6).toFixed(a>=1e7?0:1))+" \u0645\u06cc\u0644\u06cc\u0648\u0646";
  if(a>=1e3)return faNum(Math.round(n/1e3))+" \u0647\u0632\u0627\u0631";

}
/* grouped/simple vertical bars */
function svgBars(rows,opts){
  opts=opts||{};
  const series=opts.series||[{key:"v",color:CHART_COLORS[0],label:""}];
  const H=opts.height||190,PADT=16,PADB=34,PADL=10,PADR=78;
  const n=Math.max(1,rows.length);
  const bw=Math.max(opts.minBar||26,Math.min(58,Math.floor(640/n)));
  const gap=Math.max(6,Math.round(bw*0.28));
  const W=Math.max(320,n*(bw+gap)+gap+PADL+PADR);
  const maxV=niceMax(Math.max(1,...rows.map(r=>Math.max(...series.map(s=>Math.abs(Number(r[s.key])||0))))));
  const plotH=H-PADT-PADB;
  const y=v=>PADT+plotH-(Math.abs(v)/maxV)*plotH;
  let g="";
  /* grid + value axis in its own right-hand gutter */
  for(let i=0;i<=4;i++){
    const gy=PADT+plotH*i/4;
    g+=`<line x1="${PADL}" y1="${gy.toFixed(1)}" x2="${W-PADR+4}" y2="${gy.toFixed(1)}" stroke="${i===4?"#c7d0dc":"#e9edf3"}" stroke-width="1"/>`;
    g+=`<text x="${W-PADR+9}" y="${(gy+4).toFixed(1)}" font-size="11" fill="#7b8694" text-anchor="start">${svgEsc(shortNum(maxV*(1-i/4)))}</text>`;
  }
  rows.forEach((r,i)=>{
    const x0=PADL+gap+i*(bw+gap);
    const sw=bw/series.length;
    series.forEach((s,si)=>{
      const v=Math.abs(Number(r[s.key])||0);
      const yy=y(v),h=Math.max(v>0?2:0,PADT+plotH-yy);
      g+=`<rect x="${(x0+si*sw).toFixed(1)}" y="${yy.toFixed(1)}" width="${(sw-1.5).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${s.color}"><title>${svgEsc(r.label)} \u2014 ${svgEsc(s.label||"")} ${svgEsc(fmt(Number(r[s.key])||0))}</title></rect>`;
    });
    const skip=rows.length>22&&(i%2);
    if(!skip)g+=`<text x="${(x0+bw/2).toFixed(1)}" y="${H-PADB+15}" font-size="11" fill="#5f6b7a" text-anchor="middle">${svgEsc(r.label)}</text>`;
    if(rows.length<=12){
      const top=Math.min(...series.map(s=>y(Math.abs(Number(r[s.key])||0))));
      const v0=Number(rows[i][series[0].key])||0;
      if(v0)g+=`<text x="${(x0+bw/2).toFixed(1)}" y="${(top-5).toFixed(1)}" font-size="10" font-weight="600" fill="#41505f" text-anchor="middle">${svgEsc(shortNum(v0))}</text>`;
    }
  });
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Vazirmatn,Tahoma,sans-serif">${g}</svg></div>`;
}
/* smooth-ish area/line */
function svgLine(rows,opts){
  opts=opts||{};

  const H=opts.height||200,PADT=16,PADB=32,PADL=12,PADR=78;
  const n=Math.max(2,rows.length);

  });
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="Vazirmatn,Tahoma,sans-serif">${g}</svg></div>`;
}
function svgDonut(items,opts){
  opts=opts||{};
  const size=opts.size||150,r=size/2-10,cx=size/2,cy=size/2,sw=opts.thickness||20;
  const total=items.reduce((s,i)=>s+Math.abs(Number(i.value)||0),0);
  if(!(total>0))return `<div class="sub" style="padding:20px;text-align:center">\u062f\u0627\u062f\u0647\u200c\u0627\u06cc \u0646\u06cc\u0633\u062a</div>`;
  let a=-Math.PI/2,g="";
  items.forEach((it,i)=>{
    const frac=Math.abs(Number(it.value)||0)/total;
    if(frac<=0)return;
    const a2=a+frac*Math.PI*2;
    const large=frac>0.5?1:0;
    const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const col=it.color||CHART_COLORS[i%CHART_COLORS.length];
    if(frac>0.9995){
      g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}"/>`;
    }else{
      g+=`<path d="M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="butt"><title>${svgEsc(it.label)} \u2014 ${svgEsc(fmt(it.value))} (${faNum(Math.round(frac*100))}\u066a)</title></path>`;
    }
    a=a2;
  });
  g+=`<text x="${cx}" y="${cy-1}" font-size="15" font-weight="700" fill="#2b3440" text-anchor="middle">${svgEsc(shortNum(total))}</text>`;
  g+=`<text x="${cx}" y="${cy+15}" font-size="10.5" fill="#8d97a3" text-anchor="middle">${svgEsc(opts.caption||"\u062a\u0648\u0645\u0627\u0646")}</text>`;
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" font-family="Vazirmatn,Tahoma,sans-serif">${g}</svg>`;
}

function pad2(n){return String(n).padStart(2,"0")}
function isoToJ(iso){const d=new Date(iso);if(isNaN(d))return null;return g2j(d.getFullYear(),d.getMonth()+1,d.getDate())}
function jToISO(jy,jm,jd){const[gy,gm,gd]=j2g(jy,jm,jd);return `${gy}-${pad2(gm)}-${pad2(gd)}`}

    const d=new Date(jToISO(jy,jm,jd));
    const dow=(d.getDay()+1)%7;              /* Saturday = 0 */
    const s=new Date(d);s.setDate(d.getDate()-dow);
    const e=new Date(s);e.setDate(s.getDate()+6);
    const f=x=>`${x.getFullYear()}-${pad2(x.getMonth()+1)}-${pad2(x.getDate())}`;
    return{from:f(s),to:f(e),label:"\u0627\u06cc\u0646 \u0647\u0641\u062a\u0647"};
  }
  if(kind==="month")return{from:jToISO(jy,jm,1),to:jToISO(jy,jm,jDaysInMonth(jy,jm)),label:J_MONTHS[jm-1]+" "+faNum(jy)};
  if(kind==="year")return{from:jToISO(jy,1,1),to:jToISO(jy,12,jDaysInMonth(jy,12)),label:"\u0633\u0627\u0644 "+faNum(jy)};
  if(kind==="all")return{from:"",to:"",label:"\u06a9\u0644 \u062f\u0648\u0631\u0647"};
  return{from:"",to:"",label:"\u06a9\u0644 \u062f\u0648\u0631\u0647"};
}
function inRange(iso,from,to){
  const d=String(iso||"").slice(0,10);
  if(!d)return false;
  if(from&&d<from)return false;
  if(to&&d>to)return false;
  return true;
}
/* buckets for the trend chart */
function bucketsFor(gran,from,to){
  const out=[];
  if(gran==="day"){
    const s=new Date(from||todayISO()),e=new Date(to||todayISO());
    let guard=0;
    for(let d=new Date(s);d<=e&&guard++<400;d.setDate(d.getDate()+1)){
      const iso=`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
      const j=isoToJ(iso);
      out.push({key:iso,label:faNum(j[2]),from:iso,to:iso});
    }
  }else if(gran==="month"){
    const jf=isoToJ(from||todayISO()),jt=isoToJ(to||todayISO());
    let y=jf[0],m=jf[1],guard=0;
    while((y<jt[0]||(y===jt[0]&&m<=jt[1]))&&guard++<60){
      out.push({key:y+"/"+pad2(m),label:J_MONTHS[m-1],from:jToISO(y,m,1),to:jToISO(y,m,jDaysInMonth(y,m))});
      m++;if(m>12){m=1;y++}
    }
  }else{
    const jf=isoToJ(from||todayISO()),jt=isoToJ(to||todayISO());
    for(let y=jf[0];y<=jt[0];y++)
      out.push({key:String(y),label:faNum(y),from:jToISO(y,1,1),to:jToISO(y,12,jDaysInMonth(y,12))});
  }
  return out;
}

/* ================= v6: financial roll-up ================= */
function financeSummary(from,to){
  const invs=(DB.invoices||[]).filter(v=>v.type==="invoice"&&v.status!=="\u0628\u0627\u0637\u0644\u200c\u0634\u062f\u0647"&&inRange(v.date,from,to));
  const sales=invs.reduce((s,v)=>s+invTotal(v),0);
  const cogs=invs.reduce((s,v)=>s+(v.items||[]).reduce((a,i)=>a+(Number(i.cost)||0)*(Number(i.qty)||0),0),0);
  const discount=invs.reduce((s,v)=>s+(Number(v.discount)||0),0);
  const grossProfit=sales-cogs;
  const exps=expensesIn(from,to);
  const opex=exps.filter(e=>e.kind!=="cogs").reduce((s,e)=>s+e.amount,0);
  const purchases=exps.filter(e=>e.kind==="cogs").reduce((s,e)=>s+e.amount,0);
  const commissionEarned=invs.reduce((s,v)=>s+invoiceCommission(v).amount,0);
  const netProfit=grossProfit-opex;
  const collected=(DB.payments||[]).filter(p=>inRange(p.date,from,to)).reduce((s,p)=>s+(Number(p.amount)||0),0);
  const receivable=(DB.customers||[]).reduce((s,c)=>{const b=custBalance(c.id);return s+(b>0?b:0)},0);
  const customerCredit=(DB.customers||[]).reduce((s,c)=>{const b=custBalance(c.id);return s+(b<0?-b:0)},0);
  const commissionDue=allSellerNames().reduce((s,n)=>{const st=sellerStats(n,"","");return s+Math.max(0,st.due)},0);
  const sheets=invs.reduce((s,v)=>s+invQty(v),0);
  const area=invs.reduce((s,v)=>s+invArea(v),0);
  /* average realised price per m2, used when a product has no cost/sale price */
  let _pm2s=0,_pm2n=0;
  (DB.invoices||[]).forEach(v=>{if(v.type!=="invoice"||v.status==="\u0628\u0627\u0637\u0644\u200c\u0634\u062f\u0647")return;
    (v.items||[]).forEach(i=>{const a=lineArea(i);if(a>0&&i.price>0){_pm2s+=(i.qty*i.price)/a;_pm2n++}})});
  const avgM2=_pm2n?_pm2s/_pm2n:0;
  let costPriced=0;
  const stockValue=(DB.products||[]).reduce((s,p)=>{
    const t=totStock(p);if(t<=0)return s;
    const c=Number(p.costPrice)||0;
    if(c>0){costPriced++;return s+t*c}
    const alt=Number(p.salePrice)||Number(p.minPrice)||0;
    if(alt>0)return s+t*alt;
    /* last resort: average realised price per m2 */
    return s+t*(p.width*p.length/10000)*avgM2;
  },0);
  const stockValueIsEstimate=costPriced===0;
  const stockSheets=(DB.products||[]).reduce((s,p)=>s+totStock(p),0);
  const stockArea=(DB.products||[]).reduce((s,p)=>s+totStock(p)*(p.width*p.length/10000),0);
  return{invs,sales,cogs,discount,grossProfit,opex,purchases,netProfit,collected,receivable,
         customerCredit,commissionEarned,commissionDue,sheets,area,exps,stockValue,stockValueIsEstimate,
         stockSheets,stockArea,cash:collected-opex};
}

    <div class="kpi bad"><div class="lbl">\u0647\u0632\u06cc\u0646\u0647\u200c\u0647\u0627</div><div class="val">${fmt(f.opex+f.purchases)}</div><div class="sub2">\u062c\u0627\u0631\u06cc ${shortNum(f.opex)} \u2014 \u062e\u0631\u06cc\u062f ${shortNum(f.purchases)}</div></div>
    <div class="kpi ${f.netProfit>=0?'good':'bad'}"><div class="lbl">\u0633\u0648\u062f \u062e\u0627\u0644\u0635</div><div class="val">${fmt(f.netProfit)}</div><div class="sub2">\u062d\u0627\u0634\u06cc\u0647 ${faNum(margin)}\u066a</div></div>
    <div class="kpi warn"><div class="lbl">\u0645\u0637\u0627\u0644\u0628\u0627\u062a \u0627\u0632 \u0645\u0634\u062a\u0631\u06cc</div><div class="val">${fmt(f.receivable)}</div><div class="sub2">${faNum(unpaid.length)} \u0641\u0627\u06a9\u062a\u0648\u0631 \u062a\u0633\u0648\u06cc\u0647\u200c\u0646\u0634\u062f\u0647</div></div>
    <div class="kpi"><div class="lbl">\u0648\u0635\u0648\u0644\u06cc \u062f\u0648\u0631\u0647</div><div class="val">${fmt(f.collected)}</div><div class="sub2">\u062a\u0648\u0645\u0627\u0646 \u062f\u0631\u06cc\u0627\u0641\u062a\u200c\u0634\u062f\u0647</div></div>
    <div class="kpi bad"><div class="lbl">\u0628\u062f\u0647\u06cc \u067e\u0648\u0631\u0633\u0627\u0646\u062a</div><div class="val">${fmt(f.commissionDue)}</div><div class="sub2">\u067e\u0631\u062f\u0627\u062e\u062a\u200c\u0646\u0634\u062f\u0647 \u0628\u0647 \u0641\u0631\u0648\u0634\u0646\u062f\u06af\u0627\u0646</div></div>
    <div class="kpi"><div class="lbl">\u0627\u0631\u0632\u0634 \u0645\u0648\u062c\u0648\u062f\u06cc \u0627\u0646\u0628\u0627\u0631</div><div class="val">${fmt(f.stockValue)}</div><div class="sub2">${fmt(f.stockSheets)} \u0648\u0631\u0642 \u2014 ${area1(f.stockArea)} m\u00b2${f.stockValueIsEstimate?" \u2014 \u0628\u0631\u0622\u0648\u0631\u062f \u0628\u0627 \u0642\u06cc\u0645\u062a \u0641\u0631\u0648\u0634":""}</div></div>
  </div>

  <div class="chart-card">
    <h4>${ic("bar-chart",16)} \u0631\u0648\u0646\u062f \u0641\u0631\u0648\u0634\u060c \u0647\u0632\u06cc\u0646\u0647 \u0648 \u0633\u0648\u062f<span class="sp">${gran==="day"?"\u0631\u0648\u0632\u0627\u0646\u0647":gran==="month"?"\u0645\u0627\u0647\u0627\u0646\u0647":"\u0633\u0627\u0644\u0627\u0646\u0647"} \u2014 ${r.label}</span></h4>
    ${trend.length?svgBars(trend,{height:210,series:[
      {key:"sales",color:"#1976D2",label:"\u0641\u0631\u0648\u0634"},
      {key:"expense",color:"#E53935",label:"\u0647\u0632\u06cc\u0646\u0647"},
      {key:"profit",color:"#43A047",label:"\u0633\u0648\u062f \u062e\u0627\u0644\u0635"}]}):'<div class="empty">\u062f\u0627\u062f\u0647\u200c\u0627\u06cc \u0646\u06cc\u0633\u062a</div>'}
    <div class="legend"><span><i style="background:#1976D2"></i>\u0641\u0631\u0648\u0634</span><span><i style="background:#E53935"></i>\u0647\u0632\u06cc\u0646\u0647</span><span><i style="background:#43A047"></i>\u0633\u0648\u062f \u062e\u0627\u0644\u0635</span></div>
  </div>

  <div class="chart-card">
    <h4>${ic("trending-up",16)} \u0631\u0648\u0646\u062f \u0633\u0648\u062f \u062e\u0627\u0644\u0635</h4>
    ${trend.length>1?svgLine(trend,{height:180,series:[{key:"profit",color:"#43A047",label:"\u0633\u0648\u062f \u062e\u0627\u0644\u0635"}]}):'<div class="sub">\u0628\u0631\u0627\u06cc \u0646\u0645\u0648\u062f\u0627\u0631 \u0631\u0648\u0646\u062f\u060c \u062d\u062f\u0627\u0642\u0644 \u062f\u0648 \u0628\u0627\u0632\u0647 \u0644\u0627\u0632\u0645 \u0627\u0633\u062a.</div>'}
  </div>

  <div class="chart-card">
    <h4>${ic("users",16)} \u0645\u0642\u0627\u06cc\u0633\u0647 \u0641\u0631\u0648\u0634\u0646\u062f\u06af\u0627\u0646<span class="sp">${r.label}</span></h4>
    ${sellers.length?`
      ${svgBars(sellers.slice(0,10).map(s=>({label:s.seller.length>9?s.seller.slice(0,9)+"\u2026":s.seller,sales:s.sales,commission:s.commission})),
        {height:190,series:[{key:"sales",color:"#1976D2",label:"\u0641\u0631\u0648\u0634"},{key:"commission",color:"#FB8C00",label:"\u067e\u0648\u0631\u0633\u0627\u0646\u062a"}]})}
      <div class="legend"><span><i style="background:#1976D2"></i>\u0641\u0631\u0648\u0634</span><span><i style="background:#FB8C00"></i>\u067e\u0648\u0631\u0633\u0627\u0646\u062a</span></div>
      <div class="tblwrap" style="margin-top:10px"><table class="tbl"><thead><tr>
        <th>\u0641\u0631\u0648\u0634\u0646\u062f\u0647</th><th>\u0641\u0627\u06a9\u062a\u0648\u0631</th><th>\u0648\u0631\u0642</th><th>\u0645\u062a\u0631 \u0645\u0631\u0628\u0639</th><th>\u0641\u0631\u0648\u0634</th><th>\u0633\u0648\u062f</th><th>\u067e\u0648\u0631\u0633\u0627\u0646\u062a</th><th>\u0633\u0647\u0645</th>
      </tr></thead><tbody>
      ${sellers.map(s=>`<tr class="click" onclick="go('sellerDetail','${esc(s.seller).replace(/'/g,"\\'")}')">
        <td><b>${esc(s.seller)}</b></td>
        <td class="num">${faNum(s.count)}</td>
        <td class="num">${fmt(s.sheets)}</td>
        <td class="num">${area1(s.area)}</td>
        <td class="num money">${fmt(s.sales)}</td>
        <td class="num" style="color:#1b8a3f">${fmt(s.profit)}</td>
        <td class="num" style="color:#c47d00">${fmt(s.commission)}</td>
        <td><div class="seller-bar"><i style="width:${Math.round(s.sales/maxSellerSales*100)}%"></i></div></td>
      </tr>`).join("")}
      </tbody></table></div>`:'<div class="empty">\u062f\u0631 \u0627\u06cc\u0646 \u062f\u0648\u0631\u0647 \u0641\u0631\u0648\u0634\u06cc \u062b\u0628\u062a \u0646\u0634\u062f\u0647 \u0627\u0633\u062a.</div>'}
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px">
    <div class="chart-card"><h4>${ic("wallet",16)} \u062a\u0631\u06a9\u06cc\u0628 \u0647\u0632\u06cc\u0646\u0647\u200c\u0647\u0627</h4>
      ${catList.length?`<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        ${svgDonut(catList.map(([k,v],i)=>({label:k,value:v,color:CHART_COLORS[i%CHART_COLORS.length]})),{size:140})}
        <div style="flex:1;min-width:150px">
        ${catList.map(([k,v],i)=>`<div style="display:flex;gap:7px;align-items:center;font-size:12px;padding:2px 0">
          <i style="width:9px;height:9px;border-radius:3px;background:${CHART_COLORS[i%CHART_COLORS.length]};display:inline-block"></i>
          <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k)}</span>
          <b class="num">${shortNum(v)}</b></div>`).join("")}
        </div></div>`:'<div class="empty">\u0647\u0632\u06cc\u0646\u0647\u200c\u0627\u06cc \u062b\u0628\u062a \u0646\u0634\u062f\u0647</div>'}
    </div>
    <div class="chart-card"><h4>${ic("box",16)} \u0645\u0648\u062c\u0648\u062f\u06cc \u0648 \u062a\u0623\u0645\u06cc\u0646</h4>
      <div class="sumline"><span>\u0627\u0631\u0632\u0634 \u0645\u0648\u062c\u0648\u062f\u06cc${f.stockValueIsEstimate?" (\u0628\u0631\u0622\u0648\u0631\u062f)":""}</span><b class="num">${fmt(f.stockValue)}</b></div>
      <div class="sumline"><span>\u062a\u0639\u062f\u0627\u062f \u0648\u0631\u0642</span><b class="num">${fmt(f.stockSheets)}</b></div>
      <div class="sumline"><span>\u0645\u062a\u0631\u0627\u0698 \u06a9\u0644</span><b class="num">${area1(f.stockArea)} m\u00b2</b></div>
      <div class="sumline"><span>\u06a9\u0627\u0644\u0627\u06cc \u0632\u06cc\u0631 \u062d\u062f\u0627\u0642\u0644</span><b class="num" style="color:${lowStock.length?'var(--md-error)':'inherit'}">${faNum(lowStock.length)}</b></div>
      <div class="sumline"><span>\u067e\u06cc\u0634\u200c\u0641\u0627\u06a9\u062a\u0648\u0631 \u0628\u0627\u0632</span><b class="num">${faNum(openProformas.length)}</b></div>
      <div class="sumline"><span>\u062e\u0631\u06cc\u062f \u06a9\u0627\u0644\u0627 \u062f\u0631 \u062f\u0648\u0631\u0647</span><b class="num">${fmt(f.purchases)}</b></div>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm" onclick="go('sheetSelect')">\u0627\u0646\u062a\u062e\u0627\u0628 \u0648\u0631\u0642</button>
        <button class="btn sm" onclick="go('shelfReport')">\u0642\u0641\u0633\u0647\u200c\u0628\u0646\u062f\u06cc</button>
      </div>
    </div>
  </div>

  <div class="card"><h3>\u062e\u0644\u0627\u0635\u0647 \u0633\u0648\u062f \u0648 \u0632\u06cc\u0627\u0646 \u2014 ${r.label}</h3>
    <div class="sumline"><span>\u0641\u0631\u0648\u0634 \u062e\u0627\u0644\u0635</span><b class="num">${fmt(f.sales)}</b></div>
    <div class="sumline"><span>\u0628\u0647\u0627\u06cc \u062a\u0645\u0627\u0645\u200c\u0634\u062f\u0647 \u06a9\u0627\u0644\u0627\u06cc \u0641\u0631\u0648\u0634\u200c\u0631\u0641\u062a\u0647</span><b class="num">\u2212 ${fmt(f.cogs)}</b></div>
    <div class="sumline total"><span>\u0633\u0648\u062f \u0646\u0627\u062e\u0627\u0644\u0635</span><span class="num">${toman(f.grossProfit)}</span></div>
    <div class="sumline"><span>\u0647\u0632\u06cc\u0646\u0647\u200c\u0647\u0627\u06cc \u062c\u0627\u0631\u06cc</span><b class="num">\u2212 ${fmt(f.opex)}</b></div>
    <div class="sumline total"><span>\u0633\u0648\u062f \u062e\u0627\u0644\u0635</span><span class="num" style="color:${f.netProfit>=0?'#1b8a3f':'var(--md-error)'}">${toman(f.netProfit)}</span></div>
  </div>`;
}

/* ================= v6: seller's own dashboard ================= */
let myPeriod="month";
function pageMyDashboard(){
  const who=currentSeller();
  const r=periodRange(myPeriod);
  const st=sellerStats(who,r.from,r.to);
  const all=sellerStats(who,"","");
  const gran=myPeriod==="year"?"month":myPeriod==="all"?"year":"day";
  const buckets=bucketsFor(gran,r.from||todayISO().slice(0,10),r.to||todayISO().slice(0,10));
  const trend=buckets.map(b=>{
    const s=sellerStats(who,b.from,b.to);
    return{label:b.label,sales:s.sales,commission:s.commission,area:Math.round(s.area)};
  });
  const rules=commissionRules().filter(x=>x.active!==false&&(!x.seller||x.seller===who));
  const recent=st.invoices.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,12);
  return `
  <div class="pagehead"><div><div class="h1">\u062f\u0627\u0634\u0628\u0648\u0631\u062f \u0645\u0646</div><div class="sub">${esc(who)} \u2014 ${r.label}</div></div>
    <button class="btn primary" onclick="startInvoice('invoice')">${ic("plus",16)} \u0641\u0627\u06a9\u062a\u0648\u0631 \u062c\u062f\u06cc\u062f</button></div>

  <div class="rangebar">
    ${[["today","\u0627\u0645\u0631\u0648\u0632"],["week","\u0627\u06cc\u0646 \u0647\u0641\u062a\u0647"],["month","\u0627\u06cc\u0646 \u0645\u0627\u0647"],["year","\u0627\u0645\u0633\u0627\u0644"],["all","\u06a9\u0644"]]
      .map(([k,l])=>`<button class="chip ${myPeriod===k?'active':''}" onclick="myPeriod='${k}';rerender()">${l}</button>`).join("")}
  </div>

  <div class="kpi-grid">
    <div class="kpi pri"><div class="lbl">\u0641\u0631\u0648\u0634 \u0645\u0646</div><div class="val">${fmt(st.sales)}</div><div class="sub2">\u062a\u0648\u0645\u0627\u0646 \u2014 ${faNum(st.count)} \u0641\u0627\u06a9\u062a\u0648\u0631</div></div>
    <div class="kpi"><div class="lbl">\u0645\u062a\u0631 \u0645\u0631\u0628\u0639 \u0641\u0631\u0648\u062e\u062a\u0647\u200c\u0634\u062f\u0647</div><div class="val">${area1(st.area)}</div><div class="sub2">m\u00b2 \u2014 ${area1(st.meters)} \u0645\u062a\u0631 \u0637\u0648\u0644</div></div>
    <div class="kpi"><div class="lbl">\u062a\u0639\u062f\u0627\u062f \u0628\u0631\u06af (\u0648\u0631\u0642)</div><div class="val">${fmt(st.sheets)}</div><div class="sub2">\u0628\u0631\u06af \u0641\u0631\u0648\u062e\u062a\u0647\u200c\u0634\u062f\u0647</div></div>
    <div class="kpi good"><div class="lbl">\u067e\u0648\u0631\u0633\u0627\u0646\u062a \u0627\u06cc\u0646 \u062f\u0648\u0631\u0647</div><div class="val">${fmt(st.commission)}</div><div class="sub2">\u062a\u0648\u0645\u0627\u0646</div></div>
    <div class="kpi ${all.due>0?'warn':'good'}"><div class="lbl">\u067e\u0648\u0631\u0633\u0627\u0646\u062a \u0642\u0627\u0628\u0644 \u062f\u0631\u06cc\u0627\u0641\u062a (\u06a9\u0644)</div><div class="val">${fmt(Math.max(0,all.due))}</div><div class="sub2">\u067e\u0631\u062f\u0627\u062e\u062a\u200c\u0634\u062f\u0647: ${shortNum(all.paid)}</div></div>
    ${canViewProfit()?`<div class="kpi"><div class="lbl">\u0633\u0648\u062f \u0641\u0631\u0648\u0634 \u0645\u0646</div><div class="val">${fmt(st.profit)}</div><div class="sub2">\u062a\u0648\u0645\u0627\u0646</div></div>`:""}
  </div>

  <div class="chart-card">
    <h4>${ic("bar-chart",16)} \u0641\u0631\u0648\u0634 \u0648 \u067e\u0648\u0631\u0633\u0627\u0646\u062a \u0645\u0646<span class="sp">${r.label}</span></h4>
    ${trend.length?svgBars(trend,{height:200,series:[
      {key:"sales",color:"#1976D2",label:"\u0641\u0631\u0648\u0634"},
      {key:"commission",color:"#FB8C00",label:"\u067e\u0648\u0631\u0633\u0627\u0646\u062a"}]}):'<div class="empty">\u062f\u0627\u062f\u0647\u200c\u0627\u06cc \u0646\u06cc\u0633\u062a</div>'}
    <div class="legend"><span><i style="background:#1976D2"></i>\u0641\u0631\u0648\u0634</span><span><i style="background:#FB8C00"></i>\u067e\u0648\u0631\u0633\u0627\u0646\u062a</span></div>
  </div>

  <div class="chart-card"><h4>${ic("ruler",16)} \u0645\u062a\u0631\u0627\u0698 \u0641\u0631\u0648\u062e\u062a\u0647\u200c\u0634\u062f\u0647 (m\u00b2)</h4>
    ${trend.length>1?svgLine(trend,{height:170,series:[{key:"area",color:"#8E24AA",label:"\u0645\u062a\u0631 \u0645\u0631\u0628\u0639"}]}):'<div class="sub">\u062f\u0627\u062f\u0647 \u06a9\u0627\u0641\u06cc \u0646\u06cc\u0633\u062a.</div>'}
  </div>

  <div class="card"><h3>\u0646\u0631\u062e \u067e\u0648\u0631\u0633\u0627\u0646\u062a \u0645\u0646</h3>
    ${rules.length?rules.map(x=>`<div class="rule-card">
      <span class="rule-rate">${fmt(x.rate)} ${esc(COMMISSION_TYPES[x.type].unit)}</span>
      <span class="rule-scope">${esc(COMMISSION_TYPES[x.type].label)}${x.brand?" \u2014 \u0628\u0631\u0646\u062f "+esc(x.brand):""}${x.color?" \u2014 \u0631\u0646\u06af "+esc(x.color):""}${x.from||x.to?" \u2014 "+(x.from?faDate(x.from):"")+" \u062a\u0627 "+(x.to?faDate(x.to):"\u0627\u0643\u0646\u0648\u0646"):""}</span>
    </div>`).join(""):'<div class="empty">\u0646\u0631\u062e \u067e\u0648\u0631\u0633\u0627\u0646\u062a\u06cc \u0628\u0631\u0627\u06cc \u0634\u0645\u0627 \u062a\u0639\u0631\u06cc\u0641 \u0646\u0634\u062f\u0647 \u0627\u0633\u062a. \u0628\u0627 \u0645\u062f\u06cc\u0631 \u0647\u0645\u0627\u0647\u0646\u06af \u06a9\u0646\u06cc\u062f.</div>'}
  </div>

  <div class="card"><h3>\u0641\u0627\u06a9\u062a\u0648\u0631\u0647\u0627\u06cc \u0645\u0646 (${faNum(st.count)})</h3>
    ${recent.length?`<div class="tblwrap"><table class="tbl"><thead><tr>
      <th>\u0634\u0645\u0627\u0631\u0647</th><th>\u062a\u0627\u0631\u06cc\u062e</th><th>\u0645\u0634\u062a\u0631\u06cc</th><th>\u0645\u062a\u0631\u0627\u0698</th><th>\u0645\u0628\u0644\u063a</th><th>\u067e\u0648\u0631\u0633\u0627\u0646\u062a</th><th>\u0648\u0636\u0639\u06cc\u062a</th>
    </tr></thead><tbody>
    ${recent.map(v=>`<tr class="click" onclick="go('invoiceDetail','${v.id}')">
      <td class="num">${esc(String(v.number))}</td><td class="num">${faDate(v.date)}</td>
      <td>${esc((getCust(v.customerId)||{}).name||"\u2014")}</td>
      <td class="num">${area1(invArea(v))} m\u00b2</td>
      <td class="num money">${fmt(invTotal(v))}</td>
      <td class="num" style="color:#c47d00">${fmt(invoiceCommission(v).amount)}</td>
      <td><span class="badge ${statusBadge(v.status)}">${v.status}</span></td>
    </tr>`).join("")}
    </tbody></table></div>`:'<div class="empty">\u062f\u0631 \u0627\u06cc\u0646 \u062f\u0648\u0631\u0647 \u0641\u0627\u06a9\u062a\u0648\u0631\u06cc \u062b\u0628\u062a \u0646\u06a9\u0631\u062f\u0647\u200c\u0627\u06cc\u062f.</div>'}
  </div>`;
}

/* manager drill-down into one seller */
function pageSellerDetail(){
  if(!isManager())return pageMyDashboard();
  const who=route.param||"";
  const r=periodRange(dashPeriod);
  const st=sellerStats(who,r.from,r.to);
  const all=sellerStats(who,"","");
  const buckets=bucketsFor(dashPeriod==="year"?"month":"day",r.from||todayISO().slice(0,10),r.to||todayISO().slice(0,10));
  const trend=buckets.map(b=>{const s=sellerStats(who,b.from,b.to);return{label:b.label,sales:s.sales,commission:s.commission}});
  const rules=commissionRules().filter(x=>!x.seller||x.seller===who);
  const payouts=(DB.commissionPayouts||[]).filter(p=>p.seller===who).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  return `
  <div class="pagehead"><div><div class="h1">${esc(who)}</div><div class="sub">\u067e\u0631\u0648\u0646\u062f\u0647 \u0641\u0631\u0648\u0634\u0646\u062f\u0647 \u2014 ${r.label}</div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn sm" onclick="go('report')">\u2190 \u062f\u0627\u0634\u0628\u0648\u0631\u062f</button>
      <button class="btn primary sm" onclick="openPayCommission('${esc(who).replace(/'/g,"\\'")}')">\u067e\u0631\u062f\u0627\u062e\u062a \u067e\u0648\u0631\u0633\u0627\u0646\u062a</button>
    </div></div>
  <div class="rangebar">
    ${[["today","\u0627\u0645\u0631\u0648\u0632"],["week","\u0647\u0641\u062a\u0647"],["month","\u0645\u0627\u0647"],["year","\u0633\u0627\u0644"],["all","\u06a9\u0644"]]
      .map(([k,l])=>`<button class="chip ${dashPeriod===k?'active':''}" onclick="dashPeriod='${k}';rerender()">${l}</button>`).join("")}
  </div>
  <div class="kpi-grid">
    <div class="kpi pri"><div class="lbl">\u0641\u0631\u0648\u0634 \u062f\u0648\u0631\u0647</div><div class="val">${fmt(st.sales)}</div><div class="sub2">${faNum(st.count)} \u0641\u0627\u06a9\u062a\u0648\u0631</div></div>
    <div class="kpi"><div class="lbl">\u0645\u062a\u0631\u0627\u0698 / \u0648\u0631\u0642</div><div class="val">${area1(st.area)}</div><div class="sub2">m\u00b2 \u2014 ${fmt(st.sheets)} \u0648\u0631\u0642</div></div>
    <div class="kpi good"><div class="lbl">\u0633\u0648\u062f \u0627\u06cc\u062c\u0627\u062f\u0634\u062f\u0647</div><div class="val">${fmt(st.profit)}</div><div class="sub2">\u062a\u0648\u0645\u0627\u0646</div></div>
    <div class="kpi warn"><div class="lbl">\u067e\u0648\u0631\u0633\u0627\u0646\u062a \u062f\u0648\u0631\u0647</div><div class="val">${fmt(st.commission)}</div><div class="sub2">\u062a\u0648\u0645\u0627\u0646</div></div>
    <div class="kpi ${all.due>0?'bad':'good'}"><div class="lbl">\u0645\u0627\u0646\u062f\u0647 \u067e\u0648\u0631\u0633\u0627\u0646\u062a (\u06a9\u0644)</div><div class="val">${fmt(all.due)}</div><div class="sub2">\u067e\u0631\u062f\u0627\u062e\u062a\u200c\u0634\u062f\u0647 ${shortNum(all.paid)} \u0627\u0632 ${shortNum(all.commission)}</div></div>
  </div>
  <div class="chart-card"><h4>${ic("bar-chart",16)} \u0631\u0648\u0646\u062f \u0641\u0631\u0648\u0634</h4>
    ${svgBars(trend,{height:190,series:[{key:"sales",color:"#1976D2",label:"\u0641\u0631\u0648\u0634"},{key:"commission",color:"#FB8C00",label:"\u067e\u0648\u0631\u0633\u0627\u0646\u062a"}]})}
  </div>
  <div class="card"><h3>\u0646\u0631\u062e\u200c\u0647\u0627\u06cc \u067e\u0648\u0631\u0633\u0627\u0646\u062a \u0642\u0627\u0628\u0644 \u0627\u0639\u0645\u0627\u0644</h3>
    ${rules.length?rules.map(x=>`<div class="rule-card ${x.active===false?'off':''}">
      <span class="rule-rate">${fmt(x.rate)} ${esc(COMMISSION_TYPES[x.type].unit)}</span>
      <span class="rule-scope">${x.seller?"\u0627\u062e\u062a\u0635\u0627\u0635\u06cc":"\u0639\u0645\u0648\u0645\u06cc"}${x.brand?" \u2014 "+esc(x.brand):""}${x.color?" \u2014 "+esc(x.color):""}</span>
      <button class="btn sm" style="margin-inline-start:auto" onclick="openCommissionRule('${x.id}')">\u0648\u06cc\u0631\u0627\u06cc\u0634</button>
    </div>`).join(""):`<div class="empty">\u0646\u0631\u062e\u06cc \u062a\u0639\u0631\u06cc\u0641 \u0646\u0634\u062f\u0647. <button class="btn sm primary" onclick="openCommissionRule(null,'${esc(who).replace(/'/g,"\\'")}')">\u062a\u0639\u0631\u06cc\u0641 \u0646\u0631\u062e</button></div>`}
    <button class="btn sm" style="margin-top:8px" onclick="openCommissionRule(null,'${esc(who).replace(/'/g,"\\'")}')">+ \u0646\u0631\u062e \u062c\u062f\u06cc\u062f \u0628\u0631\u0627\u06cc \u0627\u06cc\u0646 \u0641\u0631\u0648\u0634\u0646\u062f\u0647</button>
  </div>
  <div class="card"><h3>\u067e\u0631\u062f\u0627\u062e\u062a\u200c\u0647\u0627\u06cc \u067e\u0648\u0631\u0633\u0627\u0646\u062a</h3>
    ${payouts.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>\u062a\u0627\u0631\u06cc\u062e</th><th>\u0645\u0628\u0644\u063a</th><th>\u062a\u0648\u0636\u06cc\u062d</th><th>\u062b\u0628\u062a \u062a\u0648\u0633\u0637</th></tr></thead><tbody>
      ${payouts.map(p=>`<tr><td class="num">${faDate(p.date)}</td><td class="num money">${fmt(p.amount)}</td><td>${esc(p.note||"\u2014")}</td><td>${esc(p.by||"\u2014")}</td></tr>`).join("")}
    </tbody></table></div>`:'<div class="empty">\u067e\u0631\u062f\u0627\u062e\u062a\u06cc \u062b\u0628\u062a \u0646\u0634\u062f\u0647.</div>'}
  </div>`;
}
function openPayCommission(seller){
  const st=sellerStats(seller,"","");
  openModal(`<h3>\u067e\u0631\u062f\u0627\u062e\u062a \u067e\u0648\u0631\u0633\u0627\u0646\u062a \u2014 ${esc(seller)}</h3>
    <div class="sumline"><span>\u067e\u0648\u0631\u0633\u0627\u0646\u062a \u06a9\u0644 \u0645\u062d\u0627\u0633\u0628\u0647\u200c\u0634\u062f\u0647</span><b class="num">${fmt(st.commission)}</b></div>
    <div class="sumline"><span>\u067e\u0631\u062f\u0627\u062e\u062a\u200c\u0634\u062f\u0647 \u062a\u0627 \u06a9\u0646\u0648\u0646</span><b class="num">\u2212 ${fmt(st.paid)}</b></div>
    <div class="sumline total"><span>\u0645\u0627\u0646\u062f\u0647 \u0642\u0627\u0628\u0644 \u067e\u0631\u062f\u0627\u062e\u062a</span><span class="num">${toman(Math.max(0,st.due))}</span></div>
    <div class="field" style="margin-top:12px"><label>\u0645\u0628\u0644\u063a \u067e\u0631\u062f\u0627\u062e\u062a (\u062a\u0648\u0645\u0627\u0646)</label>
      <input id="pc-amount" inputmode="numeric" value="${Math.max(0,st.due)?Number(Math.max(0,st.due)).toLocaleString("en-US"):""}" oninput="fmtPriceInput(this)"></div>
    <div class="field"><label>\u062a\u0648\u0636\u06cc\u062d</label><input id="pc-note" placeholder="\u0645\u062b\u0644\u0627\u064b \u062a\u0633\u0648\u06cc\u0647 \u0645\u0631\u062f\u0627\u062f"></div>
    <label class="toggle"><input type="checkbox" id="pc-exp" checked> \u0628\u0647\u200c\u0639\u0646\u0648\u0627\u0646 \u0647\u0632\u06cc\u0646\u0647 \u0647\u0645 \u062b\u0628\u062a \u0634\u0648\u062f</label>
    <div class="actions"><button class="btn primary" onclick="doPayCommission('${esc(seller).replace(/'/g,"\\'")}')">\u062b\u0628\u062a \u067e\u0631\u062f\u0627\u062e\u062a</button><button class="btn" onclick="closeModal()">\u0627\u0646\u0635\u0631\u0627\u0641</button></div>`);
}
function doPayCommission(seller){
  const amt=(document.getElementById("pc-amount")||{}).value;
  const note=(document.getElementById("pc-note")||{}).value;
  const alsoExp=(document.getElementById("pc-exp")||{}).checked;
  const r=payCommission(seller,amt,note,alsoExp);
  if(!r.ok){toast(r.error);return}
  closeModal();rerender();toast("\u067e\u0631\u062f\u0627\u062e\u062a \u067e\u0648\u0631\u0633\u0627\u0646\u062a \u062b\u0628\u062a \u0634\u062f.");
}

/* ================= v6: commission settings ================= */
function pageCommission(){
  if(!isManager())return '<div class="empty">\u0641\u0642\u0637 \u0645\u062f\u06cc\u0631 \u0628\u0647 \u0627\u06cc\u0646 \u0628\u062e\u0634 \u062f\u0633\u062a\u0631\u0633\u06cc \u062f\u0627\u0631\u062f.</div>';
  const rules=commissionRules();
  const sellers=allSellerNames();
  const stats=sellers.map(n=>sellerStats(n,"","")).filter(s=>s.commission>0||s.paid>0||s.count>0);
  const totalDue=stats.reduce((s,x)=>s+Math.max(0,x.due),0);
  return `
  <div class="pagehead"><div><div class="h1">\u067e\u0648\u0631\u0633\u0627\u0646\u062a \u0641\u0631\u0648\u0634\u0646\u062f\u06af\u0627\u0646</div><div class="sub">${faNum(rules.length)} \u0646\u0631\u062e \u062a\u0639\u0631\u06cc\u0641\u200c\u0634\u062f\u0647 \u2014 \u0645\u0627\u0646\u062f\u0647 \u06a9\u0644 ${toman(totalDue)}</div></div>
    <button class="btn primary" onclick="openCommissionRule()">${ic("plus",16)} \u0646\u0631\u062e \u062c\u062f\u06cc\u062f</button></div>

  <div class="notice blue">\u0646\u0631\u062e\u200c\u0647\u0627 \u0627\u0632 \u062e\u0627\u0635\u200c\u062a\u0631\u06cc\u0646 \u0628\u0647 \u0639\u0645\u0648\u0645\u06cc\u200c\u062a\u0631\u06cc\u0646 \u0627\u0639\u0645\u0627\u0644 \u0645\u06cc\u200c\u0634\u0648\u0646\u062f: \u0646\u0631\u062e \u06cc\u06a9 \u06a9\u0627\u0644\u0627\u06cc \u0645\u0634\u062e\u0635 \u0628\u0631 \u0646\u0631\u062e \u0628\u0631\u0646\u062f\u060c \u0648 \u0646\u0631\u062e \u0628\u0631\u0646\u062f \u0628\u0631 \u0646\u0631\u062e \u0639\u0645\u0648\u0645\u06cc \u0627\u0648\u0644\u0648\u06cc\u062a \u062f\u0627\u0631\u062f.</div>

  <div class="card"><h3>\u0646\u0631\u062e\u200c\u0647\u0627\u06cc \u067e\u0648\u0631\u0633\u0627\u0646\u062a</h3>
    ${rules.length?rules.map(x=>`<div class="rule-card ${x.active===false?'off':''}">
      <span class="rule-rate">${fmt(x.rate)}<br><span style="font-size:10px;font-weight:500;color:var(--md-on-surface-variant)">${esc(COMMISSION_TYPES[x.type].unit)}</span></span>
      <div style="flex:1;min-width:150px">
        <b style="font-size:13px">${x.seller?esc(x.seller):"\u0647\u0645\u0647 \u0641\u0631\u0648\u0634\u0646\u062f\u06af\u0627\u0646"}</b>
        <div class="rule-scope">${esc(COMMISSION_TYPES[x.type].label)}
          ${x.brand?" \u2022 \u0628\u0631\u0646\u062f: "+esc(x.brand):""}
          ${x.color?" \u2022 \u0631\u0646\u06af: "+esc(x.color):""}
          ${x.productId?" \u2022 \u06a9\u0627\u0644\u0627\u06cc \u062e\u0627\u0635":""}
          ${(x.from||x.to)?" \u2022 "+(x.from?faDate(x.from):"\u0627\u0628\u062a\u062f\u0627")+" \u062a\u0627 "+(x.to?faDate(x.to):"\u0627\u06a9\u0646\u0648\u0646"):""}</div>
        ${x.note?`<div class="sub">${esc(x.note)}</div>`:""}
      </div>
      <button class="btn sm" onclick="toggleCommissionRule('${x.id}')">${x.active===false?"\u0641\u0639\u0627\u0644 \u06a9\u0646":"\u063a\u06cc\u0631\u0641\u0639\u0627\u0644"}</button>
      <button class="btn sm" onclick="openCommissionRule('${x.id}')">\u0648\u06cc\u0631\u0627\u06cc\u0634</button>
      <button class="btn sm danger" onclick="if(confirm('\u0627\u06cc\u0646 \u0646\u0631\u062e \u062d\u0630\u0641 \u0634\u0648\u062f\u061f')){deleteCommissionRule('${x.id}');rerender()}">\u062d\u0630\u0641</button>
    </div>`).join(""):'<div class="empty">\u0647\u0646\u0648\u0632 \u0646\u0631\u062e\u06cc \u062a\u0639\u0631\u06cc\u0641 \u0646\u0634\u062f\u0647 \u0627\u0633\u062a.</div>'}
  </div>

  <div class="card"><h3>\u0648\u0636\u0639\u06cc\u062a \u067e\u0648\u0631\u0633\u0627\u0646\u062a \u0641\u0631\u0648\u0634\u0646\u062f\u06af\u0627\u0646</h3>
    ${stats.length?`<div class="tblwrap"><table class="tbl"><thead><tr>
      <th>\u0641\u0631\u0648\u0634\u0646\u062f\u0647</th><th>\u0641\u0631\u0648\u0634 \u06a9\u0644</th><th>\u0645\u062a\u0631\u0627\u0698</th><th>\u0648\u0631\u0642</th><th>\u067e\u0648\u0631\u0633\u0627\u0646\u062a \u06a9\u0644</th><th>\u067e\u0631\u062f\u0627\u062e\u062a\u200c\u0634\u062f\u0647</th><th>\u0645\u0627\u0646\u062f\u0647</th><th></th>
    </tr></thead><tbody>
    ${stats.map(s=>`<tr>
      <td><b>${esc(s.seller)}</b></td>
      <td class="num money">${fmt(s.sales)}</td>
      <td class="num">${area1(s.area)}</td>
      <td class="num">${fmt(s.sheets)}</td>
      <td class="num">${fmt(s.commission)}</td>
      <td class="num">${fmt(s.paid)}</td>
      <td class="num ${s.due>0?'pos':''}"><b>${fmt(s.due)}</b></td>
      <td><button class="btn sm" onclick="go('sellerDetail','${esc(s.seller).replace(/'/g,"\\'")}')">\u067e\u0631\u0648\u0646\u062f\u0647</button>
          <button class="btn sm primary" onclick="openPayCommission('${esc(s.seller).replace(/'/g,"\\'")}')">\u067e\u0631\u062f\u0627\u062e\u062a</button></td>
    </tr>`).join("")}
    </tbody></table></div>`:'<div class="empty">\u0641\u0631\u0648\u0634\u06cc \u062b\u0628\u062a \u0646\u0634\u062f\u0647 \u0627\u0633\u062a.</div>'}
  </div>`;
}
function toggleCommissionRule(id){
  const r=commissionRules().find(x=>x.id===id);if(!r)return;
  r.active=r.active===false;save();rerender();
}
function openCommissionRule(id,presetSeller){
  const r=id?commissionRules().find(x=>x.id===id):null;
  const sellers=allSellerNames();
  const brands=[...new Set((DB.products||[]).map(p=>p.brand))].sort((a,b)=>a.localeCompare(b,"fa"));
  const colors=[...new Set((DB.products||[]).map(p=>p.color))].sort((a,b)=>a.localeCompare(b,"fa"));
  const jFrom=r&&r.from?(()=>{const j=isoToJ(r.from);return `${j[0]}/${pad2(j[1])}/${pad2(j[2])}`})():"";
  const jTo=r&&r.to?(()=>{const j=isoToJ(r.to);return `${j[0]}/${pad2(j[1])}/${pad2(j[2])}`})():"";
  openModal(`<h3>${r?"\u0648\u06cc\u0631\u0627\u06cc\u0634 \u0646\u0631\u062e \u067e\u0648\u0631\u0633\u0627\u0646\u062a":"\u0646\u0631\u062e \u067e\u0648\u0631\u0633\u0627\u0646\u062a \u062c\u062f\u06cc\u062f"}</h3>
    <div class="grid2">
      <div class="field"><label>\u0641\u0631\u0648\u0634\u0646\u062f\u0647</label>
        <input id="cr-seller" list="cr-sellers" value="${esc(r?r.seller:(presetSeller||""))}" placeholder="\u062e\u0627\u0644\u06cc = \u0647\u0645\u0647 \u0641\u0631\u0648\u0634\u0646\u062f\u06af\u0627\u0646">
        <datalist id="cr-sellers">${sellers.map(s=>`<option value="${esc(s)}">`).join("")}</datalist></div>
      <div class="field"><label>\u0646\u0648\u0639 \u0645\u062d\u0627\u0633\u0628\u0647 *</label>
        <select id="cr-type" onchange="crUnitHint()">
          ${Object.entries(COMMISSION_TYPES).map(([k,v])=>`<option value="${k}" ${r&&r.type===k?"selected":""}>${v.label}</option>`).join("")}
        </select></div>
    </div>
    <div class="field"><label>\u0646\u0631\u062e * <span id="cr-unit" class="sub"></span></label>
      <input id="cr-rate" inputmode="numeric" value="${r?Number(r.rate).toLocaleString("en-US"):""}" placeholder="\u0645\u062b\u0644\u0627\u064b 30,000" oninput="fmtPriceInput(this)"></div>
    <div class="notice blue" style="font-size:12px">\u0645\u062b\u0627\u0644: \u0646\u0648\u0639 \u00ab\u0647\u0631 \u0645\u062a\u0631 \u0645\u0631\u0628\u0639\u00bb \u0628\u0627 \u0646\u0631\u062e \u06f3\u06f0\u066c\u06f0\u06f0\u06f0 \u2192 \u0641\u0631\u0648\u0634 \u06f1\u06f2\u06f0 \u0645\u062a\u0631 \u0645\u0631\u0628\u0639 = \u06f3\u066c\u06f6\u06f0\u06f0\u066c\u06f0\u06f0\u06f0 \u062a\u0648\u0645\u0627\u0646 \u067e\u0648\u0631\u0633\u0627\u0646\u062a</div>
    <div class="grid3">
      <div class="field"><label>\u0641\u0642\u0637 \u0628\u0631\u0646\u062f (\u0627\u062e\u062a\u06cc\u0627\u0631\u06cc)</label>
        <input id="cr-brand" list="cr-brands" value="${esc(r?r.brand:"")}"><datalist id="cr-brands">${brands.map(b=>`<option value="${esc(b)}">`).join("")}</datalist></div>
      <div class="field"><label>\u0641\u0642\u0637 \u0631\u0646\u06af (\u0627\u062e\u062a\u06cc\u0627\u0631\u06cc)</label>
        <input id="cr-color" list="cr-colors" value="${esc(r?r.color:"")}"><datalist id="cr-colors">${colors.map(c=>`<option value="${esc(c)}">`).join("")}</datalist></div>
      <div class="field"><label>\u0648\u0636\u0639\u06cc\u062a</label>
        <select id="cr-active"><option value="1" ${!r||r.active!==false?"selected":""}>\u0641\u0639\u0627\u0644</option><option value="0" ${r&&r.active===false?"selected":""}>\u063a\u06cc\u0631\u0641\u0639\u0627\u0644</option></select></div>
    </div>
    <div class="grid2">
      <div class="field"><label>\u0627\u0632 \u062a\u0627\u0631\u06cc\u062e (\u0627\u062e\u062a\u06cc\u0627\u0631\u06cc)</label><input id="cr-from" inputmode="numeric" value="${jFrom}" placeholder="\u06f1\u06f4\u06f0\u06f4/\u06f0\u06f1/\u06f0\u06f1" oninput="jdInput(this)"></div>
      <div class="field"><label>\u062a\u0627 \u062a\u0627\u0631\u06cc\u062e (\u0627\u062e\u062a\u06cc\u0627\u0631\u06cc)</label><input id="cr-to" inputmode="numeric" value="${jTo}" placeholder="\u06f1\u06f4\u06f0\u06f4/\u06f1\u06f2/\u06f2\u06f9" oninput="jdInput(this)"></div>
    </div>
    <div class="field"><label>\u06cc\u0627\u062f\u062f\u0627\u0634\u062a</label><input id="cr-note" value="${esc(r?r.note:"")}"></div>
    <div class="actions"><button class="btn primary" onclick="saveCommissionRule('${id||""}')">\u0630\u062e\u06cc\u0631\u0647</button><button class="btn" onclick="closeModal()">\u0627\u0646\u0635\u0631\u0627\u0641</button></div>`);
  crUnitHint();
}
function crUnitHint(){

function openStaff(id){

    <div class="field"><label>\u0646\u0627\u0645 \u06a9\u0627\u0645\u0644 *</label><input id="st-name" value="${esc(s?s.name:"")}" placeholder="\u0645\u062b\u0644\u0627\u064b \u0645\u0647\u0646\u062f\u0633 \u0639\u0642\u06cc\u0644\u06cc"></div>
    <div class="grid2">
      <div class="field"><label>\u062a\u0644\u0641\u0646</label><input id="st-phone" inputmode="tel" value="${esc(s?s.phone:"")}"></div>

        <option value="seller" ${!s||s.role!=="manager"?"selected":""}>\u0641\u0631\u0648\u0634\u0646\u062f\u0647</option>
        <option value="manager" ${s&&s.role==="manager"?"selected":""}>\u0645\u062f\u06cc\u0631</option></select></div>

    <div class="actions"><button class="btn primary" onclick="saveStaffModal('${id||""}')">\u0630\u062e\u06cc\u0631\u0647</button><button class="btn" onclick="closeModal()">\u0627\u0646\u0635\u0631\u0627\u0641</button></div>`);
}
function saveStaffModal(id){
  const g=x=>(document.getElementById(x)||{}).value||"";
  const r=upsertStaff({id:id||"",name:g("st-name"),phone:g("st-phone"),role:g("st-role"),
    active:(document.getElementById("st-active")||{}).checked});
  if(!r.ok){toast(r.error);return}
  closeModal();rerender();toast("\u0641\u0631\u0648\u0634\u0646\u062f\u0647 \u0630\u062e\u06cc\u0631\u0647 \u0634\u062f.");
}
function addExpenseCat(){
  const el=document.getElementById("set-newcat");
  const v=((el||{}).value||"").trim();
  if(!v)return;
  if(!DB.settings.expenseCategories.includes(v))DB.settings.expenseCategories.push(v);
  save();rerender();toast("\u0633\u0631\u0641\u0635\u0644 \u0627\u0636\u0627\u0641\u0647 \u0634\u062f.");
}
function removeExpenseCat(c){
  DB.settings.expenseCategories=expenseCategories().filter(x=>x!==c);
  save();rerender();
}
