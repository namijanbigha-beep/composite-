/* =============== v5: accounting self-check =============== */
function accountingAudit(){
  const issues=[];
  const invs=DB.invoices.filter(v=>v.type==="invoice");
  /* duplicate document numbers */
  const seen={};
  DB.invoices.forEach(v=>{const k=String(v.number);(seen[k]=seen[k]||[]).push(v)});
  Object.keys(seen).forEach(k=>{if(seen[k].length>1)issues.push({sev:"high",t:"\u0634\u0645\u0627\u0631\u0647 \u062a\u06a9\u0631\u0627\u0631\u06cc",d:"\u0634\u0645\u0627\u0631\u0647 "+k+" \u0631\u0648\u06cc "+faNum(seen[k].length)+" \u0633\u0646\u062f \u062b\u0628\u062a \u0634\u062f\u0647 \u0627\u0633\u062a.",fix:"fixNumbers"})});
  /* payments pointing at a document that no longer exists */
  const orphan=DB.payments.filter(p=>{
    if(!p.invoiceNumber&&!p.invoiceId)return false;
    return !DB.invoices.some(v=>(p.invoiceId&&v.id===p.invoiceId)||String(v.number)===String(p.invoiceNumber));
  });
  if(orphan.length)issues.push({sev:"med",t:"\u0631\u0633\u06cc\u062f \u0628\u062f\u0648\u0646 \u0641\u0627\u06a9\u062a\u0648\u0631",d:faNum(orphan.length)+" \u0631\u0633\u06cc\u062f \u0628\u0647 \u0641\u0627\u06a9\u062a\u0648\u0631\u06cc \u0627\u0634\u0627\u0631\u0647 \u062f\u0627\u0631\u0646\u062f \u06a9\u0647 \u062f\u06cc\u06af\u0631 \u0648\u062c\u0648\u062f \u0646\u062f\u0627\u0631\u062f.",fix:"fixOrphanPays"});
  /* payments without a customer */
  const noCust=DB.payments.filter(p=>!getCust(p.customerId));
  if(noCust.length)issues.push({sev:"high",t:"\u0631\u0633\u06cc\u062f \u0628\u062f\u0648\u0646 \u0645\u0634\u062a\u0631\u06cc",d:faNum(noCust.length)+" \u0631\u0633\u06cc\u062f \u0645\u0634\u062a\u0631\u06cc \u0645\u0639\u062a\u0628\u0631 \u0646\u062f\u0627\u0631\u062f."});
  /* invoices whose status disagrees with the money received */
  const badStatus=invs.filter(v=>{
    if(v.status==="\u0628\u0627\u0637\u0644\u200c\u0634\u062f\u0647")return false;
    const should=invRemain(v)<=0?"\u062a\u0633\u0648\u06cc\u0647\u200c\u0634\u062f\u0647":"\u062a\u0633\u0648\u06cc\u0647\u200c\u0646\u0634\u062f\u0647";
    return v.status!==should;
  });
  if(badStatus.length)issues.push({sev:"med",t:"\u0648\u0636\u0639\u06cc\u062a \u0646\u0627\u0647\u0645\u0627\u0647\u0646\u06af",d:faNum(badStatus.length)+" \u0641\u0627\u06a9\u062a\u0648\u0631 \u0648\u0636\u0639\u06cc\u062a\u0634\u0627\u0646 \u0628\u0627 \u0645\u0628\u0644\u063a \u062f\u0631\u06cc\u0627\u0641\u062a\u06cc \u0647\u0645\u062e\u0648\u0627\u0646\u06cc \u0646\u062f\u0627\u0631\u062f.",fix:"fixStatuses"});
  /* over-payment on a single invoice */
  const over=invs.filter(v=>v.status!=="\u0628\u0627\u0637\u0644\u200c\u0634\u062f\u0647"&&invPaid(v)>invTotal(v)+1);
  if(over.length)issues.push({sev:"med",t:"\u062f\u0631\u06cc\u0627\u0641\u062a \u0628\u06cc\u0634 \u0627\u0632 \u0645\u0628\u0644\u063a",d:faNum(over.length)+" \u0641\u0627\u06a9\u062a\u0648\u0631 \u0628\u06cc\u0634 \u0627\u0632 \u0645\u0628\u0644\u063a \u062e\u0648\u062f \u062f\u0631\u06cc\u0627\u0641\u062a \u062e\u0648\u0631\u062f\u0647 \u0627\u0633\u062a."});
  /* invoice lines with a broken product reference */
  const brokenLines=DB.invoices.filter(v=>v.items.some(i=>!getProd(i.productId)));
  if(brokenLines.length)issues.push({sev:"low",t:"\u06a9\u0627\u0644\u0627\u06cc \u062d\u0630\u0641\u200c\u0634\u062f\u0647",d:faNum(brokenLines.length)+" \u0633\u0646\u062f \u0631\u062f\u06cc\u0641\u06cc \u062f\u0627\u0631\u062f \u06a9\u0647 \u06a9\u0627\u0644\u0627\u06cc \u0622\u0646 \u062d\u0630\u0641 \u0634\u062f\u0647 (\u0645\u0628\u0627\u0644\u063a \u0633\u0646\u062f \u062f\u0631\u0633\u062a \u0627\u0633\u062a)."});
  /* negative stock */
  const neg=DB.products.filter(p=>(p.stock.qom||0)<0||(p.stock.jaf||0)<0);
  if(neg.length)issues.push({sev:"high",t:"\u0645\u0648\u062c\u0648\u062f\u06cc \u0645\u0646\u0641\u06cc",d:faNum(neg.length)+" \u06a9\u0627\u0644\u0627 \u0645\u0648\u062c\u0648\u062f\u06cc \u0645\u0646\u0641\u06cc \u062f\u0627\u0631\u062f."});
  /* zero / missing price lines */
  const zeroPrice=DB.invoices.filter(v=>v.status!=="\u0628\u0627\u0637\u0644\u200c\u0634\u062f\u0647"&&v.items.some(i=>!(i.price>0)));
  if(zeroPrice.length)issues.push({sev:"med",t:"\u0631\u062f\u06cc\u0641 \u0628\u062f\u0648\u0646 \u0642\u06cc\u0645\u062a",d:faNum(zeroPrice.length)+" \u0633\u0646\u062f \u0631\u062f\u06cc\u0641 \u0628\u0627 \u0642\u06cc\u0645\u062a \u0635\u0641\u0631 \u062f\u0627\u0631\u062f."});
  return {issues,orphan,badStatus,over,neg};
}
function fixStatuses(){
  let n=0;
  DB.invoices.filter(v=>v.type==="invoice"&&v.status!=="\u0628\u0627\u0637\u0644\u200c\u0634\u062f\u0647").forEach(v=>{
    const before=v.status;refreshInvStatus(v);if(v.status!==before)n++;
  });
  save();render();toast(n?faNum(n)+" \u0641\u0627\u06a9\u062a\u0648\u0631 \u0627\u0635\u0644\u0627\u062d \u0634\u062f.":"\u0647\u0645\u0647 \u0648\u0636\u0639\u06cc\u062a\u200c\u0647\u0627 \u062f\u0631\u0633\u062a \u0628\u0648\u062f.");
}
function fixOrphanPays(){
  const {orphan}=accountingAudit();
  if(!orphan.length){toast("\u0645\u0648\u0631\u062f\u06cc \u0646\u06cc\u0633\u062a.");return}
  if(!confirm("\u0627\u062a\u0635\u0627\u0644 "+orphan.length+" \u0631\u0633\u06cc\u062f \u0628\u0647 \u0641\u0627\u06a9\u062a\u0648\u0631 \u062d\u0630\u0641\u200c\u0634\u062f\u0647 \u0628\u0627\u0632 \u0634\u0648\u062f\u061f \u0645\u0628\u0644\u063a \u0631\u0633\u06cc\u062f\u0647\u0627 \u062f\u0633\u062a\u200c\u0646\u062e\u0648\u0631\u062f\u0647 \u0628\u0627\u0642\u06cc \u0645\u06cc\u200c\u0645\u0627\u0646\u062f."))return;
  orphan.forEach(p=>{p.invoiceId="";p.invoiceNumber="";p.note=(p.note?p.note+" \u2014 ":"")+"\u0641\u0627\u06a9\u062a\u0648\u0631 \u0645\u0631\u062c\u0639 \u06cc\u0627\u0641\u062a \u0646\u0634\u062f"});
  save();render();toast("\u0627\u0635\u0644\u0627\u062d \u0634\u062f.");
}
function fixNumbers(){
  const nb=numbering();
  const nums=DB.invoices.filter(v=>v.type==="invoice").map(v=>Number(latinDigits(String(v.number)).replace(/[^0-9]/g,""))).filter(n=>n>0);
  const pnums=DB.invoices.filter(v=>v.type==="proforma").map(v=>Number(latinDigits(String(v.number)).replace(/[^0-9]/g,""))).filter(n=>n>0);
  nb.invNext=Math.max(nb.invNext||1,(nums.length?Math.max(...nums):0)+1);
  nb.proNext=Math.max(nb.proNext||1,(pnums.length?Math.max(...pnums):0)+1);
  DB.counters.invoice=nb.invNext-1;DB.counters.proforma=nb.proNext-1;
  save();render();toast("\u0634\u0645\u0627\u0631\u0647 \u0628\u0639\u062f\u06cc \u0627\u0633\u0646\u0627\u062f \u062c\u0644\u0648\u062a\u0631 \u0627\u0632 \u0628\u0632\u0631\u06af\u062a\u0631\u06cc\u0646 \u0634\u0645\u0627\u0631\u0647 \u0645\u0648\u062c\u0648\u062f \u062a\u0646\u0638\u06cc\u0645 \u0634\u062f.");
}
let accTab="pnl",accPeriod="month";
function arAging(){
  const today=new Date(todayISO().slice(0,10));
  const buckets={cur:0,d30:0,d60:0,d90:0};
  const rows=[];
  (DB.invoices||[]).filter(v=>v.type==="invoice"&&v.status!=="\u0628\u0627\u0637\u0644\u200c\u0634\u062f\u0647").forEach(v=>{
    const rem=invRemain(v);
    if(rem<=0)return;
    const age=Math.floor((today-new Date(String(v.date).slice(0,10)))/86400000);
    const k=age<=30?"cur":age<=60?"d30":age<=90?"d60":"d90";
    buckets[k]+=rem;
    rows.push({v,rem,age,k});
  });
  rows.sort((a,b)=>b.age-a.age);
  return{buckets,rows};
}
function journalEntries(from,to){
  const out=[];
  (DB.invoices||[]).filter(v=>v.type==="invoice"&&v.status!=="\u0628\u0627\u0637\u0644\u200c\u0634\u062f\u0647"&&inRange(v.date,from,to))
    .forEach(v=>out.push({date:v.date,type:"sale",label:"\u0641\u0627\u06a9\u062a\u0648\u0631 "+v.number+" \u2014 "+(((getCust(v.customerId)||{}).name)||"\u2014"),
      inflow:0,accrual:invTotal(v),outflow:0,ref:v.id,by:v.createdBy||""}));
  (DB.payments||[]).filter(p=>inRange(p.date,from,to))
    .forEach(p=>out.push({date:p.date,type:"receipt",label:"\u062f\u0631\u06cc\u0627\u0641\u062a "+(p.number||"")+" \u2014 "+(((getCust(p.customerId)||{}).name)||"\u2014")+(p.method?" ("+p.method+")":""),
      inflow:Number(p.amount)||0,accrual:0,outflow:0,ref:p.id}));
  (DB.expenses||[]).filter(e=>inRange(e.date,from,to))
    .forEach(e=>out.push({date:e.date,type:"expense",label:"\u0647\u0632\u06cc\u0646\u0647 "+e.category+(e.payee?" \u2014 "+e.payee:""),
      inflow:0,accrual:0,outflow:Number(e.amount)||0,ref:e.id,by:e.createdBy||""}));
  out.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  return out;
}

function accCash(f,r){
  const byMethod={};
  (DB.payments||[]).filter(p=>inRange(p.date,r.from,r.to)).forEach(p=>{const m=p.method||"\u0646\u0627\u0645\u0634\u062e\u0635";byMethod[m]=(byMethod[m]||0)+(Number(p.amount)||0)});
  const outByMethod={};
  f.exps.forEach(e=>{const m=e.method||"\u0646\u0642\u062f\u06cc";outByMethod[m]=(outByMethod[m]||0)+e.amount});
  const net=f.collected-(f.opex+f.purchases);
  const buckets=bucketsFor(accPeriod==="year"||accPeriod==="all"?"month":"day",
    r.from||todayISO().slice(0,10),r.to||todayISO().slice(0,10));
  const flow=buckets.map(b=>{
    const inn=(DB.payments||[]).filter(p=>inRange(p.date,b.from,b.to)).reduce((s,p)=>s+(Number(p.amount)||0),0);
    const outt=expensesIn(b.from,b.to).reduce((s,e)=>s+e.amount,0);
    return{label:b.label,inn,outt,net:inn-outt};
  });
  return `
  <div class="kpi-grid">
    <div class="kpi good"><div class="lbl">\u0648\u062c\u0648\u0647 \u062f\u0631\u06cc\u0627\u0641\u062a\u06cc</div><div class="val">${fmt(f.collected)}</div><div class="sub2">\u062a\u0648\u0645\u0627\u0646</div></div>
    <div class="kpi bad"><div class="lbl">\u0648\u062c\u0648\u0647 \u067e\u0631\u062f\u0627\u062e\u062a\u06cc</div><div class="val">${fmt(f.opex+f.purchases)}</div><div class="sub2">\u062a\u0648\u0645\u0627\u0646</div></div>
    <div class="kpi ${net>=0?'good':'bad'}"><div class="lbl">\u062e\u0627\u0644\u0635 \u06af\u0631\u062f\u0634 \u0648\u062c\u0648\u0647</div><div class="val">${fmt(net)}</div><div class="sub2">\u062a\u0648\u0645\u0627\u0646</div></div>
    <div class="kpi warn"><div class="lbl">\u0641\u0631\u0648\u0634 \u0648\u0635\u0648\u0644\u200c\u0646\u0634\u062f\u0647</div><div class="val">${fmt(Math.max(0,f.sales-f.collected))}</div><div class="sub2">\u0627\u062e\u062a\u0644\u0627\u0641 \u0641\u0631\u0648\u0634 \u0648 \u0648\u0635\u0648\u0644\u06cc \u062f\u0648\u0631\u0647</div></div>
  </div>
  <div class="chart-card"><h4>${ic("bar-chart",16)} \u0648\u0631\u0648\u062f \u0648 \u062e\u0631\u0648\u062c \u0648\u062c\u0647</h4>
    ${svgBars(flow,{height:200,series:[{key:"inn",color:"#43A047",label:"\u062f\u0631\u06cc\u0627\u0641\u062a"},{key:"outt",color:"#E53935",label:"\u067e\u0631\u062f\u0627\u062e\u062a"}]})}
    <div class="legend"><span><i style="background:#43A047"></i>\u062f\u0631\u06cc\u0627\u0641\u062a</span><span><i style="background:#E53935"></i>\u067e\u0631\u062f\u0627\u062e\u062a</span></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px">
    <div class="card"><h3>\u062f\u0631\u06cc\u0627\u0641\u062a\u200c\u0647\u0627 \u0628\u0647 \u062a\u0641\u06a9\u06cc\u06a9 \u0631\u0648\u0634</h3>
      ${Object.keys(byMethod).length?Object.entries(byMethod).sort((a,b)=>b[1]-a[1]).map(([m,v])=>`<div class="sumline"><span>${esc(m)}</span><b class="num">${fmt(v)}</b></div>`).join(""):'<div class="empty">\u062f\u0631\u06cc\u0627\u0641\u062a\u06cc \u0646\u06cc\u0633\u062a</div>'}</div>
    <div class="card"><h3>\u067e\u0631\u062f\u0627\u062e\u062a\u200c\u0647\u0627 \u0628\u0647 \u062a\u0641\u06a9\u06cc\u06a9 \u0631\u0648\u0634</h3>
      ${Object.keys(outByMethod).length?Object.entries(outByMethod).sort((a,b)=>b[1]-a[1]).map(([m,v])=>`<div class="sumline"><span>${esc(m)}</span><b class="num">${fmt(v)}</b></div>`).join(""):'<div class="empty">\u067e\u0631\u062f\u0627\u062e\u062a\u06cc \u0646\u06cc\u0633\u062a</div>'}</div>
  </div>`;
}

function accCheck(){
  const{issues}=accountingAudit();
  const invs=(DB.invoices||[]).filter(v=>v.type==="invoice"&&v.status!=="\u0628\u0627\u0637\u0644\u200c\u0634\u062f\u0647");
  const sales=invs.reduce((s,v)=>s+invTotal(v),0);
  const received=(DB.payments||[]).reduce((s,p)=>s+(Number(p.amount)||0),0);
  const receivable=(DB.customers||[]).reduce((s,c)=>{const b=custBalance(c.id);return s+(b>0?b:0)},0);
  const credit=(DB.customers||[]).reduce((s,c)=>{const b=custBalance(c.id);return s+(b<0?-b:0)},0);
  const diff=(sales-received)-(receivable-credit);
  const sev=s=>s==="high"?"red":s==="med"?"orange":"blue";
  return `
  <div class="card"><h3>\u2696\ufe0f \u062a\u0631\u0627\u0632 \u06a9\u0644\u06cc</h3>
    <div class="sumline"><span>\u0641\u0631\u0648\u0634 \u062e\u0627\u0644\u0635 (\u0647\u0645\u0647 \u062f\u0648\u0631\u0627\u0646)</span><b class="num">${fmt(sales)}</b></div>
    <div class="sumline"><span>\u062f\u0631\u06cc\u0627\u0641\u062a\u06cc \u06a9\u0644</span><b class="num">\u2212 ${fmt(received)}</b></div>
    <div class="sumline total"><span>\u0645\u0627\u0646\u062f\u0647 \u062f\u0641\u062a\u0631\u06cc</span><span class="num">${toman(sales-received)}</span></div>
    <div class="sumline"><span>\u0645\u0627\u0646\u062f\u0647 \u0645\u0634\u062a\u0631\u06cc\u0627\u0646 (\u0637\u0644\u0628 \u2212 \u0628\u0633\u062a\u0627\u0646\u06a9\u0627\u0631)</span><b class="num">${fmt(receivable-credit)}</b></div>
    <div class="notice ${Math.abs(diff)<1?"green":"orange"}" style="margin-top:10px">
      ${Math.abs(diff)<1?"\u2713 \u062f\u0641\u062a\u0631 \u0641\u0631\u0648\u0634 \u0648 \u0645\u0627\u0646\u062f\u0647 \u0645\u0634\u062a\u0631\u06cc\u0627\u0646 \u062f\u0642\u06cc\u0642\u0627\u064b \u062a\u0631\u0627\u0632 \u0627\u0633\u062a."
        :"\u0627\u062e\u062a\u0644\u0627\u0641 "+fmt(Math.abs(diff))+" \u062a\u0648\u0645\u0627\u0646 \u2014 \u0645\u0639\u0645\u0648\u0644\u0627\u064b \u0631\u0633\u06cc\u062f \u0628\u062f\u0648\u0646 \u0645\u0634\u062a\u0631\u06cc \u06cc\u0627 \u0641\u0627\u06a9\u062a\u0648\u0631 \u0628\u0627\u0637\u0644\u200c\u0634\u062f\u0647\u200c\u0627\u06cc \u06a9\u0647 \u067e\u0648\u0644\u0634 \u062f\u0631\u06cc\u0627\u0641\u062a \u0634\u062f\u0647."}
    </div>
  </div>
  <div class="card"><h3>\U0001FA7A \u0628\u0631\u0631\u0633\u06cc \u062e\u0648\u062f\u06a9\u0627\u0631 (${faNum(issues.length)} \u0645\u0648\u0631\u062f)</h3>
    ${issues.length?issues.map(x=>`<div class="notice ${sev(x.sev)}" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <b>${esc(x.t)}</b><span style="flex:1">${esc(x.d)}</span>
      ${x.fix?`<button class="btn sm" onclick="${x.fix}()">\u0627\u0635\u0644\u0627\u062d \u062e\u0648\u062f\u06a9\u0627\u0631</button>`:""}
    </div>`).join(""):'<div class="notice green">\u2713 \u0647\u06cc\u0686 \u0645\u063a\u0627\u06cc\u0631\u062a\u06cc \u067e\u06cc\u062f\u0627 \u0646\u0634\u062f.</div>'}
  </div>`;
}

function invoiceToPayload(v){
  return{
    _format:"composite-invoice-edit",_version:1,
    exportedAt:new Date().toISOString(),
    source:{id:v.id,number:String(v.number),type:v.type,date:v.date,createdBy:v.createdBy||""},
    customer:(()=>{const c=getCust(v.customerId);return c?{id:c.id,name:c.name,phone:c.phone||"",address:c.address||""}:null})(),
    discount:Number(v.discount)||0,
    shipping:Number(v.shipping)||0,
    showShipping:v.showShipping!==false,
    card:v.card||"",sheba:v.sheba||"",acctName:v.acctName||"",
    notes:v.notes||"",
    lengthPricing:v.lengthPricing||null,
    items:(v.items||[]).map(i=>({
      productId:i.productId,name:i.name,brand:(getProd(i.productId)||{}).brand||"",
      color:(getProd(i.productId)||{}).color||"",
      width:i.width,length:i.length,qty:i.qty,price:i.price,unit:i.unit||"sheet",
      unitPrice:i.unitPrice||i.price,wh:i.wh||"qom",cost:i.cost||0
    }))
  };
}
function exportInvoiceForEdit(id){
  const v=DB.invoices.find(x=>x.id===id);if(!v)return;
  const payload=invoiceToPayload(v);
  const blob=new Blob([JSON.stringify(payload,null,1)],{type:"application/json"});
  const nm=(v.type==="proforma"?"\u067e\u06cc\u0634\u200c\u0641\u0627\u06a9\u062a\u0648\u0631":"\u0641\u0627\u06a9\u062a\u0648\u0631")+"-"+String(v.number)+"-\u0648\u06cc\u0631\u0627\u06cc\u0634.json";
  saveBlob(blob,nm);
  /* a readable spreadsheet alongside the machine-readable file */
  const rows=[["\u0634\u0645\u0627\u0631\u0647 \u0633\u0646\u062f",String(v.number)],["\u0645\u0634\u062a\u0631\u06cc",(getCust(v.customerId)||{}).name||""],["\u062a\u0627\u0631\u06cc\u062e",faDate(v.date)],[""],
    ["\u0631\u062f\u06cc\u0641","\u0628\u0631\u0646\u062f","\u0631\u0646\u06af","\u0639\u0631\u0636","\u0637\u0648\u0644","\u062a\u0639\u062f\u0627\u062f","\u0642\u06cc\u0645\u062a \u0647\u0631 \u0648\u0631\u0642","\u0645\u0628\u0644\u063a"]];
  (v.items||[]).forEach((i,x)=>{const p=getProd(i.productId)||{};
    rows.push([x+1,p.brand||"",p.color||"",i.width,i.length,i.qty,i.price,i.qty*i.price])});
  rows.push([""],["\u062a\u062e\u0641\u06cc\u0641",v.discount||0],["\u062d\u0645\u0644",v.shipping||0],["\u0645\u0628\u0644\u063a \u0646\u0647\u0627\u06cc\u06cc",invTotal(v)]);
  dlCSV((v.type==="proforma"?"\u067e\u06cc\u0634\u200c\u0641\u0627\u06a9\u062a\u0648\u0631":"\u0641\u0627\u06a9\u062a\u0648\u0631")+"-"+String(v.number)+".csv",rows);
  toast("\u062f\u0648 \u0641\u0627\u06cc\u0644 \u062f\u0627\u0646\u0644\u0648\u062f \u0634\u062f: JSON \u0628\u0631\u0627\u06cc \u0628\u0627\u0632\u06af\u0631\u062f\u0627\u0646\u062f\u0646 \u0648 CSV \u0628\u0631\u0627\u06cc \u0645\u0634\u0627\u0647\u062f\u0647.");
}
function payloadToDraft(pl,type){
  if(!pl||pl._format!=="composite-invoice-edit")return{ok:false,error:"\u0641\u0627\u06cc\u0644 \u0645\u0639\u062a\u0628\u0631 \u0646\u06cc\u0633\u062a."};
  const t=type||(pl.source&&pl.source.type)||"invoice";
  draft=newDraft(t==="proforma"?"proforma":"invoice");
  /* customer: match by id, then phone, then name */
  let cid=null;
  if(pl.customer){
    const c=DB.customers.find(x=>x.id===pl.customer.id)
      ||DB.customers.find(x=>pl.customer.phone&&x.phone===pl.customer.phone)
      ||DB.customers.find(x=>x.name===pl.customer.name);
    if(c)cid=c.id;
    else{
      const nc={id:uid(),name:pl.customer.name||"\u0645\u0634\u062a\u0631\u06cc \u0628\u0627\u0632\u06cc\u0627\u0628\u06cc\u200c\u0634\u062f\u0647",phone:pl.customer.phone||"",address:pl.customer.address||""};
      DB.customers.push(nc);save();cid=nc.id;
    }
  }
  draft.customerId=cid;
  draft.discount=Number(pl.discount)||0;
  draft.shipping=Number(pl.shipping)||0;
  draft.showShipping=pl.showShipping!==false;
  draft.card=pl.card||draft.card;draft.sheba=pl.sheba||draft.sheba;draft.acctName=pl.acctName||draft.acctName;
  draft.notes=pl.notes||"";
  if(pl.lengthPricing)draft.lengthPricing=pl.lengthPricing;
  SalesCart.syncFromDraft(draft);
  let ok=0;const missing=[];
  (pl.items||[]).forEach(i=>{
    let p=getProd(i.productId);
    if(!p)p=(DB.products||[]).find(x=>x.brand===i.brand&&x.color===i.color&&x.width===i.width&&x.length===i.length);
    if(!p){missing.push(i.name||((i.brand||"")+" "+(i.width||"")+"\u00d7"+(i.length||"")));return}
    const r=SalesCart.addItem(p.id,{quantity:Number(i.qty)||1,price:Number(i.price)||0,
      warehouse:i.wh||"qom",unit:i.unit||"sheet"});
    if(r&&r.success)ok++;else missing.push((i.name||"")+": "+((r&&r.error)||""));
  });
  SalesCart.syncToDraft(draft);saveDraft();
  return{ok:true,added:ok,missing};
}

function doReissue(id){
  const v=DB.invoices.find(x=>x.id===id);if(!v)return;
  const type=(document.getElementById("ri-type")||{}).value||"invoice";
  const oldAct=(document.getElementById("ri-old")||{}).value||"keep";
  const wantFile=(document.getElementById("ri-file")||{}).checked;
  const payload=invoiceToPayload(v);
  if(wantFile){
    const blob=new Blob([JSON.stringify(payload,null,1)],{type:"application/json"});
    saveBlob(blob,(v.type==="proforma"?"\u067e\u06cc\u0634\u200c\u0641\u0627\u06a9\u062a\u0648\u0631":"\u0641\u0627\u06a9\u062a\u0648\u0631")+"-"+String(v.number)+"-\u067e\u0634\u062a\u06cc\u0628\u0627\u0646.json");
  }
  const res=payloadToDraft(payload,type);
  if(!res.ok){toast(res.error);return}
  if(oldAct==="cancel"&&v.type==="invoice"&&v.status!=="\u0628\u0627\u0637\u0644\u200c\u0634\u062f\u0647"){
    v.status="\u0628\u0627\u0637\u0644\u200c\u0634\u062f\u0647";
    v.cancelReason="\u0635\u062f\u0648\u0631 \u0645\u062c\u062f\u062f \u0628\u0627 \u0627\u0635\u0644\u0627\u062d";
    v.items.forEach(i=>{try{InventoryEngine.cancelSale({productId:i.productId,warehouseId:i.wh,quantity:i.qty,
      referenceType:"invoice",referenceId:v.id,reason:"\u0627\u0628\u0637\u0627\u0644 \u0628\u0631\u0627\u06cc \u0635\u062f\u0648\u0631 \u0645\u062c\u062f\u062f"})}catch(e){}});
    logAct("cancel","\u0627\u0628\u0637\u0627\u0644 \u0641\u0627\u06a9\u062a\u0648\u0631 "+v.number+" \u0628\u0631\u0627\u06cc \u0635\u062f\u0648\u0631 \u0645\u062c\u062f\u062f");
    save();
  }else if(oldAct==="delete"&&canDeleteDocs()){
    if(v.type!=="proforma"&&v.status!=="\u0628\u0627\u0637\u0644\u200c\u0634\u062f\u0647"){
      v.items.forEach(i=>{try{InventoryEngine.cancelSale({productId:i.productId,warehouseId:i.wh,quantity:i.qty,
        referenceType:"invoice",referenceId:v.id,reason:"\u062d\u0630\u0641 \u0628\u0631\u0627\u06cc \u0635\u062f\u0648\u0631 \u0645\u062c\u062f\u062f"})}catch(e){}});
    }
    DB.payments=(DB.payments||[]).filter(p=>!((p.invoiceId&&p.invoiceId===v.id)||String(p.invoiceNumber)===String(v.number)));
    DB.invoices=DB.invoices.filter(x=>x.id!==v.id);
    auditLog("delete_document","\u062d\u0630\u0641 \u0628\u0631\u0627\u06cc \u0635\u062f\u0648\u0631 \u0645\u062c\u062f\u062f \u2014 "+v.number,v,null,{module:"sales"});
    save();rebuildIndex();
  }
  closeModal();
  go("newInvoice");
  toast("\u067e\u06cc\u0634\u200c\u0646\u0648\u06cc\u0633 \u0622\u0645\u0627\u062f\u0647 \u0627\u0633\u062a \u2014 "+faNum(res.added)+" \u0631\u062f\u06cc\u0641"
    +(res.missing.length?" \u060c "+faNum(res.missing.length)+" \u0631\u062f\u06cc\u0641 \u0645\u0646\u062a\u0642\u0644 \u0646\u0634\u062f":""));
}
function importInvoiceFile(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      let pl=null;
      try{pl=JSON.parse(String(rd.result))}catch(e){toast("\u0641\u0627\u06cc\u0644 \u0645\u0639\u062a\u0628\u0631 \u0646\u06cc\u0633\u062a.");return}
      const res=payloadToDraft(pl);
      if(!res.ok){toast(res.error);return}
      go("newInvoice");
      if(res.missing.length){
        openModal(`<h3>\u0628\u0627\u0632\u06af\u0631\u062f\u0627\u0646\u062f\u0647 \u0634\u062f</h3>
          <div class="notice green">${faNum(res.added)} \u0631\u062f\u06cc\u0641 \u0628\u0627\u0632\u06af\u0631\u062f\u0627\u0646\u062f\u0647 \u0634\u062f.</div>
          <div class="notice orange">${faNum(res.missing.length)} \u0631\u062f\u06cc\u0641 \u067e\u06cc\u062f\u0627 \u0646\u0634\u062f (\u06a9\u0627\u0644\u0627 \u062f\u0631 \u0627\u0646\u0628\u0627\u0631 \u0646\u06cc\u0633\u062a):</div>
          <div style="max-height:180px;overflow:auto;font-size:12.5px;margin:8px 0">
            ${res.missing.slice(0,20).map(m=>`<div style="padding:2px 0">\u2022 ${esc(m)}</div>`).join("")}</div>
          <div class="actions"><button class="btn primary" onclick="closeModal()">\u0628\u0627\u0634\u0647</button></div>`);
      }else toast(faNum(res.added)+" \u0631\u062f\u06cc\u0641 \u0627\u0632 \u0641\u0627\u06cc\u0644 \u0628\u0627\u0632\u06af\u0631\u062f\u0627\u0646\u062f\u0647 \u0634\u062f.");
    };
    rd.readAsText(f);
  };
  inp.click();
}

function xlsSafeSheetName(n,used){
  let s=String(n||"Sheet").replace(/[\\\/\?\*\[\]:]/g,"-").trim().slice(0,31)||"Sheet";
  let base=s,i=2;
  while(used.has(s)){s=(base.slice(0,28)+" "+i);i++}
  used.add(s);return s;
}
/* Matrix sheet for one colour, identical layout to the company workbook */
function buildColorMatrixRows(color,products){
  const brands=[...new Set(products.map(p=>p.brand))].sort((a,b)=>a.localeCompare(b,"fa"));
  const cols=brands.map(b=>{
    const lens=[];
    products.filter(p=>p.brand===b).forEach(p=>{const n=totStock(p);for(let i=0;i<n;i++)lens.push(p.length)});
    lens.sort((a,b2)=>b2-a);
    return {brand:b,lens};
  }).filter(c=>c.lens.length);
  if(!cols.length)return null;
  const maxRows=Math.max(...cols.map(c=>c.lens.length));
  const rows=[];
  rows.push(["\u06a9\u0627\u0645\u067e\u0648\u0632\u06cc\u062a "+color]);
  rows.push(["\u0631\u062f\u06cc\u0641",...cols.map(c=>c.brand)]);
  for(let i=0;i<maxRows;i++)rows.push([i+1,...cols.map(c=>c.lens[i]!=null?c.lens[i]:"")]);
  rows.push([]);
  rows.push(["",...cols.map(c=>c.brand),"\u062c\u0645\u0639 \u06a9\u0644"]);
  const cm=cols.map(c=>c.lens.reduce((s,l)=>s+l,0));
  const ml=cols.map(c=>Number((c.lens.reduce((s,l)=>s+l,0)/100).toFixed(2)));
  const m2=cols.map((c,i)=>{
    const prods=products.filter(p=>p.brand===c.brand);
    const w=prods.length?prods[0].width:125;
    return Number((cm[i]*w/10000).toFixed(4));
  });
  rows.push(["\u0633\u0627\u0646\u062a\u06cc \u0645\u062a\u0631",...cm,cm.reduce((s,x)=>s+x,0)]);
  rows.push(["\u0645\u062a\u0631 \u0637\u0648\u0644",...ml,Number(ml.reduce((s,x)=>s+x,0).toFixed(2))]);
  rows.push(["\u0645\u062a\u0631 \u0645\u0631\u0628\u0639",...m2,Number(m2.reduce((s,x)=>s+x,0).toFixed(4))]);
  return {rows,cols};
}
function exportInventoryExcel(){
  if(!window.XLSX){toast("\u06a9\u062a\u0627\u0628\u062e\u0627\u0646\u0647 XLSX \u0628\u0627\u0631\u06af\u0630\u0627\u0631\u06cc \u0646\u0634\u062f\u0647 \u0627\u0633\u062a. \u0627\u062a\u0635\u0627\u0644 \u0627\u06cc\u0646\u062a\u0631\u0646\u062a \u0631\u0627 \u0628\u0631\u0631\u0633\u06cc \u06a9\u0646\u06cc\u062f.");return}
  const wb=XLSX.utils.book_new();
  const used=new Set();
  const inStock=DB.products.filter(p=>totStock(p)>0);
  if(!inStock.length){toast("\u06a9\u0627\u0644\u0627\u06cc \u0645\u0648\u062c\u0648\u062f\u06cc \u0628\u0631\u0627\u06cc \u062e\u0631\u0648\u062c\u06cc \u0648\u062c\u0648\u062f \u0646\u062f\u0627\u0631\u062f.");return}

  const thinB={top:{style:"thin",color:{rgb:"D5DBE3"}},bottom:{style:"thin",color:{rgb:"D5DBE3"}},left:{style:"thin",color:{rgb:"D5DBE3"}},right:{style:"thin",color:{rgb:"D5DBE3"}}};

  /* ---- one matrix sheet per colour (the format you send us) ---- */
  const colors=[...new Set(inStock.map(p=>p.color))].sort((a,b)=>a.localeCompare(b,"fa"));
  colors.forEach(color=>{
    const built=buildColorMatrixRows(color,inStock.filter(p=>p.color===color));
    if(!built)return;
    const ws=XLSX.utils.aoa_to_sheet(built.rows);
    ws["!cols"]=[{wch:14},...built.cols.map(()=>({wch:15})),{wch:12}];
    const range=XLSX.utils.decode_range(ws["!ref"]);
    for(let r=range.s.r;r<=range.e.r;r++){
      for(let c=range.s.c;c<=range.e.c;c++){
        const a=XLSX.utils.encode_cell({r,c});if(!ws[a])continue;
        if(r===0)ws[a].s={font:{bold:true,sz:13,color:{rgb:"FFFFFF"}},fill:{fgColor:{rgb:"1976D2"}},alignment:{horizontal:"center"}};
        else if(r===1)ws[a].s={font:{bold:true,sz:10,color:{rgb:"FFFFFF"}},fill:{fgColor:{rgb:"455A64"}},alignment:{horizontal:"center"},border:thinB};
        else if(r>=range.e.r-3)ws[a].s={font:{bold:true,sz:10},fill:{fgColor:{rgb:"E8F1FB"}},alignment:{horizontal:"center"},border:thinB};
        else ws[a].s={font:{sz:10},alignment:{horizontal:"center"},border:thinB,fill:{fgColor:{rgb:r%2?"FFFFFF":"F7F9FC"}}};
      }
    }
    ws["!freeze"]={xSplit:1,ySplit:2};
    XLSX.utils.book_append_sheet(wb,ws,xlsSafeSheetName(color,used));
  });

  /* ---- full detail sheet (this is what re-imports 1:1) ---- */

function parseCSV(t){
  const NL=String.fromCharCode(10),CR=String.fromCharCode(13);
  if(t.charCodeAt(0)===65279)t=t.slice(1);
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===","){row.push(cur);cur=""}
    else if(ch===NL){row.push(cur);rows.push(row);row=[];cur=""}
    else if(ch!==CR)cur+=ch}
  if(cur!==""||row.length){row.push(cur);rows.push(row)}
  return rows;
}

function impParseMatrix(rows,color){
  const items=[],errors=[];
  if(!rows||!rows.length)return{items,errors};
  const cell=(r,i)=>String((r&&r[i]!=null?r[i]:"")).trim();

  /* find the header row: the one whose first cell is \u0631\u062f\u06cc\u0641, else the first
     row that has at least two non-numeric labels after column 0 */
  let hi=-1;
  for(let i=0;i<Math.min(rows.length,8);i++){
    const c0=cell(rows[i],0);
    if(c0.indexOf("\u0631\u062f\u06cc\u0641")>=0){hi=i;break}
  }
  if(hi<0){
    for(let i=0;i<Math.min(rows.length,8);i++){
      const r=rows[i]||[];
      let labels=0;
      for(let c=1;c<r.length;c++){const v=cell(r,c);if(v&&isNaN(Number(latinDigits(v))))labels++}
      if(labels>=2){hi=i;break}
    }
  }
  if(hi<0)return{items,errors};

  /* keep the real column index for every brand -- never re-index */
  const brandCols=[];
  const hrow=rows[hi]||[];
  for(let c=1;c<hrow.length;c++){
    const name=cell(hrow,c);
    if(!name)continue;
    if(name.indexOf("\u062c\u0645\u0639")>=0)continue;
    brandCols.push({c,brand:name});
  }
  if(!brandCols.length)return{items,errors};

  const agg=new Map();   /* brand|length -> qty */
  for(let ri=hi+1;ri<rows.length;ri++){
    const r=rows[ri];if(!r)continue;
    const first=cell(r,0);
    /* skip the summary block (\u0633\u0627\u0646\u062a\u06cc \u0645\u062a\u0631 / \u0645\u062a\u0631 \u0637\u0648\u0644 / \u0645\u062a\u0631 \u0645\u0631\u0628\u0639 / \u062c\u0645\u0639 \u06a9\u0644) */
    if(/\u0633\u0627\u0646\u062a\u06cc|\u0645\u062a\u0631|\u062c\u0645\u0639/.test(first))continue;
    /* skip a repeated header row */
    let looksHeader=0;
    brandCols.forEach(bc=>{const v=cell(r,bc.c);if(v&&isNaN(Number(latinDigits(v))))looksHeader++});
    if(looksHeader>=2)continue;
    brandCols.forEach(bc=>{
      const raw=cell(r,bc.c);
      if(!raw)return;
      const len=Math.round(Number(latinDigits(raw).replace(/[^0-9.]/g,"")));
      if(!len||isNaN(len)||len<=0||len>2000)return;
      const k=bc.brand+"\u0001"+len;
      agg.set(k,(agg.get(k)||0)+1);
    });
  }
  let n=hi+2;
  agg.forEach((qty,k)=>{
    const [brand,len]=k.split("\u0001");
    items.push({brand,th:"\u06f4 \u0645\u06cc\u0644",color,w:125,l:Number(len),sq:qty,sj:0,minp:0,sale:0,minSt:0,n:n++});
  });
  items.sort((a,b)=>a.brand.localeCompare(b.brand,"fa")||a.l-b.l);
  return{items,errors};
}
function impCheckDups(){
  if(!imp)return;
  imp.dups=[];
  imp.items=imp.items.filter(item=>{
    const ex=DB.products.find(p=>p.brand===item.brand&&p.thickness===item.th&&p.color===item.color&&p.width===item.w&&p.length===item.l);
    if(ex){item.exId=ex.id;item.action=(imp&&imp.matrix)?"merge":"skip";imp.dups.push(item);return false}
    return true;
  });
}

  rows=(rows||[]).filter(r=>r&&r.some(c=>String(c==null?"":c).trim()!==""));
  if(rows.length<2){body.innerHTML='<div class="notice red">فایل خالی است یا فقط سرستون دارد.</div>';return}
  const head=rows[0].map(h=>String(h==null?"":h).trim());
  const find=(...keys)=>head.findIndex(h=>keys.some(k=>h.includes(k)));
  const ci={brand:find("برند"),th:find("ضخامت"),color:find("رنگ"),w:find("عرض"),l:find("طول"),
    sq:head.findIndex(h=>h.includes("موجودی")&&h.includes("قم")),

    minp:find("حداقل قیمت"),
    minSt:head.findIndex(h=>h.includes("حداقل موجودی")||h.includes("هشدار")),
    pm2:find("مترمربع"),
    shelf:find("قفسه","محل نگهداری")};
  if(ci.brand<0||ci.w<0||ci.l<0){body.innerHTML='<div class="notice red">ستون‌های برند / عرض / طول در فایل پیدا نشد.</div>';return}
  imp={items:[],errors:[],dups:[]};
  rows.slice(1).forEach((r,idx)=>{
    const n=idx+2;
    const get=i=>i>=0?String(r[i]==null?"":r[i]).trim():"";
    const brand=get(ci.brand),th=get(ci.th)||"۴ میل",color=get(ci.color);
    const w=Math.floor(deNum(get(ci.w))),l=Math.floor(deNum(get(ci.l)));
    if(!brand){imp.errors.push({n,msg:"برند خالی است"});return}
    if(!color){imp.errors.push({n,msg:"رنگ خالی است"});return}
    if(!(w>0)||!(l>0)){imp.errors.push({n,msg:"عرض یا طول نامعتبر"});return}
    let sale=deNum(get(ci.sale))||0;
    const pm2=deNum(get(ci.pm2))||0;
    if(!sale&&pm2>0)sale=Math.round(w*l*pm2/10000);
    const item={brand,th,color,w,l,sq:Math.floor(deNum(get(ci.sq)))||0,sj:Math.floor(deNum(get(ci.sj)))||0,minp:deNum(get(ci.minp))||0,sale,minSt:Math.floor(deNum(get(ci.minSt)))||5,shelf:get(ci.shelf),n};
    const ex=DB.products.find(p=>p.brand===brand&&p.thickness===th&&p.color===color&&p.width===w&&p.length===l);
    if(ex){item.exId=ex.id;item.action="skip";imp.dups.push(item)}else imp.items.push(item);
  });

function impRender(){

  ${(imp.items.length||imp.dups.length)?`<div class="actions"><button class="btn primary" onclick="impCommit()">تأیید و ثبت همه</button></div>`:""}`;

function impCommit(){
  if(!imp)return;
  let added=0,merged=0,replaced=0,skipped=0;
  imp.items.forEach(t=>{
    const p={id:uid(),brand:t.brand,thickness:t.th,color:t.color,width:t.w,length:t.l,stock:{qom:0,jaf:0},minStock:t.minSt,costPrice:0,salePrice:t.sale,minPrice:t.minp,shelf:t.shelf||""};
    DB.products.push(p);if(!(p.minPrice>0))pmAdd(p.id);
    [["qom",t.sq],["jaf",t.sj]].forEach(([wh,qn])=>{
      if(qn>0){
        InventoryEngine.receive({ productId: p.id, warehouseId: wh, quantity: qn, referenceType: 'xlsx_import', referenceId: '', reason: 'ورود از اکسل' });
        DB.counters.entry++;
        DB.entries.push({id:uid(),number:"I-"+DB.counters.entry,productId:p.id,name:prodName(p),qty:qn,buyPrice:0,shippingTotal:0,supplier:"ورود از اکسل",wh,date:todayISO(),note:"ورود از اکسل"});
      }
    });
    added++;
  });
  imp.dups.forEach(t=>{
    const p=DB.products.find(x=>x.id===t.exId);if(!p){skipped++;return}
    if(t.action==="replace"){
      const qomDiff=t.sq-(p.stock.qom||0),jafDiff=t.sj-(p.stock.jaf||0);
      if(qomDiff>0)InventoryEngine.receive({ productId: p.id, warehouseId: 'qom', quantity: qomDiff, referenceType: 'xlsx_import', referenceId: '', reason: 'ورود از اکسل - جایگزینی' });
      else if(qomDiff<0)InventoryEngine.sell({ productId: p.id, warehouseId: 'qom', quantity: -qomDiff, referenceType: 'xlsx_import', referenceId: '', reason: 'ورود از اکسل - جایگزینی' });
      if(jafDiff>0)InventoryEngine.receive({ productId: p.id, warehouseId: 'jaf', quantity: jafDiff, referenceType: 'xlsx_import', referenceId: '', reason: 'ورود از اکسل - جایگزینی' });
      else if(jafDiff<0)InventoryEngine.sell({ productId: p.id, warehouseId: 'jaf', quantity: -jafDiff, referenceType: 'xlsx_import', referenceId: '', reason: 'ورود از اکسل - جایگزینی' });
      p.minStock=t.minSt;p.salePrice=t.sale;p.minPrice=t.minp;if(t.shelf)p.shelf=t.shelf;if(!(p.minPrice>0))pmAdd(p.id);replaced++;
    }
    else if(t.action==="merge"){
      if(t.sq>0)InventoryEngine.receive({ productId: p.id, warehouseId: 'qom', quantity: t.sq, referenceType: 'xlsx_import', referenceId: '', reason: 'ورود از اکسل - ادغام' });
      if(t.sj>0)InventoryEngine.receive({ productId: p.id, warehouseId: 'jaf', quantity: t.sj, referenceType: 'xlsx_import', referenceId: '', reason: 'ورود از اکسل - ادغام' });
      if(t.sale)p.salePrice=t.sale;if(t.minp)p.minPrice=t.minp;if(t.shelf)p.shelf=t.shelf;merged++;
    }
    else skipped++;
  });
  const errs=imp.errors.slice();
  save();render();
  openModal(`<h3>گزارش ورود از اکسل</h3>
  <div class="pc-stocks" style="margin:12px 0"><div><span>ثبت‌شده</span><b class="num">${faNum(added)}</b></div><div><span>ویرایش/جایگزین</span><b class="num">${faNum(merged+replaced)}</b></div><div><span>خطا</span><b class="num">${faNum(errs.length)}</b></div><div class="tot"><span>تکراری ردشده</span><b class="num">${faNum(skipped)}</b></div></div>
  ${errs.length?`<div class="notice red">${errs.map(e=>`ردیف ${faNum(e.n)}: ${e.msg}`).join("<br>")}</div>`:""}
  <div class="actions"><button class="btn primary" onclick="closeModal()">باشه</button></div>`);
  imp=null;
}

function saveNewProduct(fromInvoice){
  const g=id=>{const el=document.querySelector(id);return el?el.value.trim():""};
  const brand=g("#np-brand"),th=g("#np-th"),color=g("#np-color");
  const w=Math.floor(deNum(g("#np-w"))),l=Math.floor(deNum(g("#np-l")));
  if(!brand||!th||!color||w<=0||l<=0){toast("برند، ضخامت، رنگ و ابعاد را کامل وارد کنید.");return}
  if(DB.products.some(p=>p.brand===brand&&p.thickness===th&&p.color===color&&p.width===w&&p.length===l)){toast("این کالا قبلاً تعریف شده است.");return}
  const p={id:uid(),brand,thickness:th,color,width:w,length:l,stock:{qom:0,jaf:0},minStock:Math.floor(deNum(g("#np-min")))||5,costPrice:deNum(g("#np-cost")),salePrice:deNum(g("#np-price")),minPrice:deNum(g("#np-minprice")),shelf:g("#np-shelf")};
  DB.products.push(p);
  if(!(p.minPrice>0))(DB.pendingMin=DB.pendingMin||[]).push(p.id);
  const qomQty=Math.floor(deNum(g("#np-sq"))),jafQty=Math.floor(deNum(g("#np-sj")));
  [["qom",qomQty],["jaf",jafQty]].forEach(([wh,qn])=>{
    if(qn>0){
      InventoryEngine.receive({ productId: p.id, warehouseId: wh, quantity: qn, referenceType: 'new_product', referenceId: '', reason: 'ثبت هنگام تعریف کالا' });
      DB.counters.entry++;
      DB.entries.push({id:uid(),number:"I-"+DB.counters.entry,productId:p.id,name:prodName(p),qty:qn,buyPrice:p.costPrice||0,shippingTotal:0,supplier:"موجودی اولیه",wh,date:todayISO(),note:"ثبت هنگام تعریف کالا"});
    }
  });
  save();closeModal();
  if(fromInvoice&&draft){draft.form={brand:p.brand,thickness:p.thickness,color:p.color,pid:p.id,wh:draft.form.wh||"qom",qty:draft.form.qty||"",price:""}}
  render();toast("کالا تعریف شد: "+prodName(p));
}

function doQuickAdd(andInvoice){
  const g=id=>{const el=document.querySelector(id);return el?el.value.trim():""};
  const brand=g("#qa-brand"),color=g("#qa-color"),th=g("#qa-th")||"۴ میل";
  const w=Math.floor(deNum(g("#qa-w")))||125,l=Math.floor(deNum(g("#qa-l")));
  const shelf=g("#qa-shelf"),wh=g("#qa-wh")||"qom";
  const qty=Math.floor(deNum(g("#qa-qty")))||1,price=deNum(g("#qa-price"));
  if(!brand||!color||l<=0){toast("برند، رنگ و طول را وارد کنید.");return}
  let p=DB.products.find(x=>x.brand===brand&&x.thickness===th&&x.color===color&&x.width===w&&x.length===l);
  if(!p){
    p={id:uid(),brand,thickness:th,color,width:w,length:l,stock:{qom:0,jaf:0},minStock:5,costPrice:0,salePrice:price||0,minPrice:0,shelf};
    DB.products.push(p);
    if(!(p.minPrice>0))(DB.pendingMin=DB.pendingMin||[]).push(p.id);
  }else{
    if(shelf)p.shelf=shelf;
    if(price)p.salePrice=price;
  }
  InventoryEngine.receive({ productId: p.id, warehouseId: wh, quantity: qty, referenceType: 'quick_add', referenceId: '', reason: 'افزودن سریع' });
  DB.counters.entry++;
  DB.entries.push({id:uid(),number:"I-"+DB.counters.entry,productId:p.id,name:prodName(p),qty,buyPrice:0,shippingTotal:0,supplier:"افزودن سریع",wh,date:todayISO(),note:"افزودن سریع"});
  save();
  if(andInvoice){
    draft=newDraft("invoice");
    const area=w*l/10000;
    const itemPrice=price||p.salePrice||p.minPrice||0;
    draft.items.push({productId:p.id,name:prodName(p),qty:1,price:itemPrice,cost:p.costPrice,wh,width:w,length:l,unit:"m2",unitPrice:area>0?Math.round(itemPrice/area):itemPrice});
    closeModal();go("newInvoice");
    toast(prodName(p)+" به فاکتور اضافه شد.");
  }else{
    closeModal();render();
    toast(faNum(qty)+" ورق "+prodName(p)+" به انبار اضافه شد.");
  }
}

function qaParseLens(){
  const el=document.querySelector("#qa-page-lens");if(!el)return;
  const text=el.value.trim();if(!text)return;
  const w=Math.floor(deNum(_qaState.w))||125;
  const toks=latinDigits(text).split(/[\s,،٬;\-]+/).filter(Boolean);
  let added=0;
  toks.forEach(t=>{
    const m=t.match(/^([0-9]+(?:\.[0-9]+)?)(?:[xX*×]([0-9]+))?$/);if(!m)return;
    const l=Math.floor(Number(m[1])),q=Math.floor(Number(m[2]||"1"))||1;
    if(l<=0)return;
    const ex=_qaRows.find(r=>r.l===l);
    if(ex)ex.qty+=q; else _qaRows.push({l,qty:q,w});
    added+=q;
  });
  if(!added){toast("حداقل یک طول معتبر بنویسید.");return}
  el.value="";el.focus();
  window._qaLastAdded=faNum(added)+" سایز به لیست اضافه شد";
  render();
  setTimeout(()=>{const el2=document.querySelector("#qa-page-lens");if(el2)el2.focus()},50);
}
function qaBatchQuick(L){
  const el=document.querySelector("#qa-page-lens");if(!el)return;
  const cur=el.value.trim();
  el.value=cur?(cur+" "+L):String(L);
  el.focus();
}
function qaDelRow(i){_qaRows.splice(i,1);render()}
function qaClearRows(){_qaRows=[];render()}
function doPageQuickAddBatch(andInvoice){
  const g=id=>{const el=document.querySelector(id);return el?el.value.trim():""};
  const brand=g("#qa-page-brand"),color=g("#qa-page-color"),th=g("#qa-page-th")||"۴ میل";
  const w=Math.floor(deNum(g("#qa-page-w")))||125;
  const shelf=g("#qa-page-shelf"),wh=g("#qa-page-wh")||"qom";
  const price=deNum(g("#qa-page-price"));
  if(!_qaRows.length){toast("حداقل یک طول اضافه کنید.");return}
  if(!brand||!color){toast("برند و رنگ را وارد کنید.");return}
  let added=0;
  const addedProducts=[];
  _qaRows.forEach(r=>{
    for(let i=0;i<r.qty;i++){
      let p=DB.products.find(x=>x.brand===brand&&x.thickness===th&&x.color===color&&x.width===w&&x.length===r.l);
      if(!p){
        p={id:uid(),brand,thickness:th,color,width:w,length:r.l,stock:{qom:0,jaf:0},minStock:5,costPrice:0,salePrice:price||0,minPrice:0,shelf};
        DB.products.push(p);
        if(!(p.minPrice>0))(DB.pendingMin=DB.pendingMin||[]).push(p.id);
      }else{
        if(shelf)p.shelf=shelf;
        if(price)p.salePrice=price;
      }
      InventoryEngine.receive({ productId: p.id, warehouseId: wh, quantity: 1, referenceType: 'quick_add_batch', referenceId: '', reason: 'افزودن سریع' });
      DB.counters.entry++;
      DB.entries.push({id:uid(),number:"I-"+DB.counters.entry,productId:p.id,name:prodName(p),qty:1,buyPrice:0,shippingTotal:0,supplier:"افزودن سریع",wh,date:todayISO(),note:"افزودن سریع"});
      addedProducts.push(p);
      added++;
    }
  });
  _qaState={brand,color,th,w:String(w),shelf,wh,price:price?String(price):""};
  _qaRows=[];
  window._qaLastAdded=faNum(added)+" ورق اضافه شد";
  save();
  if(andInvoice){
    draft=newDraft("invoice");
    addedProducts.forEach(p=>{
      const area=p.width*p.length/10000;
      const itemPrice=p.salePrice||p.minPrice||0;
      draft.items.push({productId:p.id,name:prodName(p),qty:1,price:itemPrice,cost:p.costPrice,wh,width:p.width,length:p.length,unit:"m2",unitPrice:area>0?Math.round(itemPrice/area):itemPrice});
    });
    go("newInvoice");
    toast(faNum(added)+" ورق به فاکتور اضافه شد.");
  }else{
    render();
    setTimeout(()=>{const el=document.querySelector("#qa-page-lens");if(el)el.focus()},50);
    toast(faNum(added)+" ورق به انبار اضافه شد.");
  }
}

function entryCalc(){const q=deNum(document.querySelector("#en-qty").value),b=deNum(document.querySelector("#en-buy").value),s=deNum(document.querySelector("#en-ship").value);document.querySelector("#en-calc").textContent="قیمت تمام‌شده هر ورق: "+(q>0&&b>0?toman((q*b+s)/q):"—")}
function saveEntry(){
  const p=getProd(document.querySelector("#en-p").value);const wh=document.querySelector("#en-wh").value;
  const qty=Math.floor(deNum(document.querySelector("#en-qty").value)),buy=deNum(document.querySelector("#en-buy").value),ship=deNum(document.querySelector("#en-ship").value);
  if(!p||qty<=0){toast("تعداد ورق را وارد کنید.");return}
  const dateISO=jdToISO(document.querySelector("#en-date").value)||todayISO();
  const unitCost=qty>0?(qty*buy+ship)/qty:0;
  const before=totStock(p);
  if(unitCost>0)p.costPrice=(before>0&&p.costPrice>0)?Math.round((before*p.costPrice+qty*unitCost)/(before+qty)):Math.round(unitCost);
  InventoryEngine.receive({ productId: p.id, warehouseId: wh, quantity: qty, referenceType: 'entry', referenceId: '', reason: 'ورود کالا' });
  DB.counters.entry++;
  DB.entries.push({id:uid(),number:"I-"+DB.counters.entry,productId:p.id,name:prodName(p),qty,buyPrice:buy,shippingTotal:ship,supplier:document.querySelector("#en-sup").value.trim(),wh,date:dateISO,note:""});

function renderCustomerPrices(customerId) {
  const prices = DB.customerPrices.filter(cp => cp.customerId === customerId);
  if (prices.length === 0) {
    return '<div class="sub">هنوز قیمت اختصاصی تعریف نشده است.</div>';
  }
  
  return `
    <div class="tblwrap"><table class="statement-table">

      <tbody>
      ${prices.map(cp => {
        const product = getProd(cp.productId);
        const now = todayISO();
        const isValid = (!cp.validFrom || cp.validFrom <= now) && (!cp.validUntil || cp.validUntil >= now);
        const isExpired = cp.validUntil && cp.validUntil < now;
        return `
          <tr>
            <td>${product ? esc(prodName(product)) : '<span class="sub">محصول حذف شده</span>'}</td>
            <td class="num">${fmt(cp.price)}</td>

            <td class="num">${cp.validUntil ? faDate(cp.validUntil) : '—'}</td>
            <td><span class="badge ${isValid ? 'green' : isExpired ? 'red' : 'gray'}">${isValid ? 'فعال' : isExpired ? 'منقضی' : 'آینده'}</span></td>
            <td>
              <button class="btn sm" onclick="editCustomerPrice('${customerId}','${cp.id}')">ویرایش</button>
              <button class="btn sm danger" onclick="deleteCustomerPrice('${customerId}','${cp.id}')">حذف</button>
            </td>
          </tr>
        `;
      }).join('')}
      </tbody>
    </table></div>
  `;
}

function saveCustomerPrice(customerId, priceId) {
  const productId = document.getElementById('cp-product').value;
  const price = deNum(document.getElementById('cp-price').value);
  const validFrom = document.getElementById('cp-from').value || null;
  const validUntil = document.getElementById('cp-until').value || null;
  
  if (!productId) {
    toast('محصول را انتخاب کنید');
    return;
  }
  
  if (price <= 0) {
    toast('قیمت را وارد کنید');
    return;
  }
  
  // Validate price against minimum
  const product = getProd(productId);
  if (product && product.minPrice && price < product.minPrice && !isManager()) {
    toast('قیمت کمتر از حداقل مجاز است: ' + fmt(product.minPrice));
    return;
  }
  
  if (validFrom && validUntil && validFrom > validUntil) {
    toast('تاریخ پایان باید بعد از تاریخ شروع باشد');
    return;
  }
  
  CustomerPricing.setPrice(customerId, productId, price, validFrom, validUntil);
  closeModal();
  render();
  toast('قیمت اختصاصی ذخیره شد');
}

function editCustomerPrice(customerId, priceId) {
  openCustomerPriceModal(customerId, priceId);
}

function deleteCustomerPrice(customerId, priceId) {
  if (!confirm('آیا از حذف قیمت اختصاصی اطمینان دارید؟')) return;
  CustomerPricing.removePrice(customerId, priceId);
  render();
  toast('قیمت اختصاصی حذف شد');
}

function backupExport(){
  const data=JSON.stringify({app:"composite-sales",version:5,exportedAt:new Date().toISOString(),db:DB});
  const blob=new Blob([data],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="backup-"+todayISO().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast("فایل پشتیبان دانلود شد. آن را در جای امن نگه دارید.");
}
function applyBackup(text,name){
  let j=null;try{j=JSON.parse(text)}catch(e){toast("فایل پشتیبان معتبر نیست.");return false}
  const db=(j&&j.db&&Array.isArray(j.db.products))?j.db:((j&&Array.isArray(j.products))?j:null);
  if(!db||!Array.isArray(db.customers)||!Array.isArray(db.invoices)){toast("فایل پشتیبان معتبر نیست.");return false}
  if(!confirm("همه اطلاعات فعلی اپ با فایل پشتیبان جایگزین می‌شود. ادامه می‌دهید؟"))return false;
  db.cards=db.cards||[];db.activity=db.activity||[];db.payments=db.payments||[];db.counters=db.counters||DB.counters;db.truckHistory=db.truckHistory||[];db.stocktaking=db.stocktaking||[];db.auditLog=db.auditLog||[];db.roles=db.roles||[];db.brandMemory=db.brandMemory||{};
  DB=db;logAct("backup","بازیابی فایل پشتیبان"+(name?" ("+name+")":""));save();render();toast("اطلاعات از فایل پشتیبان بازیابی شد.");return true;
}
function backupImport(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
  inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>applyBackup(String(r.result),f.name);r.readAsText(f)};
  inp.click();
}

function openStocktakingSession(id){

    <table class="tbl"><thead><tr><th>برند</th><th>رنگ</th><th>ابعاد</th><th>سیستم قم</th><th>سیستم جعفریه</th><th>سیستم کل</th><th>شمارش قم</th><th>شمارش جعفریه</th><th>اختلاف</th></tr></thead><tbody>
    ${s.items.map((i,idx)=>`<tr${i.counted!==null&&(i.counted.qom!==i.qom||i.counted.jaf!==i.jaf)?' style="background:rgba(255,193,7,.08)"':''}>
      <td>${esc(i.brand)}</td><td>${esc(i.color)}</td><td class="num">${faNum(i.width)}×${faNum(i.length)}</td>
      <td class="num">${fmt(i.qom)}</td><td class="num">${fmt(i.jaf)}</td><td class="num"><b>${fmt(i.total)}</b></td>
      <td><input class="stk-qom" data-idx="${idx}" inputmode="numeric" value="${i.counted!==null?i.counted.qom:""}" placeholder="—" ${s.applied?"disabled":""} oninput="stkUpdate(${idx})" style="width:60px;text-align:center"></td>
      <td><input class="stk-jaf" data-idx="${idx}" inputmode="numeric" value="${i.counted!==null?i.counted.jaf:""}" placeholder="—" ${s.applied?"disabled":""} oninput="stkUpdate(${idx})" style="width:60px;text-align:center"></td>
      <td class="num ${i.counted!==null?(i.diff>0?"pos":i.diff<0?"neg":""):''}">${i.counted!==null?(i.diff>0?"+"+fmt(i.diff):i.diff<0?fmt(i.diff):"—"):"—"}</td>
    </tr>`).join("")}
    </tbody></table></div>
    ${!s.applied?`<div class="actions" style="margin-top:12px">
      <button class="btn primary" onclick="applyStocktaking('${s.id}')">اعمال اختلافات روی موجودی</button>
      <button class="btn" onclick="saveStocktaking('${s.id}')">ذخیره موقت</button>
      <button class="btn danger" onclick="deleteStocktaking('${s.id}')">حذف</button>
      <button class="btn" onclick="closeModal()">بستن</button>
    </div>`:`<div class="actions"><button class="btn" onclick="closeModal()">بستن</button></div>`}`,true);
}
function stkUpdate(idx){
  const s=window._stk;if(!s)return;
  const qomEl=document.querySelectorAll(".stk-qom")[idx];
  const jafEl=document.querySelectorAll(".stk-jaf")[idx];
  if(!qomEl||!jafEl)return;
  const qom=qomEl.value.trim()===""?null:Math.floor(Number(latinDigits(qomEl.value)));
  const jaf=jafEl.value.trim()===""?null:Math.floor(Number(latinDigits(jafEl.value)));
  if(qom!==null&&jaf!==null){
    s.items[idx].counted={qom,jaf};
    s.items[idx].diff=(qom+jaf)-s.items[idx].total;
  }else{
    s.items[idx].counted=null;
    s.items[idx].diff=0;
  }
}
function saveStocktaking(id){
  const s=(DB.stocktaking||[]).find(x=>x.id===id);if(!s)return;
  save();closeModal();toast("انبارگردانی ذخیره شد.");
}
function applyStocktaking(id){
  const s=(DB.stocktaking||[]).find(x=>x.id===id);if(!s)return;
  const diffs=s.items.filter(i=>i.counted!==null&&i.diff!==0);
  if(!diffs.length){toast("اختلافی وجود ندارد یا شمارشی ثبت نشده.");return}
  if(!confirm("آیا مطمئن هستید؟ تعداد "+fmt(diffs.length)+" کالا تغییر خواهد کرد."))return;
  diffs.forEach(i=>{
    const p=getProd(i.productId);if(!p)return;
    InventoryEngine.adjust({ productId: p.id, warehouseId: 'qom', newQuantity: i.counted.qom, referenceType: 'stocktaking', referenceId: s.id, reason: 'انبارگردانی ' + s.date });
    InventoryEngine.adjust({ productId: p.id, warehouseId: 'jaf', newQuantity: i.counted.jaf, referenceType: 'stocktaking', referenceId: s.id, reason: 'انبارگردانی ' + s.date });
  });
  s.applied=true;
  s.appliedAt=new Date().toISOString();
  save();closeModal();render();
  toast("انبارگردانی اعمال شد: "+fmt(diffs.length)+" کالا تغییر یافت.");
}
function deleteStocktaking(id){
  if(!confirm("آیا این انبارگردانی حذف شود؟"))return;
  DB.stocktaking=(DB.stocktaking||[]).filter(x=>x.id!==id);
  save();closeModal();render();toast("انبارگردانی حذف شد.");
}

/* =============== shelf report (گزارش قفسه‌بندی انبار) =============== */
let shSel={},shQ="",shBrand="",shColor="",shShelf=null,shOnlyStock=true,shView="group";
function canEditShelf(){return PermissionService.hasPermission('inventory.shelf')}
function shelfOf(p){return (p.shelf||"").trim()}
function allShelves(){
  const m=new Map();
  (DB.products||[]).forEach(p=>{
    const s=shelfOf(p);if(!s)return;
    if(!m.has(s))m.set(s,{name:s,items:[],qty:0,area:0});
    const g=m.get(s);const t=totStock(p);
    g.items.push(p);g.qty+=t;g.area+=t*(p.width*p.length/10000);
  });
  return [...m.values()].sort((a,b)=>a.name.localeCompare(b.name,"fa",{numeric:true}));
}
function shList(){
  let list=(DB.products||[]).slice();
  if(shOnlyStock)list=list.filter(p=>totStock(p)>0||shSel[p.id]);
  if(shBrand)list=list.filter(p=>p.brand===shBrand);
  if(shColor)list=list.filter(p=>p.color===shColor);
  if(shShelf==="__none__")list=list.filter(p=>!shelfOf(p));
  else if(shShelf)list=list.filter(p=>shelfOf(p)===shShelf);
  const q=normDim(String(shQ||"").trim());
  if(q)list=list.filter(p=>{
    const hay=normDim(p.brand+" "+p.color+" "+p.thickness+" "+p.width+"x"+p.length+" "+(p.shelf||""));
    return q.split(/\s+/).every(t=>hay.includes(t));
  });
  return list.sort((a,b)=>a.brand.localeCompare(b.brand,"fa")||a.color.localeCompare(b.color,"fa")||a.length-b.length);
}
function shCount(){return Object.keys(shSel).length}
function shToggle(pid){if(shSel[pid])delete shSel[pid];else shSel[pid]=1;rerender()}
function shSelectAll(){shList().forEach(p=>shSel[p.id]=1);rerender()}
function shClear(){shSel={};rerender()}
function shSelectShelf(name){
  (DB.products||[]).forEach(p=>{
    const s=shelfOf(p);
    if(name==="__none__"?!s:s===name)shSel[p.id]=1;
  });
  rerender();
}
function shAssign(target){
  if(!canEditShelf()){toast("\u062f\u0633\u062a\u0631\u0633\u06cc \u062c\u0627\u0628\u0647\u200c\u062c\u0627\u06cc\u06cc \u0642\u0641\u0633\u0647 \u0631\u0627 \u0646\u062f\u0627\u0631\u06cc\u062f.");return}
  const ids=Object.keys(shSel);
  if(!ids.length){toast("\u0627\u0628\u062a\u062f\u0627 \u06a9\u0627\u0644\u0627\u0647\u0627 \u0631\u0627 \u0627\u0646\u062a\u062e\u0627\u0628 \u06a9\u0646\u06cc\u062f.");return}
  const val=String(target==null?((document.getElementById("sh-target")||{}).value||""):target).trim();
  const before=ids.map(id=>{const p=getProd(id);return p?{id,shelf:p.shelf||""}:null}).filter(Boolean);
  let n=0;
  ids.forEach(id=>{const p=getProd(id);if(p){p.shelf=val;n++}});
  save();
  auditLog("shelf_bulk",(val?"\u0627\u0646\u062a\u0642\u0627\u0644 \u06af\u0631\u0648\u0647\u06cc \u0628\u0647 \u0642\u0641\u0633\u0647 "+val:"\u062d\u0630\u0641 \u06af\u0631\u0648\u0647\u06cc \u0642\u0641\u0633\u0647")+" \u2014 "+n+" \u06a9\u0627\u0644\u0627",before,{shelf:val},{module:"inventory"});
  logAct("inventory",(val?"\u0627\u0646\u062a\u0642\u0627\u0644 ":"\u062e\u0627\u0644\u06cc \u06a9\u0631\u062f\u0646 \u0642\u0641\u0633\u0647 ")+faNum(n)+" \u06a9\u0627\u0644\u0627"+(val?" \u0628\u0647 \u0642\u0641\u0633\u0647 "+val:""));
  shSel={};rerender();
  toast(faNum(n)+" \u06a9\u0627\u0644\u0627 "+(val?"\u0628\u0647 \u0642\u0641\u0633\u0647 \u00ab"+val+"\u00bb \u0645\u0646\u062a\u0642\u0644 \u0634\u062f.":"\u0627\u0632 \u0642\u0641\u0633\u0647 \u062e\u0627\u0631\u062c \u0634\u062f."));
}
function shRenameShelf(oldName){
  if(!canEditShelf()){toast("\u062f\u0633\u062a\u0631\u0633\u06cc \u0646\u062f\u0627\u0631\u06cc\u062f.");return}
  const shelves=allShelves();
  openModal(`<h3>\u0648\u06cc\u0631\u0627\u06cc\u0634 \u0642\u0641\u0633\u0647 \u00ab${esc(oldName)}\u00bb</h3>
    <div class="field"><label>\u0646\u0627\u0645 \u062c\u062f\u06cc\u062f</label><input id="sh-newname" value="${esc(oldName)}" onkeydown="if(event.key==='Enter')shDoRename('${esc(oldName).replace(/'/g,"\\'")}')"></div>
    <div class="notice blue">\u0627\u06af\u0631 \u0646\u0627\u0645 \u06cc\u06a9 \u0642\u0641\u0633\u0647 \u0645\u0648\u062c\u0648\u062f \u0631\u0627 \u0628\u0632\u0646\u06cc\u062f\u060c \u062f\u0648 \u0642\u0641\u0633\u0647 \u062f\u0631 \u0647\u0645 \u0627\u062f\u063a\u0627\u0645 \u0645\u06cc\u200c\u0634\u0648\u0646\u062f.</div>
    ${shelves.length?`<div class="sh-chips">${shelves.filter(s=>s.name!==oldName).map(s=>`<button class="sh-chip" onclick="document.getElementById('sh-newname').value='${esc(s.name).replace(/'/g,"\\'")}'">${esc(s.name)}</button>`).join("")}</div>`:""}
    <div class="actions">
      <button class="btn primary" onclick="shDoRename('${esc(oldName).replace(/'/g,"\\'")}')">\u0630\u062e\u06cc\u0631\u0647</button>

      <button class="btn" onclick="closeModal()">\u0627\u0646\u0635\u0631\u0627\u0641</button>

function shDoRename(oldName){
  const v=((document.getElementById("sh-newname")||{}).value||"").trim();
  if(!v){toast("\u0646\u0627\u0645 \u0642\u0641\u0633\u0647 \u062e\u0627\u0644\u06cc \u0627\u0633\u062a.");return}
  let n=0;
  (DB.products||[]).forEach(p=>{if(shelfOf(p)===oldName){p.shelf=v;n++}});
  save();auditLog("shelf_rename","\u062a\u063a\u06cc\u06cc\u0631 \u0646\u0627\u0645 \u0642\u0641\u0633\u0647",{from:oldName},{to:v},{module:"inventory"});
  closeModal();rerender();toast(faNum(n)+" \u06a9\u0627\u0644\u0627 \u0628\u0647 \u00ab"+v+"\u00bb \u0645\u0646\u062a\u0642\u0644 \u0634\u062f.");

function shDoEmpty(name){
  if(!confirm("\u0647\u0645\u0647 \u06a9\u0627\u0644\u0627\u0647\u0627\u06cc \u0627\u06cc\u0646 \u0642\u0641\u0633\u0647 \u0628\u062f\u0648\u0646 \u0642\u0641\u0633\u0647 \u0634\u0648\u0646\u062f\u061f"))return;
  let n=0;
  (DB.products||[]).forEach(p=>{if(shelfOf(p)===name){p.shelf="";n++}});
  save();auditLog("shelf_empty","\u062e\u0627\u0644\u06cc \u06a9\u0631\u062f\u0646 \u0642\u0641\u0633\u0647 "+name,null,null,{module:"inventory"});
  closeModal();rerender();toast(faNum(n)+" \u06a9\u0627\u0644\u0627 \u0627\u0632 \u0642\u0641\u0633\u0647 \u062e\u0627\u0631\u062c \u0634\u062f.");

}

}

function saveShelfInline(el){
  const pid=el.dataset.pid;

/* =============== database management (مدیریت دیتابیس) =============== */
let _dbBackup=null,_dbBackupTime="",_dbBackupAction="";
function dbAutoBackup(action){
  _dbBackup=JSON.parse(JSON.stringify(DB));
  _dbBackupTime=new Date().toLocaleString("fa-IR");
  _dbBackupAction=action;
  try{localStorage.setItem("cs_db_backup",JSON.stringify({db:_dbBackup,time:_dbBackupTime,action:_dbBackupAction}))}catch(e){}
}
function dbLoadSavedBackup(){
  try{const raw=localStorage.getItem("cs_db_backup");if(raw){const d=JSON.parse(raw);if(d&&d.db){_dbBackup=d.db;_dbBackupTime=d.time;_dbBackupAction=d.action}}}catch(e){}
}
function dbRestoreBackup(){
  if(!_dbBackup){toast("بکاپی برای بازیابی وجود ندارد.");return}
  if(!confirm("اطلاعات قبلی بازگردانده شود؟"))return;
  DB=_dbBackup;
  _dbBackup=null;_dbBackupTime="";_dbBackupAction="";
  try{localStorage.removeItem("cs_db_backup")}catch(e){}
  save();render();toast("اطلاعات با موفقیت بازگردانده شد.");
}
function dbClearBackup(){
  _dbBackup=null;_dbBackupTime="";_dbBackupAction="";
  try{localStorage.removeItem("cs_db_backup")}catch(e){}
  render();
}

function dbResetProducts(){
  if(!confirm("آیا از حذف تمام کالاها مطمئن هستید؟"))return;
  dbAutoBackup("حذف تمام کالاها");
  DB.products=[];
  DB.pendingMin=[];
  DB.entries=[];
  DB.truckHistory=[];
  DB.stocktaking=[];
  save();render();toast("تمام کالاها و سوابق ورود حذف شدند. (قابل بازیابی)");
}
function dbResetCustomers(){
  if(!confirm("آیا از حذف تمام مشتریان مطمئن هستید؟"))return;
  dbAutoBackup("حذف تمام مشتریان");
  DB.customers=[];
  save();render();toast("تمام مشتریان حذف شدند. (قابل بازیابی)");
}
function dbResetInvoices(){
  if(!confirm("آیا از حذف تمام فاکتورها و پرداخت‌ها مطمئن هستید؟"))return;
  dbAutoBackup("حذف فاکتورها و پرداخت‌ها");
  DB.invoices=[];
  DB.payments=[];
  DB.counters={invoice:1000,proforma:1000,receipt:1000,entry:1000};
  save();render();toast("تمام فاکتورها و پرداخت‌ها حذف شدند. (قابل بازیابی)");
}
function dbResetEntries(){
  if(!confirm("آیا از حذف سوابق ورود و تخلیه مطمئن هستید؟"))return;
  dbAutoBackup("حذف سوابق ورود و تخلیه");
  DB.entries=[];
  DB.truckHistory=[];
  save();render();toast("تمام سوابق ورود و تخلیه حذف شدند. (قابل بازیابی)");
}
function dbFullReset(){
  if(!confirm("⚠️ هشدار: تمام اطلاعات دیتابیس حذف خواهد شد و به حالت اولیه برمی‌گردد. ادامه می‌دهید؟"))return;
  dbAutoBackup("بازنشانی کامل دیتابیس");
  DB=seed();
  DB.cards=[];DB.activity=[];DB.accounts=[];DB.truckHistory=[];DB.stocktaking=[];DB.auditLog=[];DB.roles=[{id:"admin",name:"مدیر سیستم",permissions:["*"]}];DB.brandMemory={};DB.receivingDraft=null;
  save();render();toast("دیتابیس بازنشانی شد. (قابل بازیابی)");
}

/* =============== Phase 5.5: Audit Center =============== */
let _auditFilters={user:"",action:"",module:"",warehouse:"",dateFrom:"",dateTo:"",reference:""};
function pageAuditLog(){
  if(!isManager())return '<div class="empty">فقط مدیر به این بخش دسترسی دارد.</div>';
  const log=(DB.auditLog||[]).slice().reverse();
  const users=[...new Set(log.map(a=>a.user))].filter(Boolean);
  const actions=[...new Set(log.map(a=>a.action))].filter(Boolean);
  const modules=[...new Set(log.map(a=>a.module))].filter(Boolean);
  const warehouses=[...new Set(log.map(a=>a.warehouse))].filter(Boolean);
  let filtered=log;
  if(_auditFilters.user)filtered=filtered.filter(a=>a.user===_auditFilters.user);
  if(_auditFilters.action)filtered=filtered.filter(a=>a.action===_auditFilters.action);
  if(_auditFilters.module)filtered=filtered.filter(a=>a.module===_auditFilters.module);
  if(_auditFilters.warehouse)filtered=filtered.filter(a=>a.warehouse===_auditFilters.warehouse);
  if(_auditFilters.reference)filtered=filtered.filter(a=>(a.reference||"").includes(_auditFilters.reference));
  if(_auditFilters.dateFrom){const from=jdToISO(_auditFilters.dateFrom);if(from)filtered=filtered.filter(a=>a.date>=from)}
  if(_auditFilters.dateTo){const to=jdToISO(_auditFilters.dateTo);if(to)filtered=filtered.filter(a=>a.date<=to)}
  const display=filtered.slice(0,200);
  return `
  <div class="pagehead"><div><div class="h1">${ic("shield",22)} مرکز ممیزی</div><div class="sub">${faNum(filtered.length)} رویداد از مجموع ${faNum(log.length)}</div></div>
  <button class="btn sm" onclick="exportAuditExcel()">خروجی اکسل</button></div>
  
  <div class="audit-filters">
    <div class="field"><label>کاربر</label><select id="af-user" onchange="_auditFilters.user=this.value;render()"><option value="">همه</option>${users.map(u=>`<option value="${esc(u)}" ${_auditFilters.user===u?"selected":""}>${esc(u)}</option>`).join("")}</select></div>
    <div class="field"><label>عملیات</label><select id="af-action" onchange="_auditFilters.action=this.value;render()"><option value="">همه</option>${actions.map(a=>`<option value="${esc(a)}" ${_auditFilters.action===a?"selected":""}>${esc(a)}</option>`).join("")}</select></div>
    <div class="field"><label>ماژول</label><select id="af-module" onchange="_auditFilters.module=this.value;render()"><option value="">همه</option>${modules.map(m=>`<option value="${esc(m)}" ${_auditFilters.module===m?"selected":""}>${esc(m)}</option>`).join("")}</select></div>
    <div class="field"><label>انبار</label><select id="af-wh" onchange="_auditFilters.warehouse=this.value;render()"><option value="">همه</option>${warehouses.map(w=>`<option value="${esc(w)}" ${_auditFilters.warehouse===w?"selected":""}>${esc(w)}</option>`).join("")}</select></div>
    <div class="field"><label>مرجع</label><input id="af-ref" value="${esc(_auditFilters.reference)}" onchange="_auditFilters.reference=this.value;render()" placeholder="شماره فاکتور..."></div>
    <div class="field"><label>از تاریخ</label><input id="af-from" value="${esc(_auditFilters.dateFrom)}" onchange="_auditFilters.dateFrom=this.value;render()" oninput="jdInput(this)" placeholder="۱۴۰۵/۰۱/۰۱"></div>
    <div class="field"><label>تا تاریخ</label><input id="af-to" value="${esc(_auditFilters.dateTo)}" onchange="_auditFilters.dateTo=this.value;render()" oninput="jdInput(this)" placeholder="۱۴۰۵/۱۲/۲۹"></div>
    <div class="field" style="align-self:flex-end"><button class="btn sm" onclick="_auditFilters={user:'',action:'',module:'',warehouse:'',reference:'',dateFrom:'',dateTo:''};render()">پاک کردن فیلترها</button></div>
  </div>

  <div class="card">
  ${display.length?`<div class="tblwrap"><table class="tbl"><thead><tr><th>زمان</th><th>کاربر</th><th>عملیات</th><th>ماژول</th><th>مرجع</th><th>انبار</th><th>خلاصه</th><th></th></tr></thead><tbody>
  ${display.map((a,i)=>{
    const dotType=a.action==="create"?"create":a.action==="delete"?"delete":a.action==="adjust"?"adjust":"update";
    const summary=a.detail?a.detail.slice(0,50)+(a.detail.length>50?"...":""):"";
    return `<tr style="cursor:pointer" onclick="openAuditDetail(${log.indexOf(a)})">
      <td class="sub">${faDate(a.date)} ${esc(a.time||"")}</td>
      <td><span class="audit-user">${esc(a.user)}</span></td>
      <td><span class="badge ${a.action==="delete"?"red":a.action==="create"?"green":"blue"}">${esc(a.action)}</span></td>
      <td class="sub">${esc(a.module||"—")}</td>
      <td class="sub">${esc(a.reference||"—")}</td>
      <td class="sub">${esc(a.warehouse||"—")}</td>
      <td class="sub">${esc(summary)}</td>
      <td><button class="iconbtn" onclick="event.stopPropagation();openAuditDetail(${log.indexOf(a)})">${ic("info",14)}</button></td>
    </tr>`}).join("")}
  </tbody></table></div>`
  :'<div class="empty">هنوز تغییری ثبت نشده.</div>'}
  </div>`;
}
function openAuditDetail(idx){
  const a=(DB.auditLog||[]).slice().reverse()[idx];
  if(!a)return;
  let oldParsed="",newParsed="";
  try{if(a.oldValue)oldParsed=JSON.stringify(JSON.parse(a.oldValue),null,2)}catch(e){oldParsed=a.oldValue}
  try{if(a.newValue)newParsed=JSON.stringify(JSON.parse(a.newValue),null,2)}catch(e){newParsed=a.newValue}
  openModal(`<h3>جزئیات رویداد</h3>
  <div class="audit-detail-modal">
    <div class="audit-detail-row"><div class="audit-detail-label">کاربر</div><div class="audit-detail-value">${esc(a.user)}</div></div>
    <div class="audit-detail-row"><div class="audit-detail-label">نقش</div><div class="audit-detail-value">${esc(a.role||"—")}</div></div>
    <div class="audit-detail-row"><div class="audit-detail-label">زمان</div><div class="audit-detail-value">${faDateTime(a.date)}</div></div>
    <div class="audit-detail-row"><div class="audit-detail-label">عملیات</div><div class="audit-detail-value">${esc(a.action)}</div></div>
    <div class="audit-detail-row"><div class="audit-detail-label">ماژول</div><div class="audit-detail-value">${esc(a.module||"—")}</div></div>
    <div class="audit-detail-row"><div class="audit-detail-label">مرجع</div><div class="audit-detail-value">${esc(a.reference||"—")}</div></div>
    <div class="audit-detail-row"><div class="audit-detail-label">انبار</div><div class="audit-detail-value">${esc(a.warehouse||"—")}</div></div>
    <div class="audit-detail-row"><div class="audit-detail-label">دستگاه</div><div class="audit-detail-value sub" style="font-size:10px">${esc(a.device||"—")}</div></div>
    ${oldParsed?`<div class="audit-detail-row"><div class="audit-detail-label">مقدار قبل</div><div class="audit-detail-value"><pre style="white-space:pre-wrap;font-size:11px;background:var(--md-surface-variant);padding:8px;border-radius:4px;max-height:150px;overflow:auto">${esc(oldParsed)}</pre></div></div>`:""}
    ${newParsed?`<div class="audit-detail-row"><div class="audit-detail-label">مقدار جدید</div><div class="audit-detail-value"><pre style="white-space:pre-wrap;font-size:11px;background:var(--md-surface-variant);padding:8px;border-radius:4px;max-height:150px;overflow:auto">${esc(newParsed)}</pre></div></div>`:""}
    ${a.detail?`<div class="audit-detail-row"><div class="audit-detail-label">توضیح</div><div class="audit-detail-value">${esc(a.detail)}</div></div>`:""}
  </div>
  <div class="actions"><button class="btn" onclick="closeModal()">بستن</button></div>`);
}
function exportAuditExcel(){
  if(!PermissionService.hasPermission('export')){toast("دسترسی خروجی اکسل ندارید.");return}
  const log=(DB.auditLog||[]).slice().reverse();
  const rows=[["زمان","کاربر","نقش","عملیات","ماژول","مرجع","انبار","توضیح"]];
  log.forEach(a=>rows.push([faDateTime(a.date),a.user,a.role||"",a.action,a.module||"",a.reference||"",a.warehouse||"",a.detail||""]));
  dlCSV("audit-log-"+todayJ().replace(/\//g,"-")+".csv",rows);
}

function openNewRole(){
